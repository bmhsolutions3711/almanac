<!--
  ALMANAC — DETENT.

  One machined plate. A spindle down the right side steps through everything:
  light detents step through things you act on, a HEAVY detent crosses into
  another part of your life. Tabs break at five; a spindle has no fixed number of
  positions, so a new domain is one more detent and never a fifth tab.

  THE LADDER IS AN INDEX PLATE, not a legend. Tap a section name and the spindle
  swings straight to that section's first detent, with the same heavy click the
  boundary earns when rolled across. Rolling is for neighbours; the index is for
  crossing the plate in one move.

  TODAY IS POSITION ZERO WITH A HARD STOP. You cannot roll above it, and one press
  of the plate returns you from anywhere. "First in front of me is always today"
  is a property of the machine, not a rule written on it.

  WHAT THE SPINDLE INDEXES: things you act on. TODAY is the standing — the
  morning answer, served whole from the spine's one judgement, every figure able
  to show its arithmetic in place (tap the row; the working unfolds engraved
  beneath it — the page computes NOTHING). WORK is the board. Learn and Soul are
  one node each — pages you read. Finances expands into one node per obligation,
  read one at a time. Since 2026-08-01 the spindle only READS them: recording a
  bill paid happens on the desk floor, evidenced by the bank row that paid it —
  the lever here keys the radio and closes the book, nothing else.

  THE LATCH IS UNCHANGED and is the thing this whole surface exists to carry: the
  progress of the lever IS the progress of the write. The request leaves at the
  phase boundary, the lever holds under real tension for as long as the network
  takes, and the confirmation is drawn only after a parsed 2xx. On failure the row
  stays standing, the lamp does not change, and the spine's own words say what was
  NOT written. The WALL CLOCK decides, never animation.finished — a hidden document
  freezes its animation timeline and resumes it later, which once fired a $1,500
  write nobody asked for.

  AN EARLY RELEASE ANSWERS OUT LOUD. A tap on a control shaped like a button, met
  with silence, reads as "the button did not capture" — and on a money gesture
  that doubt is worse than a refusal. So releasing before the latch seats says,
  in words, that nothing was written and that the lever is held, not tapped.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2A2F2D">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="detent.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Almanac</title>

<style>
:root{
  --plate:#2A2F2D; --plate-hi:#3A403D; --plate-lo:#1B1F1E; --well:#151817;
  --ink:#E6E9E7; --mid:#B4BBB7; --dim:#98A09C; --etch:#6B726E;
  --lamp:#FFA419; --hot:#FF6A2A; --red:#C4271A; --unknown:#6E6E6E;
  --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
  --engrave:0 -1px .8px rgba(20,23,22,.55), 0 1px 0 rgba(190,198,194,.30);
  --emboss:0 -1.6px 1.2px rgba(14,17,16,.9), 0 1.2px 0 rgba(154,162,158,.46);
  --emboss-lg:0 -2px 1.6px rgba(14,17,16,.92), 0 2px 0 rgba(178,188,182,.34);
  --ease-settle:linear(0,.13 3.2%,.48 8.7%,.79 14.5%,.95 19.6%,1.02 25%,1.03 31%,1 40%,1 100%);
  --ease-refuse:linear(0,.42 12%,-.18 32%,.09 52%,-.03 72%,0 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:#0B0C0C;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);display:grid;place-items:center;
     touch-action:manipulation;overscroll-behavior:none;
     user-select:none;-webkit-user-select:none}

.plate{position:relative;width:100vw;height:100svh;overflow:hidden;background:#2A2F2D}
@media (min-width:640px){
  .plate{width:430px;height:min(900px,96svh);border-radius:10px;
    box-shadow:0 0 0 1px rgba(0,0,0,.7),0 24px 60px -12px rgba(0,0,0,.75),
               inset 0 1px 0 rgba(255,255,255,.06)}
}
/* The plate IS the viewport. Brushed steel is painted to a canvas underneath —
   a CSS gradient cannot do anisotropic grain, and the flat version read as a
   card floating in a void rather than a machined face. */
canvas.steel{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.plate{display:flex;flex-direction:column;padding:22px 26px 18px;gap:0}
.plate > canvas.steel{position:absolute;inset:0}
.plate > .screw{position:absolute;z-index:2}
/* everything else is a row in the column, so height changes redistribute instead
   of piling up at the top */
.topbar{display:flex;align-items:center;gap:16px;z-index:1;flex:0 0 auto;margin-right:78px}
.topbar .kick{flex:1}
/* a faint vertical tooth over the grain, the way anodising catches light */
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.5;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.04) 1px 2px)}
.screw{position:absolute;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#6E756F,#2C302E 68%);
  box-shadow:0 1px 0 rgba(255,255,255,.10),inset 0 -1px 1px rgba(0,0,0,.5)}
.screw::after{content:"";position:absolute;inset:0;margin:auto;width:9px;height:1.6px;
  background:#141716;transform:rotate(28deg)}
.toggle{position:relative;flex:0 0 auto;width:52px;height:27px;border-radius:3px;border:0;padding:0;
  background:linear-gradient(180deg,#222624,#171A19);cursor:pointer;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.07);transition:box-shadow .2s}
.toggle i{position:absolute;left:3px;top:3px;width:23px;height:21px;border-radius:2px;display:block;
  background:linear-gradient(180deg,#D8D3C4,#8C887B);
  box-shadow:0 1px 2px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .16s cubic-bezier(.3,.8,.4,1)}
.toggle[aria-pressed="true"] i{transform:translateX(23px)}
.toggle[aria-pressed="true"]{box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 0 10px -2px var(--lamp)}
.s1{left:12px;top:12px}.s2{right:12px;top:12px}.s3{left:12px;bottom:12px}.s4{right:12px;bottom:12px}

/* the lamp — one light. amber = your hand is needed, dark = it is not. never green. */
.lamp{flex:0 0 auto;width:19px;height:19px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#4A4340,#241F1D 70%);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.07);transition:all .4s}
.lamp.on{background:radial-gradient(circle at 36% 30%,#FFD98A,var(--lamp) 45%,#B96A08 100%);
  box-shadow:0 0 16px -1px rgba(255,164,25,.75),inset 0 1px 2px rgba(255,255,255,.35)}

/* ── readout ───────────────────────────────────────────────────────────── */
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;z-index:1;padding-top:18px;margin-right:78px}
.kick{font:700 12.5px/1 var(--mono);letter-spacing:.24em;color:var(--dim);text-shadow:var(--engrave)}
.kick b{color:var(--lamp);font-weight:700}
.head{margin-top:0;max-width:22ch;font:700 27px/1.08 var(--sans);letter-spacing:.01em;text-transform:uppercase;
  text-shadow:var(--emboss-lg)}
.fig{margin-top:8px;font:700 clamp(40px,12vw,64px)/1 var(--mono);letter-spacing:-.022em;
  font-variant-numeric:tabular-nums slashed-zero;text-shadow:var(--emboss-lg)}
.fig .u{color:var(--unknown);font-weight:400;letter-spacing:.1em;font-size:.6em}
.fig.unk{color:var(--unknown);font-weight:400;letter-spacing:.12em}
.sub{margin-top:12px;max-width:44ch;font:600 12.5px/1.55 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--mid);text-shadow:var(--engrave)}
.why{margin-top:10px;font:400 12px/1.55 var(--mono);letter-spacing:.02em;color:var(--hot)}

/* ── the work: 3 visible, the rest scrolls ─────────────────────────────── */
.work{margin-top:20px;max-width:640px;flex:0 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;
  /* THREE cards, and a sliver of the fourth under the fade. The board WILL grow —
     the point of a fixed window is that growth never eats the page, and the fade is
     the only affordance needed to say there is more below. Measured, not guessed:
     a two-line card is 96px and the gap is 9px, so three is 306 and the extra 22
     leaves a sliver of the fourth showing through the fade. */
  max-height:328px;
  overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 26px),transparent 100%);
          mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 26px),transparent 100%)}
.work::-webkit-scrollbar{width:0}
.card{flex:0 0 auto;background:linear-gradient(180deg,#313735,#232827);border-radius:2px;
  padding:11px 13px;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.35) inset;
  display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.card .t{font:600 14px/1.3 var(--sans);color:var(--ink)}
.card .n{font:700 11.5px/1 var(--mono);letter-spacing:.14em;color:var(--etch);justify-self:end}
.card .m{grid-column:1/-1;display:flex;align-items:center;gap:9px;margin-top:5px}
.card .bar{flex:1;height:3px;background:#171A19;border-radius:2px;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--mid)}
.card .p{font:600 11px/1 var(--mono);letter-spacing:.1em;color:var(--dim);white-space:nowrap}
.card.now{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.35) inset,
  inset 2px 0 0 var(--lamp)}
.card.bryan .n{color:var(--lamp)}

/* ── the standing on the plate: each judgement sentence is an engraved row;
   a figure wearing the dotted mark opens its working in place — served whole
   by the spine, typeset here, computed NOWHERE on this machine ───────────── */
.card.judge{display:block; font:400 13px/1.55 var(--sans); color:var(--mid); cursor:default}
.card.judge b{color:var(--ink); font-weight:700}
.card.judge .jf{font:600 1em var(--mono); color:var(--ink);
  font-variant-numeric:tabular-nums}
.card.judge .jf[data-w]{cursor:pointer;
  text-decoration:underline dotted 1px rgba(255,164,25,.5); text-underline-offset:.2em}
.card.judge.open .jf[data-w]{text-decoration:underline solid 1px var(--lamp)}
.ledgerx{display:block; background:#171A19; box-shadow:inset 0 1px 3px rgba(0,0,0,.55);
  border-radius:2px; padding:9px 11px}
.ledgerx .lr{display:flex; justify-content:space-between; gap:12px; padding:3px 0;
  font:400 12px/1.4 var(--sans); color:var(--dim); border-bottom:1px dotted #232827}
.ledgerx .lr:last-of-type{border-bottom:0}
.ledgerx .lr b{font:600 12px var(--mono); color:var(--ink); font-variant-numeric:tabular-nums}
.ledgerx .lt{display:flex; justify-content:space-between; gap:12px; margin-top:5px;
  padding-top:6px; border-top:3px double #3A403D; font:600 12px/1.4 var(--sans); color:var(--ink)}
.ledgerx .lt b{font:700 12px var(--mono); font-variant-numeric:tabular-nums}
.ledgerx .flag{display:inline-block; width:30px; height:10px; align-self:center;
  background:repeating-linear-gradient(135deg,#6E6E6E 0 5px,#8A8A8A 5px 10px)}
.ledgerx .whole,.ledgerx .lnote{font:italic 400 11.5px/1.5 var(--sans); color:var(--dim);
  padding:2px 0}
.ledgerx .prov{font:600 8.5px/1.4 var(--mono); letter-spacing:.1em; color:var(--etch);
  text-transform:uppercase; margin-top:7px}

/* ── the ladder ────────────────────────────────────────────────────────── */
.ladder{flex:0 0 auto;z-index:1;display:flex;flex-direction:column;gap:9px;padding:18px 0 14px}
/* Each rung is a control on the index plate, so the hit area is a thumb's, not the
   type's — padding grows the target, the negative margin gives the extra back so
   the engraved rhythm of the column does not change. */
.rung{display:flex;align-items:center;gap:9px;font:700 12px/1 var(--mono);letter-spacing:.2em;
  color:var(--dim);transition:color .18s;text-shadow:var(--engrave);
  cursor:pointer;padding:7px 14px 7px 0;margin:-7px 0;border:0;background:none;
  text-align:left;align-self:flex-start}
.rung i{width:14px;height:2px;background:#6B726E;display:block;transition:all .18s}
.rung:active{color:var(--mid)}
.rung.on{color:var(--lamp)}
.rung.on i{background:var(--lamp);width:24px;box-shadow:0 0 8px -1px var(--lamp)}

/* ── the spindle ───────────────────────────────────────────────────────── */
.zone{position:absolute;right:0;top:0;width:92px;height:100%;touch-action:none;cursor:grab;z-index:3}
.zone:active{cursor:grabbing}
canvas.wheel{position:absolute;right:22px;top:84px;width:48px;height:600px;display:block;border-radius:3px;
  box-shadow:0 0 0 1px rgba(0,0,0,.55),inset 0 0 22px rgba(0,0,0,.6),-2px 0 10px -6px rgba(0,0,0,.8)}
.ptr{position:absolute;right:72px;top:0;width:16px;height:16px;pointer-events:none;transform:translateY(-8px)}
.ptr::after{content:"";position:absolute;right:0;top:0;border:8px solid transparent;
  border-right-color:var(--lamp);filter:drop-shadow(0 0 5px rgba(255,164,25,.5))}

/* ── the lever: the write, made physical ───────────────────────────────── */
.lever{position:relative;flex:0 0 auto;z-index:1;margin-right:78px;max-width:640px;height:68px;border-radius:4px;overflow:hidden;
  background:linear-gradient(180deg,#373D3A 0%,#2E3331 40%,#242927 100%);
  box-shadow:0 3px 0 rgba(0,0,0,.6),0 7px 16px rgba(0,0,0,.5),
             inset 0 1px 0 rgba(150,158,154,.22),inset 0 -2px 4px rgba(0,0,0,.5);
  display:grid;place-items:center;touch-action:none;cursor:pointer;border:0;padding:0;width:auto;
  transition:transform .07s,box-shadow .07s}
.lever:not([disabled]):active{transform:translateY(2px);
  box-shadow:0 1px 0 rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(150,158,154,.18)}
/* diamond knurl, cut both ways — the grip pads are the tell that this is a part */
.lever::before,.lever::after{content:"";position:absolute;top:9px;width:74px;height:50px;
  border-radius:3px;background-color:#262A28;z-index:2;
  background-image:repeating-linear-gradient(45deg,rgba(88,96,93,.9) 0 1px,rgba(0,0,0,0) 1px 6px),
                   repeating-linear-gradient(-45deg,rgba(14,17,16,.95) 0 1px,rgba(0,0,0,0) 1px 6px);
  box-shadow:inset 0 1px 0 rgba(150,158,154,.16),inset 0 -1px 2px rgba(0,0,0,.5)}
.lever::before{left:9px} .lever::after{right:9px}
.lever .cap{position:relative;z-index:3;font:700 14px/1 var(--mono);letter-spacing:.22em;
  color:#D8DDD9;text-shadow:var(--emboss)}
.lever .rail{position:absolute;inset:0;background:linear-gradient(180deg,#6A736E,#414945);
  transform:scaleX(0);transform-origin:left center;z-index:1;opacity:.55}
.lever[data-state="seating"] .rail{animation:breath 1.2s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.012)}}
.lever[disabled]{opacity:.42;cursor:default}
.lever[disabled] .cap{color:#6A716D;text-shadow:0 -1.2px 1px rgba(14,17,16,.8)}
.lever[data-state="refused"]{box-shadow:0 0 0 1.5px var(--red) inset,0 2px 3px rgba(0,0,0,.45)}

.hint{position:absolute;right:22px;bottom:16px;width:48px;text-align:center;
  font:600 9.5px/1.4 var(--mono);letter-spacing:.12em;color:var(--etch)}

/* ── connect ───────────────────────────────────────────────────────────── */
.panel{position:absolute;inset:26px;background:var(--well);border:1px solid #3A403D;border-radius:3px;
  padding:20px;display:flex;flex-direction:column;gap:13px;z-index:9;overflow:auto}
.panel h2{margin:0;font:700 18px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.02em}
.panel p{margin:0;color:var(--dim);font:400 13px/1.5 var(--sans)}
.panel label{display:flex;flex-direction:column;gap:5px;font:700 11px/1 var(--mono);letter-spacing:.16em;color:var(--dim)}
.panel input{background:#0E1110;border:1px solid #3A403D;border-radius:2px;color:var(--ink);
  font:400 14px/1.3 var(--mono);padding:11px}
.panel button{background:var(--mid);color:#151817;border:0;border-radius:2px;
  font:700 12px/1 var(--mono);letter-spacing:.18em;padding:13px;cursor:pointer}
.panel .msg{font:400 11.5px/1.5 var(--mono);color:var(--dim)}
.panel .msg.bad{color:var(--hot)}

/* ── RADIO — a receiver with a discipline ─────────────────────────────────
   The operation may key up once a day; everything quieter prints under a
   machined squelch line that is content, not chrome — suppressed is not
   lost, it is HERE, in dim type, which is the whole bargain. Squelch is
   structural and lives on the spine; this page only records. KEY UP is the
   latch wearing its most natural costume — press-to-talk IS press-and-hold —
   so it inherits the wall clock, the idempotent key, and the $1,500 scar
   without a line of new law. The tail crackles only after a parsed 2xx.
   Everything that wants his hand stands PROUD of the plate (embossed);
   everything at rest is CUT into it (engraved). And when nothing is
   happening, NOTHING HAPPENS. */
.work.radio{flex-direction:column-reverse;
  -webkit-mask-image:linear-gradient(0deg,#000 0,#000 calc(100% - 26px),transparent 100%);
          mask-image:linear-gradient(0deg,#000 0,#000 calc(100% - 26px),transparent 100%)}
.work.radio .card{display:block}
@starting-style{ .work.radio .card{opacity:0; translate:0 6px} }
.work.radio .card{transition:opacity .28s ease-out, translate .28s ease-out}
.card .rt{font:600 14px/1.35 var(--sans); color:var(--ink); display:flex; gap:8px;
  align-items:baseline; text-shadow:var(--emboss); transition:text-shadow .4s}
.card .rt .mk{color:var(--lamp); font-weight:700}
.card .rt .rstamp{margin-left:auto; font:600 10px/1 var(--mono); letter-spacing:.1em;
  color:var(--etch); font-variant-numeric:tabular-nums; text-shadow:none}
.card .rb{margin-top:4px; font:400 13px/1.55 var(--sans); color:var(--mid)}
.card.rx{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.35) inset,
  inset 2px 0 0 var(--lamp); transition:box-shadow .4s}
.card.rx.readset{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.35) inset,
  inset 2px 0 0 var(--etch)}
.card.rx.readset .rt{text-shadow:var(--engrave)}
.card.tx{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.35) inset,
  inset -2px 0 0 var(--mid)}
.card.tx .rb{color:var(--ink); text-shadow:var(--engrave)}
.card.heldx{opacity:.62}
.card.heldx .rt{color:var(--dim); font-style:italic; text-shadow:var(--engrave)}
.card.heldx .rb{font-style:italic; color:var(--dim)}
.sqline{position:relative; flex:0 0 auto; height:4px; margin:14px 0 5px; border-radius:2px;
  background:linear-gradient(180deg,#171A19,#232827);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.07)}
.sqline::after{content:"SQUELCH · " attr(data-held) " HELD BELOW"; position:absolute;
  right:0; top:-13px; font:700 8.5px/1 var(--mono); letter-spacing:.18em; color:var(--etch)}
.micwell{flex:0 0 auto; z-index:1; margin:10px 78px 12px 0}
.miccap{font:700 8.5px/1 var(--mono); letter-spacing:.18em; color:var(--etch);
  margin-bottom:6px; text-shadow:var(--engrave)}
/* LIVE's carrier strip — the one place on the plate that breathes with input,
   and it only breathes when input exists. His draft renders as knurl ticks;
   delete a word and the ticks retract; transmit and it drains. Event-driven
   one-shot repaints on a small canvas — never a loop. */
.strip{height:14px; margin-bottom:7px; border-radius:2px; background:#171A19;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.65), 0 1px 0 rgba(255,255,255,.06); overflow:hidden}
.strip canvas{width:100%; height:14px; display:block}
/* LIVE's signature stamp — a mark, not a reading: cut once from the message's
   own words, cached, never animated. */
.card .sig{float:right; margin:3px 0 0 8px; opacity:.85}
.micin{width:100%; background:#0E1110; border:1px solid #3A403D; border-radius:2px;
  corner-shape:bevel; color:var(--ink); font:400 14px/1.3 var(--mono); padding:11px;
  user-select:text; -webkit-user-select:text}
.micin:focus-visible{outline:2px solid var(--mid); outline-offset:2px}
.fig.quiet{font-size:.55em; font-weight:400; letter-spacing:.12em; color:var(--dim);
  text-shadow:var(--engrave); text-box:trim-both cap alphabetic}

/* ── SIDE CH · CH 21 — the conversation, in node grammar (card #91) ───────
   The cab is the primary theater, not the adaptation (SIDECHANNEL §6). So the
   carrier gets NO 44px strip of its own here: it COLLAPSES INTO THE KEY — a
   registered conic ring round TALK whose sweep is his live RMS — and during
   playback into the top edge of the answer card itself. Nothing at 340px is
   spent on chrome. The beam loses nothing: it is text, ink tiers, one bloom,
   and it is fully present with every animation off.

   @property is registered ABOVE every rule that reads --sc-sweep. An
   unregistered custom property is a string, and a conic-gradient handed a
   string silently paints nothing — the first arm would no-op with no error.
   inherits:true is load-bearing for the same reason: the ring is drawn by
   .sc-talk::before, and the rAF sets the angle on the BUTTON. With
   inherits:false the pseudo-element never sees it and falls back to 0deg —
   a ring that computes perfectly and never moves. Proven in the browser. */
@property --sc-sweep{syntax:"<angle>";inherits:true;initial-value:0deg}
:root{--sc-moon:#C6D4E4}   /* MOONGLASS — the conversation's identity hue, and
                              its whole jurisdiction: bloom, glyph, run marker */

/* the arc glyph — a state diagram that cannot lie: derived fact, never mood */
.sc-arc{flex:0 0 auto;margin-top:11px;display:flex;align-items:center;gap:6px}
.sc-arc i{width:7px;height:7px;border-radius:50%;background:#3A403D;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.6);transition:background .3s,box-shadow .3s}
.sc-arc b{width:26px;height:2px;border-radius:1px;background:#3A403D;transition:all .3s}
.sc-arc i.on{background:var(--sc-moon);box-shadow:0 0 9px -1px var(--sc-moon)}
.sc-arc b.on{background:var(--sc-moon);box-shadow:0 0 11px -2px var(--sc-moon)}

/* the log — runs as tape, newest nearest the bench. It takes the height the
   plate has left rather than a fixed window: a conversation is the node. */
.work.sc-log{flex:1 1 auto;max-height:none;min-height:88px;flex-direction:column-reverse;
  -webkit-mask-image:linear-gradient(0deg,#000 0,#000 calc(100% - 26px),transparent 100%);
          mask-image:linear-gradient(0deg,#000 0,#000 calc(100% - 26px),transparent 100%)}
.work.sc-log .card{display:block;position:relative;overflow:hidden}
@starting-style{ .work.sc-log .card{opacity:0; translate:0 6px} }
.work.sc-log .card{transition:opacity .28s ease-out, translate .28s ease-out}
/* nth-CHILD, not nth-last-child: this log is newest-FIRST in the DOM (the flex
   column is reversed), so nth-last-child(n+61) would skip the 60 OLDEST and
   contain the rows he is actually reading — the exact inverse of the budget. */
.work.sc-log .card:nth-child(n+61){content-visibility:auto;contain-intrinsic-size:auto 92px}
.sc-row.atl{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.35) inset,
  inset 2px 0 0 var(--sc-moon);transition:box-shadow .4s}
.sc-row.atl.heard{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.35) inset,
  inset 2px 0 0 var(--etch)}
.sc-row.bry{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.35) inset,
  inset -2px 0 0 var(--mid)}
.sc-row.und{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.35) inset,
  inset 2px 0 0 var(--unknown)}
.sc-row .st{display:flex;gap:8px;align-items:center;min-height:14px;
  font:600 8.5px/1 var(--mono);letter-spacing:.18em;color:var(--etch);text-transform:uppercase}
.sc-row .st .play{margin-left:auto;background:none;border:0;padding:3px 7px;margin:-3px -7px -3px 0;
  cursor:pointer;color:var(--sc-moon);font:700 12px/1 var(--mono)}
.sc-row .st .play[disabled]{color:var(--etch);cursor:default}
.sc-row .bd{margin-top:5px;font:400 13.5px/1.55 var(--sans);color:var(--mid);
  text-shadow:var(--emboss);transition:text-shadow .4s}
.sc-row.bry .bd{color:var(--ink);text-shadow:var(--engrave)}
/* PROUD wants his hand; CUT is at rest. An already-heard answer pulled from
   history is at rest — without this it rendered embossed until he replayed it,
   so a whole scrollback of settled conversation stood up asking to be read. */
.sc-row.atl.heard .bd{text-shadow:var(--engrave)}
.sc-row.und .bd{font-style:italic;color:var(--dim)}
.sc-row.und .mk{color:var(--unknown);font-weight:700;font-style:normal}
/* THE BEAM — words go --dim → --ink inside char-weighted windows over the
   clip's REAL duration; the current word carries the moonglass bloom. The
   light IS playback: stall the audio and the light freezes with it. */
.sc-row .w{color:var(--dim);transition:color .28s linear}
.sc-row .w.lit{color:var(--ink)}
.sc-row .w.now{color:#FFF;text-shadow:0 0 10px rgba(198,212,228,.8)}
.sc-row.done .bd{text-shadow:var(--engrave)}
.sc-row.done .w{transition:none;color:var(--ink);text-shadow:none}
/* the carrier, collapsed: the live trace rides the answer card's own top edge */
canvas.sc-trace{position:absolute;left:0;top:0;width:100%;height:9px;display:block;pointer-events:none}
/* SETTLE-TO-TAPE — the exchange, painted once from real decoded peaks */
canvas.sc-tape{display:block;width:100%;height:12px;margin-top:7px;opacity:.7}
.card.sc-quiet{display:block;font:italic 400 12.5px/1.6 var(--sans);color:var(--dim)}

/* the bench — runs rail, the dial, composer + TALK: all inside the thumb arc,
   and the spindle's right 92px is never touched (margin-right:78px stands). */
.sc-well{flex:0 0 auto;z-index:1;margin:10px 78px 12px 0;display:flex;flex-direction:column;gap:7px}
.sc-rail{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;touch-action:pan-x;padding-bottom:2px}

.sc-chip{flex:0 0 auto;scroll-snap-align:start;border:0;border-radius:2px;padding:6px 9px;cursor:pointer;
  background:linear-gradient(180deg,#313735,#232827);
  font:700 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;
  max-width:136px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;

             inset 0 -2px 0 var(--sc-moon)}

.sc-chip .n{margin-left:7px;color:var(--etch)}
.sc-mode.on{color:var(--lamp);
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.35) inset,
             inset 0 -2px 0 var(--lamp)}
.sc-bench{display:flex;gap:7px;align-items:stretch}
/* the well is ~140px at 340px once TALK and the spindle are paid — 12.5px is
   what makes a whole placeholder fit rather than a truncated one */
.sc-bench .micin{flex:1 1 auto;min-width:0;font-size:12.5px;padding:10px 9px}
/* 56px, not 66: at 340px the plate leaves the bench ~210px, and every pixel
   TALK does not take is a pixel of his own words he can still read */
.sc-talk{position:relative;flex:0 0 auto;width:56px;border:0;border-radius:2px;cursor:pointer;
  background:linear-gradient(180deg,#373D3A,#242927);color:#D8DDD9;padding:0;
  box-shadow:0 2px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(150,158,154,.2)}
.sc-talk::before{content:"";position:absolute;inset:2px;border-radius:2px;pointer-events:none;
  background:conic-gradient(from -90deg,var(--sc-moon) var(--sc-sweep),rgba(198,212,228,.09) 0);
  opacity:0;transition:opacity .18s}

  background:linear-gradient(180deg,#373D3A,#242927)}
.sc-talk.rec::before{opacity:1}
.sc-talk.rec{color:var(--sc-moon)}
.sc-talk .cap{position:relative;z-index:2;display:block;padding:0 3px;
  font:700 8.5px/1.2 var(--mono);letter-spacing:.08em;text-shadow:var(--emboss)}

  .work.sc-log .card, .sc-row .w, .sc-row .bd, .sc-row.atl{transition:none}
  .sc-row .w.now{text-shadow:none}

<script>
"use strict";
(() => {

/* ── brushed anodised steel, painted once ──────────────────────────────
   Value noise at a 24:1 aspect is what makes grain read as BRUSHED rather than
   as static, and no CSS gradient can do it. Painted at a capped resolution and
   stretched by CSS — the grain is anisotropic, so mild stretching helps it. */
function paintSteel(){
  const cv = document.getElementById("steel");
  const r = cv.parentElement.getBoundingClientRect();
  const W = Math.min(Math.round(r.width) || 430, 720), H = Math.min(Math.round(r.height) || 900, 1480);
  if(cv.width === W && cv.height === H) return;
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d"), img = g.createImageData(W,H), px = img.data;
  const h2 = (x,y,s) => { let n = (Math.imul(x,1836311903)^Math.imul(y,2971215073)^Math.imul(s,668265263));
    n = Math.imul(n^(n>>>15),2246822519); n = Math.imul(n^(n>>>13),3266489917);
    return ((n^(n>>>16))>>>0)/4294967295; };
  const vn = (x,y,s) => { const x0=Math.floor(x), y0=Math.floor(y);
    let fx=x-x0, fy=y-y0; fx=fx*fx*(3-2*fx); fy=fy*fy*(3-2*fy);
    const a=h2(x0,y0,s), b=h2(x0+1,y0,s), c=h2(x0,y0+1,s), d=h2(x0+1,y0+1,s);
    const t=a+(b-a)*fx; return t+((c+(d-c)*fx)-t)*fy; };
  const BASE=[57,64,60], LO=[45,51,54], HI=[88,98,90], SPEC=[124,134,128];
  let k = 0;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    let v = vn(x/24,y/1.05,7)*0.46 + vn(x/8,y/2.9,19)*0.26 + vn(x/70,y/11,31)*0.28;
    const t = (v-0.5)*1.55;
    let r,gg,b;
    if(t>=0){ const m=Math.min(t*1.6,1);
      r=BASE[0]+(HI[0]-BASE[0])*m; gg=BASE[1]+(HI[1]-BASE[1])*m; b=BASE[2]+(HI[2]-BASE[2])*m; }
    else { const m=Math.min(-t*1.6,1);
      r=BASE[0]+(LO[0]-BASE[0])*m; gg=BASE[1]+(LO[1]-BASE[1])*m; b=BASE[2]+(LO[2]-BASE[2])*m; }
    /* one narrow specular streak down the plate, as a rolled sheet catches light */
    const band = Math.exp(-Math.pow((x-W*0.33)/(W*0.20),2))*0.34*(0.45+0.55*vn(x/40,y/1.6,53));
    if(band>0.02){ r+=(SPEC[0]-r)*band; gg+=(SPEC[1]-gg)*band; b+=(SPEC[2]-b)*band; }
    px[k++]=r; px[k++]=gg; px[k++]=b; px[k++]=255;
  }
  g.putImageData(img,0,0);
}
paintSteel();
let steelT = 0;
addEventListener("resize", () => { clearTimeout(steelT); steelT = setTimeout(paintSteel, 180); });

/* ── config ───────────────────────────────────────────────────────────── */
let API = localStorage.getItem("almanac_api") || "";
let TOK = localStorage.getItem("almanac_token") || "";

/* The QR handshake from BIK Connect, and the escape hatch. Credentials arrive ONCE
   as #cfg=<url-encoded {api,token}>, land in localStorage, and the hash is scrubbed
   immediately so the token never survives in history, in a back-button, or in a
   screenshot of the address bar. #reset unregisters the worker and clears the caches
   — the way out when a phone is stuck on an old build. Both are PWA doctrine and
   both were missing here, which would have made the BIK Connect QR land on a page
   that said "not connected". */
(function bootstrap(){
  const h = location.hash || "";
  if(h === "#reset" || h === "#nuke"){
    (async () => {
      try{
        const regs = await (navigator.serviceWorker?.getRegistrations?.() ?? []);
        await Promise.all(regs.filter(r => (r.scope || "").includes("/almanac")).map(r => r.unregister()));   /* our worker only — the scanner shares this origin (card #177) */
        const ks = await (caches?.keys?.() ?? []);
        await Promise.all(ks.filter(k => k.startsWith("almanac-shell-")).map(k => caches.delete(k)));   /* our caches only — never the scanner's OpenCV */
      }catch(e){}
      if(h === "#nuke"){ localStorage.removeItem("almanac_api"); localStorage.removeItem("almanac_token"); }
      location.replace(location.pathname + location.search);
    })();
    return;
  }
  const m = h.match(/[#&]cfg=([^&]+)/);
  if(m){
    try{
      const cfg = JSON.parse(decodeURIComponent(m[1]));
      if(cfg.api)   localStorage.setItem("almanac_api",   API = cfg.api.replace(/\/$/, ""));
      if(cfg.token) localStorage.setItem("almanac_token", TOK = cfg.token);
      history.replaceState(null, "", location.pathname + location.search);
    }catch(e){}
  }
})();
/* A laptop that chose the desk goes straight there. Guarded three ways: only
   AFTER the #reset/#cfg bootstrap, only on a wide screen (a phone with a
   stray pref must never be trapped), and #stay is the escape hatch.
   screen.width, not innerWidth — a prerendered or hidden document can report
   a zero-size viewport at parse time, and the DEVICE is what the pref is per. */
if(!location.hash && localStorage.getItem("almanac_view") === "desk" &&
   Math.max(innerWidth, screen.width) >= 900){
  location.replace("desk.html");
}

/* A push tap arrives as #radio — remember it, scrub it, answer after boot.
   #sidech is the same plumbing for CH 21's door (card #91 / §4.1). */
let WANT_RADIO  = location.hash === "#radio";
let WANT_SIDECH = location.hash === "#sidech";
if(WANT_RADIO || WANT_SIDECH) history.replaceState(null, "", location.pathname + location.search);

const configured = () => localStorage.getItem("almanac_token") !== null && TOK !== "";
const $ = id => document.getElementById(id);
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const url = p => (API || "") + p;
const hdr = x => Object.assign({ Authorization: "Bearer " + TOK }, x || {});
const money = v => v == null ? null :
  "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});

const State = { source:"none", standings:null, board:null, learn:null, soul:null,
                standing:null,     /* the money page: the spine's ONE judgement */
                held:null,         /* pushes the budget kept quiet today */
                radio:null };      /* the channel: messages + unread, served whole */
const esc = s => String(s ?? "").replace(/[&<>"]/g,
  m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ── feel ─────────────────────────────────────────────────────────────── */
const HAPTIC = { light:[7], heavy:[16,42,16], wall:[26], arm:[8], detent:[14],
                 seat:[14,26,14], refuse:[12,70,12], rx:[12,30,12] };
const buzz = p => { try{ navigator.vibrate?.(p); }catch(e){} };
let AC = null;
function ctx(){
  if(localStorage.getItem("almanac.mute") === "1") return null;
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state === "suspended") AC.resume().catch(()=>{});
  return AC;
}
function tone(f, ms, gain, type, glide){
  const c = ctx(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, c.currentTime);
  if(glide) o.frequency.exponentialRampToValueAtTime(f*glide, c.currentTime + ms/1000);
  g.gain.setValueAtTime(gain, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + ms/1000);
  o.connect(g); g.connect(c.destination);
  o.onended = () => { try{ o.disconnect(); g.disconnect(); }catch(e){} };
  o.start(); o.stop(c.currentTime + ms/1000);
}
const tickLight = () => tone(1300, 26, .05, "square", .55);
const tickHeavy = () => tone(300, 95, .13, "triangle", .55);   // a section boundary
const tickWall  = () => tone(150, 60, .10, "sawtooth", .7);    // the hard stop
const tine      = () => tone(880, 55, .07, "sine");            // a latch seating
const thud      = () => tone(150, 90, .10, "triangle");        // refused
/* The radio's three phrases — the house instrument, no new voice. The tail is
   grains of the existing tone() jittered in the tinny CB band: no two tails
   identical, like the real thing. Fires ONLY after a parsed 2xx. */
const keyThump  = () => tone(95, 45, .08, "sine");             // mic keyed — felt
const rogerBeep = () => tone(2000, 70, .045, "sine");          // end of transmission
const T = [];                                                  // grain timers, cleared on pagehide
/* The grains are chosen up front and RETURNED: SIDECHANNEL §3.2's law is that
   one seed drives the oscillator AND the carrier — the spikes the eye sees are
   the grains the ear hears, not a decorative animation that merely rhymes. */
function squelchTail(){
  const grains = [];
  for(let i = 0; i < 6; i++){
    const at = i*18 + Math.random()*8;
    const freq = 1400 + Math.random()*1600, gain = .05 * (1 - i/6);
    grains.push({ at, freq, gain });
    scT(() => tone(freq, 14 + Math.random()*10, gain, "sawtooth", .6), at);
  }
  return grains;
}
addEventListener("pagehide", () => { try{ AC && AC.close(); }catch(e){} AC = null; });
document.addEventListener("visibilitychange", () => {
  if(document.hidden && AC && AC.state === "running") AC.suspend().catch(()=>{});
});

/* Easings must be LITERAL for WAAPI — it does not resolve custom properties, and
   passing var(--ease-settle) throws inside the listener, silently killing the latch. */
const EASE = (() => {
  const cs = getComputedStyle(document.documentElement), probe = document.createElement("div");
  const read = (n, fb) => { const v = (cs.getPropertyValue(n)||"").trim(); if(!v) return fb;
    try{ probe.animate({opacity:[0,1]},{duration:1,easing:v}).cancel(); return v; }catch(e){ return fb; } };
  return { settle: read("--ease-settle","cubic-bezier(.22,.61,.36,1)"),
           refuse: read("--ease-refuse","cubic-bezier(.36,0,.66,-.56)") };
})();

/* ── the spindle ──────────────────────────────────────────────────────── */
const PITCH = 46, HEAVY = 2.1;
let NODES = [], TRAVEL = [], TOTAL = 0;
const spin = { cont:0, pos:0 };

function buildNodes(){
  const N = [];
  N.push({ sec:"TODAY", kind:"today", first:true });
  // RADIO at index 1 — directly after TODAY's hard stop, honoring the desk's
  // ruling ("radio first") inside this plate's law ("today is position zero").
  // Crossing to it earns the heavy detent: the channel costs a boundary.
  N.push({ sec:"RADIO", kind:"radio", first:true });
  // SIDE CH at index 2, directly after RADIO — the two halves of one radio
  // (card #91 / SIDECHANNEL §4.1). Crossing to it earns the heavy detent for
  // the same reason RADIO does: the conversation costs a boundary, which is
  // true. `first:true` IS that ruling — crosses() reads it, landOn() feels it.
  N.push({ sec:"SIDE CH", kind:"sidech", first:true });
  N.push({ sec:"WORK",  kind:"work",  first:true });
  const st = (State.standings && State.standings.standings) || [];
  st.forEach((s, i) => N.push({ sec:"FINANCES", kind:"standing", s, first: i === 0 }));
  if(!st.length) N.push({ sec:"FINANCES", kind:"empty", first:true });
  N.push({ sec:"LEARN", kind:"learn", first:true });
  N.push({ sec:"SOUL",  kind:"soul",  first:true });
  // The last standing of every day is always the same object: CLOSE THE BOOK.
  // It lives at the very bottom of the spindle, so no sort can ever put the end
  // of the day anywhere but last — ordering as a property of the machine.
  N.push({ sec:"CLOSE", kind:"close", c: (State.standings && State.standings.close) || null, first:true });
  NODES = N;
  TRAVEL = [0];
  for(let i = 1; i < N.length; i++) TRAVEL[i] = TRAVEL[i-1] + PITCH * (N[i].first ? HEAVY : 1);
  TOTAL = TRAVEL[N.length-1];
  if(spin.pos > N.length-1) spin.pos = 0;
}
const crosses = (a,b) => {
  if(a===b) return false;
  const hi = Math.max(a,b), lo = Math.min(a,b);
  for(let i=lo+1;i<=hi;i++) if(NODES[i].first) return true;
  return false;
};
function nodeAt(x){ let b=0,bd=Infinity;
  for(let i=0;i<TRAVEL.length;i++){ const d=Math.abs(TRAVEL[i]-x); if(d<bd){bd=d;b=i;} } return b; }

const cv = $("wheel"), g2 = cv.getContext("2d"), CW = 96, CH = 1200;
function drawWheel(){
  const x = spin.cont, mid = CH/2, sc = 2.2;
  g2.clearRect(0,0,CW,CH);
  const bg = g2.createLinearGradient(0,0,CW,0);
  bg.addColorStop(0,"#141716"); bg.addColorStop(.18,"#3C423F"); bg.addColorStop(.5,"#596059");
  bg.addColorStop(.82,"#333937"); bg.addColorStop(1,"#0E1110");
  g2.fillStyle = bg; g2.fillRect(0,0,CW,CH);
  const off = -(x*2.2) % 22;
  g2.lineWidth = 1;
  for(let y = off-22; y < CH+22; y += 11){
    g2.strokeStyle = "rgba(255,255,255,.055)";
    g2.beginPath(); g2.moveTo(0,y); g2.lineTo(CW,y+7); g2.stroke();
    g2.strokeStyle = "rgba(0,0,0,.30)";
    g2.beginPath(); g2.moveTo(0,y+5.5); g2.lineTo(CW,y+12.5); g2.stroke();
  }
  for(let i=0;i<NODES.length;i++){
    const y = mid + (TRAVEL[i]-x)*sc;
    if(y < -30 || y > CH+30) continue;
    if(NODES[i].first){
      g2.fillStyle="rgba(0,0,0,.62)"; g2.fillRect(0,y-4,CW,8);
      g2.fillStyle="rgba(255,255,255,.10)"; g2.fillRect(0,y+4,CW,1.5);
      g2.fillStyle="rgba(255,164,25,.30)"; g2.fillRect(CW-9,y-4,9,8);
    } else { g2.fillStyle="rgba(0,0,0,.30)"; g2.fillRect(0,y-.75,CW,1.5); }
  }
  g2.fillStyle="rgba(255,106,42,.95)"; g2.fillRect(0,mid-1.5,CW,3);
  g2.fillStyle="rgba(255,164,25,.22)"; g2.fillRect(0,mid-7,CW,14);
  const cap = mid + (0-x)*sc;
  if(cap > -40 && cap < CH+40){
    g2.fillStyle="rgba(10,12,11,.92)"; g2.fillRect(0,cap-26,CW,26);
    g2.fillStyle="rgba(255,255,255,.09)"; g2.fillRect(0,cap-3,CW,3);
    for(let k=0;k<5;k++){ g2.fillStyle="rgba(255,255,255,.05)"; g2.fillRect(6+k*18,cap-21,9,15); }
  }
}

/* ── THE RADIO — ARC's bones wearing LIVE's signature (card #35) ────────────
   Ruled by Bryan 2026-07-27 off the rendered blend. Everything below obeys
   the three-reels law: Arrival (static resolves into engraving, light follows
   voice), Answer (the held transmission), Quiet (zero paint at rest). */
const GLY = "▓▒░#&%$@";
let rxCancel = null, readT = 0;
const revealed = new Set();
const RTF = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
function rel(at){
  const d = (Date.now() - new Date(at).getTime()) / 1000;
  if(!isFinite(d) || d < 90) return "now";
  if(d < 3600)  return RTF.format(-Math.round(d/60), "minute");
  if(d < 86400) return RTF.format(-Math.round(d/3600), "hour");
  return RTF.format(-Math.round(d/86400), "day");
}
/* LIVE's layer: words → knurl. Deterministic, event-driven, never a loop. */
function wave(str){
  const a = [];
  for(let i = 0; i < str.length; i++){
    const h = (str.charCodeAt(i) * 2654435761) >>> 0;
    a.push((h % 97) / 96);
  }
  for(let i = 1; i < a.length - 1; i++) a[i] = (a[i-1] + a[i]*2 + a[i+1]) / 4;
  return a;
}
function drawStrip(str){
  const cv = $("stripcv"), g = cv.getContext("2d");
  g.clearRect(0, 0, 640, 14);
  const a = wave(str);
  if(!a.length) return;
  const w = Math.min(6, 624 / a.length);
  g.fillStyle = "#6B726E";
  for(let i = 0; i < a.length; i++){
    const h = 2 + a[i]*9;
    g.fillRect(8 + i*w, (14 - h)/2, Math.max(1.5, w*.55), h);
  }
}
function drainStrip(){
  const cv = $("stripcv"), g = cv.getContext("2d");
  if(reduce()){ g.clearRect(0, 0, 640, 14); return; }
  const t0 = performance.now();
  (function step(){
    const p = (performance.now() - t0) / 180;
    if(p >= 1){ g.clearRect(0, 0, 640, 14); return; }
    g.clearRect(0, 0, 640*p, 14);
    requestAnimationFrame(step);
  })();
}
const STAMPS = new Map();          // message id → canvas, painted once ever
function stamp(m){
  if(STAMPS.has(m.id)) return STAMPS.get(m.id);
  const cv = document.createElement("canvas");
  cv.width = 64; cv.height = 10; cv.className = "sig";
  cv.style.width = "32px"; cv.style.height = "5px";
  const g = cv.getContext("2d");
  g.fillStyle = "#6B726E";
  const a = wave(m.body || "").slice(0, 21);
  for(let i = 0; i < a.length; i++){
    const h = 1 + a[i]*8;
    g.fillRect(i*3, (10 - h)/2, 1.6, h);
  }
  STAMPS.set(m.id, cv);
  return cv;
}
/* Arrival: static resolves left→right into the final engraving. One rAF,
   canceller stored; hidden defers — the reveal is the reward for looking. */
function breakSquelch(el, final){
  if(reduce()){ el.textContent = final; return; }
  const t0 = performance.now(), DUR = 420 + Math.min(500, final.length*10);
  let raf = 0;
  rxCancel = () => { cancelAnimationFrame(raf); el.textContent = final; rxCancel = null; };
  (function step(){
    const p = (performance.now() - t0) / DUR;
    if(p >= 1){ el.textContent = final; rxCancel = null; return; }
    const cut = Math.floor(final.length * p);
    let s = final.slice(0, cut);
    for(let i = cut; i < final.length; i++)
      s += final[i] === " " ? " " : GLY[(Math.random()*GLY.length)|0];
    el.textContent = s;
    raf = requestAnimationFrame(step);
  })();
}
function radioCard(m){
  const el = document.createElement("div");
  const op = m.sender === "operation", held = m.kind === "held";
  el.className = "card " + (held ? "heldx" : op ? ("rx" + (m.read_at ? " readset" : "")) : "tx");
  const hasTitle = op && m.title && m.title !== m.body;
  const mark = (op && !held) ? `<span class="mk">${m.kind === "undelivered" ? "△" : "▲"}</span>` : "";
  el.innerHTML = `<div class="rt">${mark}<span class="rtx"></span>` +
    `<span class="rstamp">${esc(rel(m.at))}</span></div>` +
    ((hasTitle || !op) ? `<div class="rb"></div>` : "");
  el.querySelector(".rtx").textContent = op ? (hasTitle ? m.title : m.body) : "BRY";
  const rb = el.querySelector(".rb");
  if(rb) rb.textContent = m.body;
  if(!op && rb) rb.appendChild(stamp(m));
  return el;
}
function renderRadio(){
  const w = $("work"); w.textContent = ""; w.hidden = false; w.classList.add("radio");
  const r = State.radio;

    const el = document.createElement("div");
    el.className = "card judge";

    w.appendChild(el);

  }
  const msgs = r.messages || [];
  const spoken = msgs.filter(m => m.kind !== "held");
  const held = msgs.filter(m => m.kind === "held");
  // column-reverse: first DOM child = bottom of the glass. Bottom-up: the
  // held block (under squelch), the line itself, then spoken traffic newest
  // nearest the line. Sends break squelch by definition — always above it.
  for(const m of held.slice(-3)) w.appendChild(radioCard(m));

/* Read receipts obey the latch doctrine: rendered is not read — his eyes are.
   900ms on the node, visible, then the settle: emboss relaxes to engraving,
   the amber edge cools. The plate's first inbound truth. */
function armRead(){
  clearTimeout(readT);
  readT = setTimeout(() => {
    if(document.visibilityState !== "visible") return;
    if(!NODES[spin.pos] || NODES[spin.pos].kind !== "radio") return;
    if(!(State.radio && State.radio.unread > 0)) return;

        document.querySelectorAll("#work .card.rx:not(.readset)")
          .forEach(el => el.classList.add("readset"));

/* ══ SIDE CH · CH 21 — the conversation, on the plate (card #91) ═══════════
   The node at spindle index 2. CH 19 is the operation keying up through the
   budget, once a day; CH 21 is TWO SEATS — he talks, ATLAS answers in a voice.
   Everything here is a consumer of spine endpoints that are already live
   (threads / say / heard / voice / stt / pins); this file adds no law to them.

   The one-verb room: this surface performs exactly one act — talk. Anything
   ATLAS names is a door somewhere else. A second verb appearing here is the
   bearing firing, not a feature. */
const SC = {
  runs:[], run:null, msgs:[], mounted:false,
  waiting:null,           // {sayId, t0, clockT, followT} — the dead-air watch
  audio:null, beamRaf:0, playingRow:0,
  gen:0,                  // playback generation: a stale tap's late fetch is DEAD
  vox:new Map(),          // msg id -> object URL (revoked on room exit + pagehide)
  peaks:new Map(),        // msg id -> [0..1] buckets — this glass's tape memory
  rec:null, vuRaf:0, loop:false, emptyTakes:0, mounting:false, newing:false,
  takeGen:0,              // mic generation — a stale getUserMedia must NOT become the take
  tuneGen:0,              // run generation — run A's late fetch must not paint under run B

  defer:null,             // an answer that landed hidden — deferred, NOT fired
  wake:null,
  mode: localStorage.getItem("almanac_sc_mode") || "analysis",
};
/* the same key companion.html writes — one dial, both surfaces, or the phone
   and the desk quietly answer him in different voices */
const SC_MODES = ["analysis","chat","therapist"];
/* short on purpose: at 340px the well is ~140px wide, and a placeholder that
   truncates mid-word is worse than one that fits */
const SC_PLACEHOLDER = {
  analysis:"say it, or tap TALK",
  chat:"shoot the breeze",
  therapist:"say what's on you",
};
const SC_QUIET = {
  analysis:"a fresh run — say something into the dark. the operation answers in a voice that knows your numbers.",
  chat:"a fresh run — say anything. off the clock, no ledger, quick voice.",
  therapist:"a fresh run — say what's on you. this room is walled from the work.",
};
const muted = () => localStorage.getItem("almanac.mute") === "1";
const mmss  = s => { s = Math.max(0, Math.round(Number(s) || 0));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const onSC  = () => !!(NODES[spin.pos] && NODES[spin.pos].kind === "sidech");
/* CSS.escape is the sanitizer; the manual pass is only the fallback. A raw
   newline in an id makes a hand-quoted selector INVALID, and querySelector
   throws — which in the deferred-reveal handler would take the whole handler
   down, `scHeard()` included. */
const scSel = id => `[data-id="${(typeof CSS !== "undefined" && CSS.escape)
  ? CSS.escape(String(id)) : String(id).replace(/["\\\n\r]/g, "\\$&")}"]`;
/* Every id that becomes a path segment goes through this. Origin escape is not
   reachable behind the /api/ prefix, but a '?' or '#' in an id would silently
   truncate the path and hit a DIFFERENT door on the spine. */
const scSeg = v => encodeURIComponent(String(v));
/* A timer that forgets itself. T[] is swept on pagehide; without this the
   settle, retry and mic-reopen ids pile up for a whole road session. */
function scT(fn, ms){
  const id = setTimeout(() => { const i = T.indexOf(id); if(i >= 0) T.splice(i, 1); fn(); }, ms);
  T.push(id); return id;
}

let scWhyT = 0;
function scWhy(msg){

function scArc(pole, on){

/* the state word rides the readout: QUIET · ATL HAS THE MIC · 0:42 · SPEAKING.
   During dead air it is the ONLY thing moving on the surface. ONE interval,
   cleared by scClearWait on exactly three deaths: the answer landing, the room
   exit, and pagehide. Hiding does NOT clear it — §6 says the clock keeps true
   time in his pocket, and t0-arithmetic means a throttled tick still reads
   right when he looks. (This comment used to claim a fourth death. It did not
   exist; in this file a comment that lies about teardown is how the next
   teardown bug gets written.) */
function scState(w){

/* ── the log ─────────────────────────────────────────────────────────── */
function scStamp(m, dur){
  const who = m.sender === "operation" ? "ATLAS" : "BRYAN";
  const md = (m.mode && m.mode !== "analysis" && who === "ATLAS")
    ? " · " + String(m.mode).toUpperCase() : "";
  return who + md + " · " + rel(m.at) + (dur ? " · " + mmss(dur) : "");
}
function scRow(m){
  const el = document.createElement("div");
  const atl = m.sender === "operation";
  el.className = "card sc-row " + (m.kind === "undelivered" ? "und"
                 : atl ? ("atl" + (m.read_at ? " heard" : "")) : "bry");
  el.dataset.id = m.id;
  const st = document.createElement("div"); st.className = "st";
  const who = document.createElement("span"); who.className = "who";
  who.textContent = scStamp(m);
  st.appendChild(who);
  const bd = document.createElement("div"); bd.className = "bd";
  if(m.kind === "answer"){
    /* every word pre-wrapped ONCE, at render, through esc() — the beam's rails.
       ATLAS's text is hostile until escaped; this is the only interpolation. */
    bd.innerHTML = String(m.body ?? "").split(/(\s+)/).map(t =>
      /^\s+$/.test(t) ? t : `<span class="w">${esc(t)}</span>`).join("");
    const play = document.createElement("button");
    play.type = "button"; play.className = "play"; play.textContent = "▶";
    play.setAttribute("aria-label", "hear it again");

  } else if(m.kind === "undelivered"){
    const mk = document.createElement("span"); mk.className = "mk"; mk.textContent = "△ ";
    bd.appendChild(mk);
    /* The spine's own body already opens "your words hold — …", so this adds
       the part it does not say. It must NOT tell him to promote the turn: the
       →19 hold lives on the desk, not on this plate, and a failure line that
       hands him an instruction he cannot follow here is worse than silence. */
    bd.append(String(m.body ?? "") + " — the turn stands in the run. only a"
              + " promotion makes the session read it, and that hold is on the desk.");
  } else {
    bd.textContent = m.body ?? "";
  }
  el.appendChild(st); el.appendChild(bd);
  return el;
}
function scRender(){
  const w = $("work");
  w.textContent = ""; w.hidden = false;
  w.classList.remove("radio"); w.classList.add("sc-log");
  if(!SC.msgs.length){
    const q = document.createElement("div"); q.className = "card sc-quiet";
    q.textContent = SC.run ? (SC_QUIET[SC.mode] || SC_QUIET.analysis)
      : "no run is open — tap + NEW RUN and the channel opens. starting one is a"
        + " write, so it waits for your hand.";
    w.appendChild(q); w.scrollTop = 0; return;
  }
  let stag = 0;
  for(const m of SC.msgs.slice().reverse()){        // column-reverse: first = newest
    const el = scRow(m);
    if(!reduce() && stag < 8){
      el.style.transitionDelay = (stag*28) + "ms";
      /* the stagger belongs to the ENTRANCE only; left on, it delays every
         later transition the row has, including the settle */
      scT(() => { el.style.transitionDelay = ""; }, 400);
      stag++;
    }
    w.appendChild(el);
  }
  w.scrollTop = 0;
}
function scAppend(m){
  const w = $("work");
  if(!SC.msgs.length) w.textContent = "";          // the quiet line steps aside
  SC.msgs.push(m);
  w.prepend(scRow(m));                             // node append, never a re-render mid-talk
  w.scrollTop = 0;
}

/* ── the runs rail + the dial ────────────────────────────────────────── */
function scRail(){
  const r = $("scrail"); r.textContent = "";
  const plus = document.createElement("button");
  plus.type = "button"; plus.className = "sc-chip"; plus.textContent = "+ NEW RUN";

function scDial(){

/* ── the spine, consumed ─────────────────────────────────────────────── */
async function scLoadRuns(){
  const d = await grab("/api/threads");
  SC.runs = d.runs || [];
  scRail();
}
async function scTune(tid){
  /* THE TUNE TOKEN. Two chips tapped in quick succession race, and the loser
     resolving LAST wins the assignment: run A's turns would paint under run
     B's header — and then scHeard() would POST /threads/B/heard on the
     strength of messages belonging to A, marking read what he never saw. */
  const gen = ++SC.tuneGen;
  scStopPlayback(); scClearWait(); scSweepVox();
  SC.run = tid; SC.msgs = []; SC.peaks.clear(); SC.defer = null;
  let msgs = [];
  try{
    const d = await grab(`/api/threads/${scSeg(tid)}/messages`);
    msgs = d.messages || [];
  }catch(e){
    if(gen !== SC.tuneGen) return;
    scWhy("the spine did not answer with that run: " + (e.message || e));
  }
  if(gen !== SC.tuneGen || tid !== SC.run) return;  // a newer tune owns the room
  if(!onSC()) return;                               // he rolled away mid-fetch
  SC.msgs = msgs;
  scRail(); scRender(); scHeard();
  paint();
}
/* Starting a run is a WRITE, so it is his hand and only his hand: the node
   never auto-creates one on arrival. It also latches like every other write
   here — one in flight at a time, an Idempotency-Key, a 9s abort — because a
   double-tap on + NEW RUN otherwise leaves two empty runs on his rail. */
async function scNewRun(){
  if(SC.newing) return;
  SC.newing = true;
  const net = new AbortController();
  const kill = setTimeout(() => net.abort(), 9000);
  try{
    const r = await fetch(url("/api/threads"), { method:"POST", signal: net.signal,
      headers: hdr({ "Content-Type":"application/json",
                     "Idempotency-Key": crypto.randomUUID
                       ? crypto.randomUUID() : String(Math.random()).slice(2) }),
      body:"{}" });
    clearTimeout(kill);
    const d = await r.json().catch(() => ({}));
    if(!r.ok || !d.id) throw new Error(d.error || ("the spine answered " + r.status));
    await scLoadRuns();
    await scTune(d.id);
  }catch(e){
    clearTimeout(kill); thud();
    scWhy(e && e.name === "AbortError"
      ? "no answer from the spine in 9s — no run was started"
      : "no new run — " + (e.message || e));
  }finally{ SC.newing = false; }
}
/* Rendered is not heard — his eyes are, on a visible document, on this node. */
function scHeard(){
  if(document.visibilityState !== "visible" || !SC.run || !onSC()) return;
  if(!SC.msgs.some(m => m.sender === "operation" && !m.read_at)) return;
  fetch(url(`/api/threads/${scSeg(SC.run)}/heard`), { method:"POST",
    headers: hdr({ "Content-Type":"application/json" }), body:"{}" })
    .then(r => {
      if(!r.ok) return;
      /* only the operation's rows — the spine's UPDATE is scoped to
         sender='operation', and marking his own turns read here would leave
         the model quietly disagreeing with the table it came from */
      SC.msgs.forEach(m => { if(m.sender === "operation" && !m.read_at) m.read_at = "now"; });
      document.querySelectorAll("#work .sc-row.atl:not(.heard)")
        .forEach(el => el.classList.add("heard"));
      scLoadRuns().catch(() => {});
    }).catch(() => {});
}

/* ── THE BREAK — tail → 60ms of nothing → the voice, light walking the words ── */
async function scVoice(id){
  if(SC.vox.has(id)) return SC.vox.get(id);        // a replay over 5G must not refetch
  /* A wedged spine or a dropped tailnet must not leave ▶ disabled forever with
     no way back. Every write on this surface is aborted on a clock; the read
     that gates the ▶ button gets the same discipline. */
  const net = new AbortController();
  const kill = setTimeout(() => net.abort(), 20000);
  try{
    const r = await fetch(url(`/api/voice/${scSeg(id)}`), { headers: hdr(), signal: net.signal });
    if(!r.ok) return null;
    const obj = URL.createObjectURL(await r.blob());
    /* the cache is bounded: a long run is hundreds of clips at ~500KB each,
       and the oldest one he might replay is not worth the memory */
    if(SC.vox.size >= 12){
      const oldest = SC.vox.keys().next().value;
      try{ URL.revokeObjectURL(SC.vox.get(oldest)); }catch(e){}
      SC.vox.delete(oldest);
    }
    SC.vox.set(id, obj);
    return obj;
  }catch(e){ return null; }
  finally{ clearTimeout(kill); }
}
function scSweepVox(){
  SC.vox.forEach(o => { try{ URL.revokeObjectURL(o); }catch(e){} });
  SC.vox.clear();
}
function scWordTimes(bd, dur){
  const ws = [...bd.querySelectorAll(".w")];
  const total = ws.reduce((n, w) => n + w.textContent.length, 0) || 1;
  let t = 0;
  return ws.map(w => {
    const span = dur * (w.textContent.length / total);
    const win = { w, from:t, to:t + span };
    t += span; return win;
  });
}
/* THE CARRIER, COLLAPSED (§6): no 44px strip at 340px — the trace is drawn on
   the answer card's own top edge, so the glass costs the log nothing. */
function scTrace(el){
  let cv = el.querySelector("canvas.sc-trace");
  if(!cv){ cv = document.createElement("canvas"); cv.className = "sc-trace"; el.prepend(cv); }
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = Math.max(1, el.clientWidth), h = 9;
  if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [g, w, h];
}
function scSpikeRun(grains, el){
  /* the tail's OWN grains spike the glass — same seed, sound and light */
  const [g, w, h] = scTrace(el);
  g.clearRect(0, 0, w, h);
  const span = 150;
  for(const gr of grains){
    const x = w*.5 + (gr.at/span)*w*.45;
    const sh = Math.min(h, 2 + gr.gain*120);
    g.fillStyle = `rgba(198,212,228,${Math.min(.9, .25 + gr.gain*8)})`;
    g.fillRect(x, (h-sh)/2, 2, sh);
  }
  /* if a voice is on the channel the playhead owns this canvas; otherwise the
     tail was all there was, and dead air must render as dead air */
  scT(() => { if(SC.playingRow !== 0) return; scDeadLine(el); }, 900);
}
function scDeadLine(el){
  /* dead air renders as dead air: one flat etched line, zero rAF running */
  if(!el || !el.isConnected) return;
  const [g, w, h] = scTrace(el);
  g.clearRect(0, 0, w, h);
  g.fillStyle = "rgba(107,114,110,.4)";
  g.fillRect(0, Math.round(h/2), w, 1);
}
function scPlayhead(m, a, el){
  const pk = SC.peaks.get(m.id);
  const [g, w, h] = scTrace(el);
  g.clearRect(0, 0, w, h);
  const dur = a.duration || 1, frac = Math.min(1, a.currentTime / dur);
  if(pk && pk.length){
    const px = w*.5;                               // a FIXED 1px playhead; peaks scroll past
    pk.forEach((v, i) => {
      const x = px + (i/pk.length - frac) * w * .9;
      if(x < 0 || x > w) return;
      const sh = Math.min(h, 2 + v*(h-3));
      g.fillStyle = i/pk.length <= frac ? "rgba(198,212,228,.75)" : "rgba(107,114,110,.5)";
      g.fillRect(x, (h-sh)/2, 1.6, sh);
    });
    g.fillStyle = "rgba(233,237,240,.95)"; g.fillRect(px, 1, 1, h-2);
  } else {
    g.fillStyle = "rgba(198,212,228,.6)";
    g.fillRect(0, Math.round(h/2), w*frac, 1.5);
  }
}
async function scPeaksFor(m){
  /* decode-only, on an OfflineAudioContext — the live AC budget is untouched */
  if(SC.peaks.has(m.id)) return SC.peaks.get(m.id);
  const vox = SC.vox.get(m.id); if(!vox) return null;
  try{
    const buf = await (await fetch(vox)).arrayBuffer();
    const oc = new OfflineAudioContext(1, 16000, 16000);
    const dec = await oc.decodeAudioData(buf.slice(0));
    const ch = dec.getChannelData(0), n = 180, out = new Array(n).fill(0);
    const step = Math.max(1, Math.floor(ch.length / n));
    for(let i = 0; i < n; i++){
      let mx = 0;
      for(let j = i*step; j < Math.min(ch.length, (i+1)*step); j += 16)
        mx = Math.max(mx, Math.abs(ch[j]));
      out[i] = mx;
    }
    SC.peaks.set(m.id, out);
    return out;
  }catch(e){ return null; }
}
function scStopPlayback(){
  if(SC.audio){ try{ SC.audio.pause(); }catch(e){} }
  cancelAnimationFrame(SC.beamRaf); SC.beamRaf = 0;
  SC.audio = null; SC.playingRow = 0;
  /* THE LOCK SCREEN LETS GO TOO. Leaving these set means a phone lying on the
     seat still advertises "ATLAS · SIDE CHANNEL" after the answer ended, and a
     lock-screen play tap resumes the clip from a buffer that revoking the blob
     does not touch. In THERAPIST mode that is a private conversation replayable
     by whoever picks the phone up. Nothing speaks once the room is quiet. */
  try{
    if("mediaSession" in navigator){
      navigator.mediaSession.metadata = null;
      navigator.mediaSession.setActionHandler("play", null);
      navigator.mediaSession.setActionHandler("pause", null);
      navigator.mediaSession.playbackState = "none";
    }
  }catch(e){}
  scArc("arc", false);
  if(onSC()) scState();
}
function scDone(el){
  el.classList.add("done");
  el.querySelectorAll(".w").forEach(w => { w.classList.add("lit"); w.classList.remove("now"); });
}
async function scSettle(m, el, a){
  /* SETTLE-TO-TAPE: the exchange becomes tape you can see */
  scDone(el);
  let dur = a && a.duration;
  if(a && !(dur > 0)){
    /* the muted path settles a clip that was never played, so its metadata may
       not have loaded and duration is NaN — the stamp would silently lose its
       length. Wait a beat for the header rather than print a half-truth. */
    dur = await new Promise(res => {
      const done = () => res(a.duration);
      const t = setTimeout(() => res(a.duration), 1200);
      a.addEventListener("loadedmetadata",
        () => { clearTimeout(t); done(); }, { once:true });
    });
  }
  if(dur > 0){ const who = el.querySelector(".who"); if(who) who.textContent = scStamp(m, dur); }
  const pk = await scPeaksFor(m);
  if(pk && el.isConnected && !el.querySelector(".sc-tape")){
    const cv = document.createElement("canvas");
    cv.className = "sc-tape"; cv.width = 360; cv.height = 12;
    const g = cv.getContext("2d"); g.fillStyle = "#6B726E";
    pk.forEach((v, i) => { const h = 1 + v*10; g.fillRect(i*2, (12-h)/2, 1.4, h); });
    el.appendChild(cv);
  }

}
async function scHear(m, el, isArrival){
  /* The three-condition autoplay gate rides the CALLER for arrivals (answer
     just landed ∧ document visible ∧ he is standing on the side channel); a ▶
     tap is itself the gesture gate. THE GENERATION TOKEN: every await below is
     a window for a second tap, and a stale invocation must die at each one or
     two voices play over each other. */
  const gen = ++SC.gen;
  scStopPlayback();
  /* A RADIO IS HALF-DUPLEX, and this is not a nicety. He can tap TALK while
     ATLAS composes; if the answer then plays with the mic still open, af_heart
     goes into a live capture, the 2.3s-silence rule closes that take, and the
     spine transcribes ATLAS's own words and sends them back as HIS turn.
     echoCancellation is not a guarantee against media-element playback on
     Android. The voice takes the channel; SC.loop stays true, so scReopenMic
     hands the mic straight back when the answer is done. It also settles
     §7's "one rAF owner per moment" — the VU loop dies with the take. */
  if(SC.rec) scStopTracks();
  const pb = el.querySelector(".play");
  const restore = () => { if(pb){ pb.textContent = "▶"; pb.disabled = false; } };
  if(pb){ pb.textContent = "…"; pb.disabled = true; }   // a slow fetch must read as WORKING
  let obj = await scVoice(m.id);
  if(gen !== SC.gen){ restore(); return; }
  if(!obj && isArrival){
    /* the row lands before the WAV finishes cutting — an arrival waits a few
       beats for its voice before conceding. No consolation beep, ever. */
    for(let i = 0; i < 4 && !obj; i++){
      await new Promise(res => scT(res, 2200));
      if(gen !== SC.gen){ restore(); return; }
      obj = await scVoice(m.id);
    }
    if(gen !== SC.gen){ restore(); return; }
    if(!obj){ restore(); scDone(el); scReopenMic(); return; }
  }
  if(!obj){ restore(); scWhy("no voice for this row — the text is the record"); return; }
  if(isArrival && !muted()){
    scSpikeRun(squelchTail(), el);                 // THE TAIL — one seed, ear and eye
    buzz(HAPTIC.rx);                               // his hand is on the instrument
    await new Promise(res => scT(res, 190));      // …then 60ms of NOTHING
    if(gen !== SC.gen){ restore(); return; }
  }
  restore();
  const a = new Audio(obj);
  SC.audio = a; SC.playingRow = m.id;
  try{
    if("mediaSession" in navigator){
      /* SCREEN-OFF SURVIVAL: the answer keeps speaking with the screen dark and
         the steering wheel can pause it; the light picks up when he looks. */
      navigator.mediaSession.metadata = new MediaMetadata({
        title:"ATLAS", artist:"SIDE CHANNEL · ALMANAC", album:"CH 21" });
      navigator.mediaSession.setActionHandler("play",  () => { a.play().catch(() => {}); });
      navigator.mediaSession.setActionHandler("pause", () => { try{ a.pause(); }catch(e){} });
    }
  }catch(e){}
  if(muted()){ scSettle(m, el, a); scReopenMic(); return; }
  try{ await a.play(); }
  catch(e){
    /* autoplay refused (no gesture yet) — the row stands, ▶ is the door */
    if(gen === SC.gen){ scStopPlayback(); scDone(el); }
    scReopenMic(); return;
  }
  if(gen !== SC.gen){ try{ a.pause(); }catch(e){} return; }
  scPeaksFor(m);                                   // the tape decodes while it speaks
  scArc("arc", true); scState("SPEAKING");
  const bd = el.querySelector(".bd");
  /* EMPTY until the clip's real duration is known. Seeding this with
     scWordTimes(bd, 0) looks harmless and is not: it returns one window per
     word with from=to=0, so `!wins.length` is already false, the real
     durations are never filled in, and every word passes `t >= 0` on the
     first frame — the whole message lights at once and the beam is dead.
     Proven on row 50 (10.8s clip) before this line was changed. */
  const wins = [];
  /* REDUCED MOTION IS NOT A COSTUME CHANGE — it is less work. §7: the beam
     becomes a whole-message brighten on `play`, and the carrier draws no live
     trace at all (the tape still engraves on `ended`). Running the rAF anyway
     and merely re-adding .lit to every word 60 times a second would honour the
     look and none of the reason. So under reduce() there is no loop at all. */
  if(reduce()){
    bd.querySelectorAll(".w").forEach(w => w.classList.add("lit"));
  } else {
    const beam = () => {
      if(!SC.audio || SC.audio !== a) return;      // ONE rAF owner per moment
      const t = a.currentTime, dur = a.duration || 0;
      if(dur && !wins.length) wins.push(...scWordTimes(bd, dur));
      for(const win of wins){
        const on = t >= win.from;
        win.w.classList.toggle("lit", on);
        win.w.classList.toggle("now", on && t < win.to);
      }
      scPlayhead(m, a, el);
      if(!a.paused && !a.ended) SC.beamRaf = requestAnimationFrame(beam);
    };
    /* THE LIGHT IS PLAYBACK, BOTH WAYS. A steering-wheel or lock-screen pause
       freezes the beam because the loop stops rescheduling — but nothing ever
       restarted it, so the second half of the answer used to speak with the
       words frozen mid-sentence. The glyph and the state word are wired to the
       same two events: they must never say SPEAKING at a paused clip. */
    a.addEventListener("play", () => {
      if(SC.audio !== a) return;
      scArc("arc", true); scState("SPEAKING");
      if(!SC.beamRaf) SC.beamRaf = requestAnimationFrame(beam);
    });
    a.addEventListener("pause", () => {
      if(SC.audio !== a || a.ended) return;
      cancelAnimationFrame(SC.beamRaf); SC.beamRaf = 0;
      scArc("arc", false); scState("HELD");
    });
    SC.beamRaf = requestAnimationFrame(beam);
  }
  a.addEventListener("ended", () => {
    scT(() => {                                  // THE SETTLE — a 240ms hold
      scSettle(m, el, a);
      if(SC.audio === a) scStopPlayback();         // never tear down a NEWER playback
      scReopenMic();
    }, 240);
  }, { once:true });
}

/* ── the dead-air watch: the honest clock, the follow, the arrival ────── */
async function scHoldWake(){
  /* The request is an await. If the answer lands inside it, scReleaseWake()
     has already run against a null sentinel and the lock that arrives after
     is owned by nobody — the screen then stays lit until the document hides.
     Never held at idle means never, including the idle that started mid-grant. */
  try{
    const s = await navigator.wakeLock?.request("screen");
    if(!s) return;
    if(!SC.waiting){ try{ s.release(); }catch(e){} return; }
    SC.wake = s;
  }catch(e){}
}
function scReleaseWake(){ try{ SC.wake?.release(); }catch(e){} SC.wake = null; }
function scClearWait(){
  if(!SC.waiting) return;
  clearInterval(SC.waiting.clockT); clearTimeout(SC.waiting.followT);
  SC.waiting = null;
  scArc("atl", false);
  if(onSC()) scState();
  scReleaseWake();
}
function scStartWait(sayId){
  scClearWait();
  SC.waiting = { sayId, t0: Date.now(), clockT:0, followT:0 };
  scArc("atl", true); scState();
  SC.waiting.clockT = setInterval(() => scState(), 1000);   // the ONE interval
  scHoldWake();                                             // held only while live
  scFollow();
}
/* ZERO poll intervals: a single-timeout chain with four deaths — room exit,
   the answer landing, the 6-minute cap, and pagehide. */
function scFollow(delay){
  if(!SC.waiting) return;
  if(Date.now() - SC.waiting.t0 > 360000){
    scClearWait();
    scWhy("six minutes and no answer — your words hold; nothing was lost");
    scEndLoop(null);      // the loop ends HERE, or his next tap only mutes
    return;
  }
  SC.waiting.followT = setTimeout(async () => {
    if(!SC.waiting) return;
    if(document.visibilityState !== "visible"){ scFollow(); return; }  // clock keeps true time
    const sayId = SC.waiting.sayId;
    try{
      const d = await grab(`/api/threads/${scSeg(SC.run)}/messages`);
      if(!SC.waiting) return;
      const known = new Set(SC.msgs.map(m => String(m.id)));
      const fresh = (d.messages || []).filter(m => !known.has(String(m.id)));
      const landed = fresh.find(m => m.sender === "operation" && Number(m.id) > Number(sayId));
      if(landed){
        scClearWait();
        for(const m of fresh) scAppend(m);
        scLoadRuns().catch(() => {});
        const el = $("work").querySelector(scSel(landed.id));
        if(landed.kind === "undelivered"){
          scWhy("no answer came — your words hold. the turn stays in the run;"
                + " promoting it to the session is a hold on the desk");
          if(el) scDone(el);
          scEndLoop(null);      // the loop ends HERE, or his next tap only mutes
        } else if(landed.kind === "answer" && el){
          if(document.visibilityState === "visible" && onSC()) scHear(landed, el, true);
          else SC.defer = { m: landed, id: landed.id };   // deferred, NOT fired
        }
        return;
      }
    }catch(e){ /* the follow never breaks the room */ }
    scFollow();
  }, delay == null ? 5000 : delay);
}

/* ── TALK — the road loop. His ruling: he cannot hold-to-talk on the road.

   the answer finishes speaking the mic REOPENS. The same tap is the panic
   button the cab needs, and hidden kills it outright. ─────────────────── */
function scCap(t){ $("talkcap").textContent = t; }

  SC.takeGen++;                 // any getUserMedia still in flight is now DEAD on arrival
  const r = SC.rec; if(!r) return;
  try{ r.proc.disconnect(); }catch(e){}
  try{ r.src.disconnect(); }catch(e){}
  try{ r.stream.getTracks().forEach(t => t.stop()); }catch(e){}   // EVERY path — a
  try{ r.ctx.close(); }catch(e){}                                 // leaked pill reads
  cancelAnimationFrame(SC.vuRaf); SC.vuRaf = 0;                   // as surveillance

}
function scEndLoop(msg){
  SC.loop = false; SC.emptyTakes = 0;

}
async function scStartTake(){
  if(SC.rec || document.visibilityState !== "visible" || !SC.loop || !onSC()) return;

     reopen timer landing on top of an empty-take restart) both get past it,
     both get a live stream, and the second overwrites SC.rec — leaving the
     first stream's tracks owned by nobody. scStopTracks only ever stops what
     SC.rec holds, so that mic stays HOT until the page unloads, with its own
