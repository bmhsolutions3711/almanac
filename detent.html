    proc = ctxA.createScriptProcessor(4096, 1, 1);
    analyser = ctxA.createAnalyser(); analyser.fftSize = 512;
    const mute = ctxA.createGain(); mute.gain.value = 0;   // the zero-gain node is load-bearing
    src.connect(analyser); src.connect(proc); proc.connect(mute).connect(ctxA.destination);
  }catch(e){
    try{ stream.getTracks().forEach(t => t.stop()); }catch(x){}
    try{ ctxA && ctxA.close(); }catch(x){}
    thud(); scEndLoop("this device would not open an audio context — nothing was recorded");
    return;
  }
  const chunks = [];
  proc.onaudioprocess = ev => chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
  SC.rec = { stream, ctx:ctxA, src, proc, analyser, chunks, t0: performance.now(),
             rate: ctxA.sampleRate, spoke:false, lastVoice:0 };
  const btn = $("talk");
  btn.classList.add("rec"); scCap("LISTENING TAP=MUTE");
  keyThump(); buzz(HAPTIC.arm); scArc("you", true);
  const data = new Uint8Array(analyser.frequencyBinCount);
  const vu = () => {
    const rec = SC.rec; if(!rec) return;
    analyser.getByteTimeDomainData(data);
    let rms = 0; for(const v of data) rms += (v-128)*(v-128);
    rms = Math.sqrt(rms/data.length)/128;
    /* THE CARRIER, COLLAPSED INTO THE KEY: the ring's sweep IS his live RMS */
    btn.style.setProperty("--sc-sweep", (Math.min(1, rms*6)*360).toFixed(1) + "deg");
    const t = performance.now();
    if(rms > 0.028){ rec.spoke = true; rec.lastVoice = t; }
    if(rec.spoke && t - rec.lastVoice > 2300) return scFinishTake("silence");
    if(!rec.spoke && t - rec.t0 > 9000)       return scFinishTake("nothing");
    if(t - rec.t0 > 60000)                    return scFinishTake("cap");
    SC.vuRaf = requestAnimationFrame(vu);
  };
  SC.vuRaf = requestAnimationFrame(vu);
}
async function scFinishTake(why){
  const rec = SC.rec; if(!rec) return;
  const { chunks, rate, spoke } = rec;
  scStopTracks();
  if(!spoke || why === "nothing"){
    SC.emptyTakes = (SC.emptyTakes || 0) + 1;
    if(SC.loop && SC.emptyTakes < 2){ scCap("STILL HERE TAP=MUTE"); scStartTake(); }
    else scEndLoop("the mic closed — tap TALK when you want me");
    return;
  }
  SC.emptyTakes = 0;
  const n = chunks.reduce((s, c) => s + c.length, 0);
  if(!n){ if(SC.loop) scStartTake(); return; }
  /* Float32 → Int16 RIFF WAV, client-side, downsampled to 16k for the spine */
  const flat = new Float32Array(n); let off = 0;
  for(const c of chunks){ flat.set(c, off); off += c.length; }
  const ratio = rate / 16000, mlen = Math.floor(n / ratio);
  const pcm = new Int16Array(mlen);
  for(let i = 0; i < mlen; i++){
    const v = Math.max(-1, Math.min(1, flat[Math.floor(i*ratio)]));
    pcm[i] = v < 0 ? v*0x8000 : v*0x7FFF;
  }
  const wav = new ArrayBuffer(44 + pcm.length*2), dv = new DataView(wav);
  const ws = (o, s) => { for(let i = 0; i < s.length; i++) dv.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,"RIFF"); dv.setUint32(4, 36 + pcm.length*2, true); ws(8,"WAVE");
  ws(12,"fmt "); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,16000,true); dv.setUint32(28,32000,true); dv.setUint16(32,2,true);
  dv.setUint16(34,16,true); ws(36,"data"); dv.setUint32(40, pcm.length*2, true);
  new Int16Array(wav, 44).set(pcm);
  scCap("READING…");
  /* TWO STAGES, TWO FAILURES. Wrapping the transcribe and the send in one try
     made scSend's 9s abort surface as "the transcriber ran past 30s" — the
     wrong stage, the wrong number, and a claim about what failed that was not
     true. Worse, a send failure dropped his already-transcribed words and
     reopened the mic with NOTHING on the glass saying the turn never went. */
  let text = "";
  const ctrl = new AbortController();
  const kill = setTimeout(() => ctrl.abort(), 30000);   // cleared on BOTH exits
  try{
    const r = await fetch(url("/api/stt"), { method:"POST",
      headers: hdr({ "Content-Type":"audio/wav" }), body: wav, signal: ctrl.signal });
    const d = await r.json().catch(() => ({}));
    if(!r.ok || !d.text) throw new Error(d.error
      || "the spine has not answered with the transcript — your take was not kept");
    text = d.text;
  }catch(err){
    thud(); buzz(HAPTIC.refuse);
    scWhy(err && err.name === "AbortError"
      ? "the transcriber ran past 30s — your take was not kept"
      : (err && err.message ? err.message : String(err)));
    if(SC.loop && onSC()){ scCap("LISTENING TAP=MUTE"); scStartTake(); }
    else scCap(SC.loop ? "MIC CLOSED" : "TALK");
    return;
  }finally{ clearTimeout(kill); }
  try{
    scCap("SENT");
    await scSend(text);        // spoken turns SEND: the road cannot review a screen
  }catch(err){
    thud(); buzz(HAPTIC.refuse);
    /* his words are read and NOT sent — say both halves, and put the text he
       already spoke into the well so the lever can send it by hand */
    scWhy((err && err.name === "AbortError"
      ? "no answer from the spine in 9s — nothing was sent"
      : `the channel didn't take it: ${err && err.message ? err.message : err} — nothing was sent`)
      + "; your words are in the well");
    $("say").value = text;
    $("say").dispatchEvent(new Event("input", { bubbles:true }));
    scEndLoop(null);           // the road loop stops on a real refusal, by itself
    return;
  }
  if(!SC.rec) scCap(SC.loop ? "MIC CLOSED" : "TALK");
}
function scReopenMic(){
  if(SC.loop && !SC.rec && onSC()) scT(() => scStartTake(), 350);
}

/* ── the transmission itself — one door for typed and spoken turns ────── */
async function scSend(body, key){
  const words = String(body || "").trim();
  if(!words) throw new Error("an empty transmission is not a turn");
  if(!SC.run) throw new Error("no run is tuned — start one first");
  const net = new AbortController();
  const kill = setTimeout(() => net.abort(), 9000);
  try{
    const r = await fetch(url(`/api/threads/${scSeg(SC.run)}/say`), { method:"POST", signal: net.signal,
      headers: hdr({ "Content-Type":"application/json",
                     "Idempotency-Key": key || (crypto.randomUUID
                       ? crypto.randomUUID() : String(Math.random()).slice(2)) }),
      body: JSON.stringify({ body: words, mode: SC.mode }) });
    clearTimeout(kill);
    const d = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(d.error || ("the spine answered " + r.status));
    rogerBeep(); buzz(HAPTIC.seat);                 // ONLY after a parsed 2xx
    scAppend({ id: d.id, at: new Date().toISOString(), sender:"bryan", kind:"say",
               body: words, thread_id: SC.run, mode: SC.mode });
    if(d.answering) scStartWait(d.id);
    else {
      /* no answer is coming, so nothing will ever hand the mic back — end the
         loop here or his next TALK tap merely mutes a loop that is already idle
         and he has to tap twice, in the cab, right after it failed him */
      scWhy("sent — but ATLAS could not take the mic; the turn stands");
      scEndLoop(null);
    }
    scLoadRuns().catch(() => {});
    return d;
  }catch(err){ clearTimeout(kill); throw err; }
}

/* ── mount / teardown ────────────────────────────────────────────────── */
async function scMount(){
  /* Re-entrancy guard, not decoration: rolling off the node and straight back
     on while the first mount is still awaiting would start a SECOND one, and
     on an empty rail that is two runs created for one arrival. */
  if(SC.mounting) return;
  SC.mounting = true;
  try{
    await scLoadRuns();
    if(!onSC()) return;
    /* An empty rail does NOT auto-create a run. Rolling onto index 2, or a
       push tap landing here, would otherwise write a thread to the spine with
       no hand on it. The room says so instead and waits for + NEW RUN. */
    if(!SC.runs.length){ SC.run = null; SC.msgs = []; scRender(); }
    /* Re-entering the room always refetches the tuned run. He rolls away, the
       answer lands, he rolls back — painting the cached turns would show him a
       log the spine already disagrees with, which is the one thing this plate
       must never do. */
    else await scTune(SC.runs.some(r => r.id === SC.run) ? SC.run : SC.runs[0].id);
    if(onSC()) paint();
  }catch(e){
    scWhy("the spine has not answered with the runs: " + (e.message || e));
  }finally{ SC.mounting = false; }
}
/* THE SINGLE TEARDOWN POINT (§6). This node owns a rAF, an <audio>, a mic, an
   interval and a timeout chain; leaving it kills every one of them. */
function scTeardown(){
  SC.mounted = false;
  SC.gen++;                                  // any in-flight scHear dies at its next await
  scStopPlayback();
  scClearWait();
  scEndLoop(null);
  scSweepVox();
  clearTimeout(scWhyT);          // or a stale 5.2s timer blanks the NEXT node's why line
  SC.defer = null;
  scArc("you", false); scArc("atl", false); scArc("arc", false);
  $("scwell").hidden = true;
  $("arcg").hidden = true;
  /* The transcript LEAVES with the room. paint() only hides #work, and the
     nodes that render nothing into it leave whatever was last painted sitting
     in the live DOM — which for CH 21 in THERAPIST mode is the last thing that
     should still be lying around after he has rolled away. Re-entry refetches. */
  $("work").textContent = "";
  $("work").classList.remove("sc-log");
}

$("talk").addEventListener("click", () => {

  }
  if(SC.loop){ scEndLoop("mic closed — the answer still lands in the run"); return; }

document.addEventListener("visibilitychange", () => {

    clearTimeout(SC.waiting.followT);

function paint(){

    $("sub").textContent = [s.kicker, s.sub].filter(Boolean).join(" · ");
    /* The settle arm died 2026-08-01 — Bryan: "we replace the old way of
       tracking payment of monthly expenses... kill the detent lever too."

function landOn(i){
  i = Math.max(0, Math.min(NODES.length-1, i));
  if(i === spin.pos) return;
  const heavy = crosses(spin.pos, i);
  spin.pos = i;
  if(heavy){ buzz(HAPTIC.heavy); tickHeavy(); } else { buzz(HAPTIC.light); tickLight(); }
  paint();
}

/* ── roll ─────────────────────────────────────────────────────────────── */
const zone = $("zone");
let drag = null, raf = 0;
zone.addEventListener("pointerdown", e => {
  e.preventDefault(); ctx();
  try{ zone.setPointerCapture(e.pointerId); }catch(x){}
  cancelAnimationFrame(raf); raf = 0;
  drag = { y:e.clientY, base:spin.cont, walled:false };
});
zone.addEventListener("pointermove", e => {
  if(!drag) return;
  let next = drag.base + (drag.y - e.clientY);
  if(next < 0){
    next *= 0.18;                                     // the hard stop above TODAY
    if(!drag.walled && next < -8){ drag.walled = true; buzz(HAPTIC.wall); tickWall(); }
  } else if(next > TOTAL){ next = TOTAL + (next-TOTAL)*0.18; }
  else drag.walled = false;
  spin.cont = next;
  const t = nodeAt(Math.max(0, Math.min(TOTAL, next)));
  if(t !== spin.pos) landOn(t); else drawWheel();
});
function release(){
  if(!drag) return; drag = null;
  const target = TRAVEL[spin.pos];
  const step = () => {
    const d = target - spin.cont;
    if(Math.abs(d) < .4 || reduce()){ spin.cont = target; drawWheel(); raf = 0; return; }
    spin.cont += d*.28; drawWheel(); raf = requestAnimationFrame(step);
  };
  cancelAnimationFrame(raf); raf = requestAnimationFrame(step);
}
zone.addEventListener("pointerup", release);
zone.addEventListener("pointercancel", release);
zone.addEventListener("wheel", e => {
  e.preventDefault(); ctx();
  const t = spin.pos + (e.deltaY > 0 ? 1 : -1);
  if(t < 0){ buzz(HAPTIC.wall); tickWall(); return; }
  if(t > NODES.length-1) return;
  landOn(t); spin.cont = TRAVEL[spin.pos]; drawWheel();
}, {passive:false});
addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.key === "ArrowDown" || e.key === "j"){ e.preventDefault(); ctx();
    if(spin.pos < NODES.length-1){ landOn(spin.pos+1); spin.cont = TRAVEL[spin.pos]; drawWheel(); } }
  if(e.key === "ArrowUp" || e.key === "k"){ e.preventDefault(); ctx();
    if(spin.pos === 0){ buzz(HAPTIC.wall); tickWall(); }
    else { landOn(spin.pos-1); spin.cont = TRAVEL[spin.pos]; drawWheel(); } }
  if(e.key === "t" || e.key === "Home"){ e.preventDefault(); goHome(); }
});
function glideTo(target){
  const step = () => { const d = target - spin.cont;
    if(Math.abs(d) < .4 || reduce()){ spin.cont = target; drawWheel(); raf = 0; return; }
    spin.cont += d*.20; drawWheel(); raf = requestAnimationFrame(step); };
  cancelAnimationFrame(raf); raf = requestAnimationFrame(step);
}
function goHome(){
  if(spin.pos === 0) return;
  ctx(); buzz(HAPTIC.heavy); tickHeavy();
  spin.pos = 0; paint();
  glideTo(0);
}
$("plate").addEventListener("dblclick", goHome);

/* The strip breathes with the draft; the lever arms only when words exist. */

/* THE COLD OPEN: a notification tap answers the radio. The spindle SWINGS —
   heavy tick, real travel — then the waiting message plays its resolve.
   hashchange matters: a live window gets hash-only changes from the service
   worker's navigate(); boot never re-runs. */
function swingTo(kind){
  const i = NODES.findIndex(x => x.kind === kind);
  if(i < 0) return;
  if(i !== spin.pos) landOn(i);          // landOn supplies the heavy detent
  glideTo(TRAVEL[i]);
}
const swingToRadio = () => swingTo("radio");
addEventListener("hashchange", () => {
  const h = location.hash;
  if(h !== "#radio" && h !== "#sidech") return;
  history.replaceState(null, "", location.pathname + location.search);
  swingTo(h === "#radio" ? "radio" : "sidech");
});

/* The instrument switch. Flips to the desk — the almanac laid open flat
   (desk.html), the laptop's traditional tabbed page. The choice persists per
   device; the throw is shown before the page turns so the switch reads as a
   switch, not a link. */

  ctx(); buzz(HAPTIC.detent); tickHeavy();
  localStorage.setItem("almanac_view", "desk");
  setTimeout(() => { location.href = "desk.html"; }, 160);
});

/* THE LAMP REACHES OUT (Almanac #10). Tap the lamp: this device goes in
   reach — the light can find you when the plate is in your pocket. Tap it
   again while in reach: the spine sends a REAL push, proof in the hand.
   On boot, an already-granted device re-subscribes silently: Android battery
   management churns FCM registrations (all 9 historical subscriptions died
   within minutes-to-days), so refresh-on-every-boot is the fix — the spine
   upserts by endpoint, so the norm costs nothing. */
const b64ToU8 = s => {
  const pad = "=".repeat((4 - s.length % 4) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
};
async function pushSubscribe(silent){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub){
    if(Notification.permission !== "granted"){
      if(silent) return null;
      if(await Notification.requestPermission() !== "granted") return null;
    }
    const r = await fetch(url("/api/push/vapid"), { headers: hdr() });
    const key = (await r.json()).publicKey;
    if(!key) throw new Error("the spine has no VAPID key");
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true,
      applicationServerKey: b64ToU8(key) });
  }
  const res = await fetch(url("/api/push/subscribe"), { method: "POST",
    headers: hdr({ "Content-Type": "application/json" }),
    body: JSON.stringify({ subscription: sub.toJSON(),
                           label: navigator.userAgent.slice(0, 80) }) });
  if(!res.ok) throw new Error("the spine refused the subscription");
  return sub;
}
let lampBusy = false;
$("lamp").addEventListener("click", async () => {
  if(lampBusy) return; lampBusy = true;
  const w = $("whyLine"); w.hidden = false;
  try{
    if(!configured()){ w.textContent = "connect to the spine first"; return; }
    const reg = await navigator.serviceWorker.ready;
    const had = await reg.pushManager.getSubscription();
    if(!had){
      w.textContent = "putting this device in reach…";
      const sub = await pushSubscribe(false);
      w.textContent = sub
        ? "in reach — the light can find you now. tap the lamp again to prove it"
        : "notifications were not allowed — nothing subscribed";
    } else {
      await pushSubscribe(true);              // refresh before proving
      w.textContent = "asking the spine to reach this device…";
      const r = await fetch(url("/api/push/test"), { method: "POST",
        headers: hdr({ "Content-Type": "application/json" }), body: "{}" });
      const out = await r.json().catch(() => ({}));
      w.textContent = r.ok && out.sent
        ? `the spine pushed to ${out.sent} device(s) — it should be in your hand`
        : `the push did not go: ${out.error || out.decision || r.status}`;
    }
  }catch(e){ w.textContent = "push failed: " + (e.message || e); }
  finally{ lampBusy = false;
    clearTimeout(hintT); hintT = setTimeout(() => { w.hidden = true; }, 5000); }
});

/* ── THE LEVER — the latch, unchanged. The wall clock decides. ─────────── */
const lever = $("lever"), rail = $("rail");
let L = { held:false, t0:0, detent:null, boundary:null, armed:null, key:null };
let hintT = 0;

function leverDown(e){
  const n = NODES[spin.pos];
  if(!n || (n.kind !== "standing" && n.kind !== "close" && n.kind !== "radio"
            && n.kind !== "sidech")) return;
  if(n.kind === "close" && !n.c) return;
  if(n.kind === "radio" && !$("mic").value.trim()) return;   // a mic with nothing to say
  if(n.kind === "sidech" && (!$("say").value.trim() || !SC.run)) return;
  if(lever.disabled || lever.dataset.state === "seating") return;
  if(State.source !== "live") return;
  if(document.visibilityState !== "visible") return;      // a hold he cannot see is not a hold
  if(e && e.pointerId != null){ try{ lever.setPointerCapture(e.pointerId); }catch(x){} }
  try{ rail.getAnimations().forEach(a => a.cancel()); }catch(x){}
  clearTimeout(hintT); $("whyLine").hidden = true;
  lever.dataset.state = "arming"; rail.style.willChange = "transform";
  buzz(HAPTIC.arm); ctx();
  if(n.kind === "radio" || n.kind === "sidech"){ keyThump(); $("kick").innerHTML = `<b>KEYED</b>`; }
  const r = reduce(), DUR = r ? 260 : 460;
  L.held = true; L.t0 = performance.now();
  if(!L.key) L.key = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
  L.detent = setTimeout(() => buzz(HAPTIC.detent), r ? 220 : 391);
  L.armed = rail.animate({transform:["scaleX(0)","scaleX(1)"]},
    {duration:DUR, easing:EASE.settle, fill:"forwards"});
  L.armed.finished.catch(()=>{});
  /* The wall clock, never animation.finished — a hidden document freezes its
     timeline and resumes it later, which once fired a write nobody asked for. */
  L.boundary = setTimeout(() => {
    if(!L.held) return;
    if(lever.dataset.state !== "arming") return;
    if(document.visibilityState !== "visible") return;
    if(performance.now() - L.t0 < DUR - 16) return;
    seat();
  }, DUR);
}
function leverUp(){
  L.held = false;
  clearTimeout(L.boundary); L.boundary = null;
  if(lever.dataset.state !== "arming") return;
  clearTimeout(L.detent); L.detent = null;
  let at = "scaleX(0)"; try{ at = getComputedStyle(rail).transform; }catch(x){}
  try{ L.armed && L.armed.cancel(); }catch(x){}
  const back = rail.animate({transform:[at === "none" ? "scaleX(0)" : at, "scaleX(0)"]},
    {duration:180, easing:"ease-out"});
  back.finished.then(() => { rail.style.transform = "scaleX(0)"; }).catch(()=>{});
  rail.style.willChange = ""; lever.dataset.state = "";
  /* A silent reset here is indistinguishable from a broken button. Say it. */
  const w = $("whyLine"); w.hidden = false;
  const upK = NODES[spin.pos] && NODES[spin.pos].kind;
  if(upK === "radio" || upK === "sidech"){
    $("kick").innerHTML = upK === "radio"
      ? `<b>CH 19</b> &nbsp;·&nbsp; ONE CHANNEL` : `<b>CH 21</b> &nbsp;·&nbsp; TWO SEATS`;
    w.textContent = "released before it keyed — nothing was sent. the mic is held, not tapped";
  } else {
    w.textContent = "released before it seated — nothing was written. the lever is held, not tapped";
  }
  clearTimeout(hintT); hintT = setTimeout(() => { w.hidden = true; }, 2600);
}
async function seat(){
  clearTimeout(L.detent); L.detent = null;
  clearTimeout(L.boundary); L.boundary = null;
  lever.dataset.state = "seating";
  const node = NODES[spin.pos];
  if(node.kind === "sidech"){
    /* CH 21 rides the same latch — press-to-talk IS press-and-hold — but its
       transmission lives in scSend(): one door for typed and spoken turns, so
       the road loop and the lever can never drift apart. */
    $("leverCap").textContent = "TRANSMITTING";
    const words = $("say").value.trim(), key = L.key;
    try{
      await scSend(words, key);
      L.key = null;
      lever.dataset.state = "";
      $("whyLine").hidden = true;
      $("say").value = "";
      lever.disabled = true;
      $("leverCap").textContent = "SENT";
      $("kick").innerHTML = `<b>CH 21</b> &nbsp;·&nbsp; TWO SEATS`;
      scT(() => { if(onSC()) $("leverCap").textContent = "KEY UP"; }, 900);
    }catch(err){ refuse(err); }
    finally{ rail.style.willChange = ""; }
    return;
  }
  $("leverCap").textContent = node.kind === "radio" ? "TRANSMITTING" : "WRITING";
  /* Only the book and the radio seat here now. The settle branch that stood
     third died 2026-08-01 with the lever's pay arm — leaving a dead route to
     an unevidenced finance write is how it comes back by accident. */
  if(node.kind !== "close" && node.kind !== "radio"){
    refuse(new Error("bills are paid on the desk floor now — nothing was written"));
    return;
  }
  const path = node.kind === "close" ? "/api/entry/close" : "/api/messages";
  /* the close names its page (card #164): sessions run side by side, and the
     hold closes exactly the book the stone displayed — never "latest open" */
  const body = node.kind === "close" ? { entry_id: node.c && node.c.entry_id }
                                     : { body: $("mic").value.trim() };
  const net = new AbortController();
  const kill = setTimeout(() => net.abort("timeout"), 9000);
  try{
    const r = await fetch(url(path), {
      method:"POST", signal:net.signal,
      headers: hdr({ "Content-Type":"application/json", "Idempotency-Key": L.key }),
      body: JSON.stringify(body)
    });
    const text = await r.text();
    if(!r.ok){ let m = text.slice(0,200); try{ m = JSON.parse(text).error || m; }catch(e){} throw new Error(m); }
    clearTimeout(kill);
    caught();                                   // ← only after a parsed 2xx
  }catch(err){ clearTimeout(kill); refuse(err); }
  finally{ rail.style.willChange = ""; }
}
function caught(){
  L.key = null;
  const node = NODES[spin.pos];
  if(node && node.kind === "radio"){
    /* The release payoff, strict order: roger beep → 60ms of nothing → the
       squelch tail + the seat haptic → the strip drains → his words land
       ABOVE the squelch line, already engraved, stamped with their own
       signature. Fires only here — after a parsed 2xx. */
    lever.dataset.state = "";
    $("whyLine").hidden = true;          // a landed send clears any old refusal
    const words = $("mic").value.trim();
    rogerBeep();
    setTimeout(() => {
      squelchTail(); buzz(HAPTIC.seat);
      drainStrip();
      const sq = document.querySelector("#work .sqline");
      const el = radioCard({ id: "tx-" + Date.now(), at: new Date().toISOString(),
                             sender: "bryan", kind: "reply", body: words });
      if(sq && sq.nextSibling) sq.parentElement.insertBefore(el, sq.nextSibling);
      else if(sq) sq.parentElement.appendChild(el);
      else $("work").appendChild(el);
      if(State.radio && State.radio.messages) State.radio.messages.push(
        { id: el.dataset.mid, at: new Date().toISOString(), sender: "bryan", kind: "reply", body: words });
      $("mic").value = ""; drawStrip("");
      $("work").scrollTop = 0;
      $("leverCap").textContent = "SENT";
      $("kick").innerHTML = `<b>CH 19</b> &nbsp;·&nbsp; ONE CHANNEL`;
      setTimeout(() => {
        $("leverCap").textContent = "KEY UP";
        $("lever").disabled = true;
      }, 900);
    }, 60);
    return;
  }
  buzz(HAPTIC.seat); tine();
  const wasClose = node && node.kind === "close";
  lever.dataset.state = "";
  $("leverCap").textContent = wasClose ? "CLOSED" : "RECORDED";
  load(true);                                   // the figure moves because HE moved it
}
function refuse(err){
  buzz(HAPTIC.refuse); thud();
  lever.dataset.state = "refused";
  $("leverCap").textContent = "REFUSED";
  rail.animate({transform:["scaleX(1)","scaleX(0)"]},
    {duration:520, easing:EASE.refuse, fill:"forwards"});
  const w = $("whyLine"); w.hidden = false;
  const k = NODES[spin.pos] && NODES[spin.pos].kind;
  const sends = k === "radio" || k === "sidech";     // both send; nothing is written
  if(k === "radio")  $("kick").innerHTML = `<b>CH 19</b> &nbsp;·&nbsp; ONE CHANNEL`;
  if(k === "sidech") $("kick").innerHTML = `<b>CH 21</b> &nbsp;·&nbsp; TWO SEATS`;
  const why = err && err.message ? err.message : err;
  /* CH 19 keeps its own words, unchanged — the split does not get to rewrite
     the refusal voice of the channel it split FROM. CH 21 adds where the draft
     went, because it has a well to keep it in and CH 19 does not. */
  w.textContent = (err && (err.name === "AbortError" || String(err.message) === "timeout"))
    ? (k === "sidech" ? "no answer from the spine in 9s — nothing was sent; your words stay in the well"
       : sends ? "no answer from the spine in 9s — nothing was sent"
               : "no answer from the spine in 9s — nothing was written")
    : (k === "sidech" ? `the channel didn't take it: ${why} — nothing was sent; your words stay in the well`
       : sends ? `the channel didn't take it: ${why} — nothing was sent`
               : `the spine refused: ${why} — nothing was written`);
  /* The lamp does not change. Nothing in the world changed, so nothing in the light does. */
}
lever.addEventListener("pointerdown", leverDown);
["pointerup","pointercancel","pointerleave"].forEach(t => lever.addEventListener(t, leverUp));
lever.addEventListener("keydown", e => {
  if((e.key === "Enter" || e.key === " ") && !e.repeat){ e.preventDefault(); leverDown(null); } });
lever.addEventListener("keyup", leverUp);
document.addEventListener("visibilitychange", () => {
  if(document.hidden && lever.dataset.state === "arming") leverUp();
});
addEventListener("pagehide", () => { clearTimeout(L.detent); clearTimeout(L.boundary);
  cancelAnimationFrame(raf); });

/* ── load ─────────────────────────────────────────────────────────────── */
async function grab(path){
  const r = await fetch(url(path), { headers: hdr(), cache:"no-store" });
  if(!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0,120));
  return r.json();
}
async function load(keepPos){
  const at = spin.pos;
  try{
    const [st, bd] = await Promise.all([grab("/api/standings"), grab("/api/board")]);
    State.standings = st; State.board = bd; State.source = "live";
    // These are not worth failing the page over — TODAY renders honestly
    // unavailable until the standing lands, then repaints.
    grab("/api/standing").then(s => { State.standing = s; paint(); }).catch(()=>{});
    grab("/api/learning").then(l => { State.learn = l; paint(); }).catch(()=>{});
    grab("/api/doctrine").then(d => { State.soul = d; paint(); }).catch(()=>{});
    grab("/api/push/held").then(h => { State.held = h; paint(); }).catch(()=>{});
    grab("/api/messages").then(m => { State.radio = m; paint(); }).catch(()=>{});
    buildNodes();
    spin.pos = keepPos ? Math.min(at, NODES.length-1) : 0;
    spin.cont = TRAVEL[spin.pos];
    paint();
    if(WANT_RADIO){ WANT_RADIO = false; swingTo("radio"); }
    if(WANT_SIDECH){ WANT_SIDECH = false; swingTo("sidech"); }
  }catch(e){
    State.source = "stale";
    $("kick").textContent = "NO DATA";
    $("head").textContent = "The spine did not answer";
    setFig(null, null, true);
    $("sub").textContent = String(e.message || e);
    showConnect("could not reach the spine — if you are on the phone, check Tailscale is connected first");
  }
}

function showConnect(msg){
  $("connect").hidden = false;
  $("cfgApi").value = API || "";
  if(msg){ $("cfgMsg").textContent = msg; $("cfgMsg").classList.add("bad"); }
}
$("cfgGo").addEventListener("click", async () => {
  const a = $("cfgApi").value.trim().replace(/\/$/,""), t = $("cfgTok").value.trim();
  const m = $("cfgMsg"); m.classList.remove("bad"); m.textContent = "checking…";
  try{
    const r = await fetch(a + "/api/health", { headers:{ Authorization:"Bearer " + t } });
    if(!r.ok) throw new Error("the spine answered " + r.status);
    localStorage.setItem("almanac_api", API = a);
    localStorage.setItem("almanac_token", TOK = t);
    $("connect").hidden = true; load();
  }catch(e){ m.classList.add("bad"); m.textContent = "could not reach the spine: " + (e.message||e); }
});

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

buildNodes(); paint();
if(!configured()){ $("kick").textContent = "NOT CONNECTED"; $("head").textContent = "Connect to the spine"; showConnect(); }
else {
  load();
  // The churn fix: a device that already granted notifications re-subscribes
  // on every boot, silently. New endpoint or same, the spine upserts.
  if("serviceWorker" in navigator && "PushManager" in window)
    navigator.serviceWorker.ready.then(() => pushSubscribe(true)).catch(() => {});
}
})();
</script>
