<!--
  ARC — step 1 of the build order: THE LATCH, and nothing else.

  This file becomes index.html when the build is finished. It is deliberately NOT
  the live shell yet: v5 stays frozen and serving while this is built beside it.
  When it ships, index.html is replaced and this file is destroyed — moved means
  moved, never "also lives here".

  WHAT IS HERE: the arc, real standings from the spine, and the two-phase latch
  with its refusal. WHAT IS NOT: the book, sundown, the night count, the month
  register, the obligations tape. Those are steps 2-6 and adding them early is how
  the hardest thing ends up half-built.

  The one idea this file exists to prove:
      the progress of the latch IS the progress of the write.
  Every hold-to-confirm shipped today is a fake timer that completes, promises
  success, and only then fires a request that may fail — an instrument pretending
  it acted. Here the request leaves when the rail fills, the rail holds under
  visible tension for exactly as long as the network takes, and the check is drawn
  only after a parsed 2xx. If it fails, the row stays standing and the light does
  not move.
-->
<title>Almanac</title>

<style>
@property --alm-sun { syntax:"<number>"; inherits:true; initial-value:1; }

:root{
  color-scheme: dark;

  /* GROUND — a barn at night, not a terminal. Never #000: OLED black-crush
     destroys the falloff this design runs on. */
  --alm-ground:#16130F; --alm-ground-2:#1E1A16;
  --alm-lit:#F0E9DE; --alm-ink:#C9C2B8; --alm-muted:#7C766D; --alm-faint:#453F39;
  --alm-mark:#A44B39;              /* DECLARED — 1px ticks and rules ONLY */
  --alm-short:#E86F35;             /* CONSEQUENCE — 2px edge bars and caps ONLY */
  --alm-soon:#E3AA53;
  --alm-unknown:#6E6E6E;           /* the only achromatic token — never a state */

  --alm-sun: 1;

  --alm-fig: ui-monospace,"Roboto Mono","SF Mono","DejaVu Sans Mono",monospace;
  --alm-ui: system-ui, Roboto, -apple-system,"Segoe UI", sans-serif;
  --alm-prose: ui-serif, Georgia,"Noto Serif","Times New Roman", serif;

  --fig-inst: clamp(1.35rem,5.2vw,1.8rem);
  --txt: 1.0625rem;
  --cap: 0.6875rem;

  --s1:4px; --s2:8px; --s3:12px; --s4:20px; --s5:32px; --s6:56px;

  /* Mechanisms may overshoot 3%. Numbers never overshoot — an overshooting
     figure reads as inaccuracy, and this instrument's only asset is being believed. */
  --ease-settle: linear(0,.13 3.2%,.48 8.7%,.79 14.5%,.95 19.6%,1.02 25%,1.03 31%,1 40%,1 100%);
  --ease-refuse: linear(0,.42 12%,-.18 32%,.09 52%,-.03 72%,0 100%);
  --ease-fall: cubic-bezier(.4,0,.2,1);
}
@supports (color: oklch(0 0 0)){
  :root{
    --alm-ground:oklch(0.155 0.008 72); --alm-ground-2:oklch(0.190 0.008 72);
    --alm-lit:oklch(0.93 0.015 85);
    --alm-ink:color-mix(in oklch, var(--alm-lit) 82%, var(--alm-ground));
    --alm-muted:color-mix(in oklch, var(--alm-lit) 46%, var(--alm-ground));
    --alm-faint:color-mix(in oklch, var(--alm-lit) 22%, var(--alm-ground));
    --alm-mark:oklch(0.56 0.130 30);
    --alm-short:oklch(0.70 0.180 45);
    --alm-soon:oklch(0.81 0.125 82);
    --alm-unknown:oklch(0.52 0 0);
  }
}

/* The hidden attribute is enforced by the UA stylesheet, which loses to ANY author
   rule that sets display. Carried forward from v5 verbatim — hard won. */
[hidden]{ display:none !important }
*{ box-sizing:border-box }

html,body{ margin:0; min-height:100% }
body{
  background:var(--alm-ground); color:var(--alm-ink);
  font-family:var(--alm-ui); font-size:var(--txt); line-height:1.5;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}

/* ── the sun: two rasterised layers crossfading on opacity ─────────────────
   Animating a gradient's STOPS repaints every frame and is the fastest way to
   melt a phone. This is compositor-only. */
#alm-sky,#alm-dusk,#alm-grain{ position:fixed; inset:0; z-index:0; pointer-events:none }
#alm-sky,#alm-dusk{ transition:opacity 900ms var(--ease-fall) }
#alm-sky{
  opacity:var(--alm-sun);
  background:radial-gradient(115vmin circle at 50% -10%,
    oklch(.33 .026 84) 0%, oklch(.21 .014 78) 46%, transparent 74%);
}
#alm-dusk{
  opacity:calc(1 - var(--alm-sun));
  background:radial-gradient(165vmin 90vmin ellipse at 50% 104%,
    oklch(.31 .062 46) 0%, oklch(.19 .020 52) 52%, transparent 72%);
}
#alm-grain{ opacity:.035; background-repeat:repeat }

.shell{ position:relative; z-index:1; max-width:44rem; margin:0 auto;
        padding:var(--s5) var(--s4) var(--s6); display:flex; flex-direction:column; gap:var(--s5) }

/* ── masthead ─────────────────────────────────────────────────────────────── */
.head{ display:flex; justify-content:space-between; align-items:baseline; gap:var(--s3);
       flex-wrap:wrap; padding-bottom:var(--s3); border-bottom:1px solid var(--alm-mark) }
.wordmark{ font:600 var(--fig-inst)/1 var(--alm-fig); letter-spacing:.18em;
           text-transform:uppercase; color:var(--alm-lit); margin:0 }
.cap{ font:600 var(--cap)/1 var(--alm-fig); letter-spacing:.14em; text-transform:uppercase;
      color:var(--alm-muted) }
.cap b{ color:var(--alm-ink); font-weight:600 }

/* ── the arc ──────────────────────────────────────────────────────────────── */
#alm-arc{ display:flex; flex-direction:column }

.alm-standing{
  position:relative; display:grid; grid-template-columns:5.5em 1fr auto;
  align-items:center; gap:var(--s3);
  width:100%; min-height:64px; padding:var(--s3) var(--s3) var(--s3) var(--s4);
  background:none; border:0; text-align:left; color:inherit; font:inherit;
  border-block-start:1px solid
    color-mix(in oklch, var(--alm-lit) calc(var(--alm-sun) * 26%), transparent);
  cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:none;
  -webkit-tap-highlight-color:transparent; overflow:hidden;
}
.alm-standing:last-child{ border-block-end:1px solid
  color-mix(in oklch, var(--alm-lit) calc(var(--alm-sun) * 26%), transparent) }
.alm-standing:focus-visible{ outline:2px solid var(--alm-soon); outline-offset:-2px }
.alm-standing[data-state="arming"],.alm-standing[data-state="seating"]{ background:var(--alm-ground-2) }

.alm-edge{ position:absolute; inset-block:0; inset-inline-start:0; width:2px; background:var(--sev) }
/* The ONE permitted glow, and it is a unit of measure rather than a finish:
   light emission on the active latch edge only, gone the moment it resolves. */
.alm-standing[data-state="arming"] .alm-edge,
.alm-standing[data-state="seating"] .alm-edge{
  box-shadow:-1px 0 14px -3px color-mix(in oklch, var(--sev) 62%, transparent);
}
.alm-rail{ position:absolute; inset-block-end:0; inset-inline:0; height:2px;
           background:var(--alm-lit); transform:scaleX(0); transform-origin:left center }
.alm-standing[data-state="seating"] .alm-rail{ animation:breath 1.25s ease-in-out infinite }
@keyframes breath{ 0%,100%{ transform:scaleX(1) } 50%{ transform:scaleX(1.015) } }

.alm-k{ font:600 var(--cap)/1 var(--alm-fig); letter-spacing:.14em; color:var(--sev) }
.alm-t{ min-width:0 }
.alm-t b{ display:block; font-weight:400; color:var(--alm-ink);
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.alm-t small{ display:block; font:400 var(--cap)/1.4 var(--alm-fig); letter-spacing:.04em;
              color:var(--alm-muted); white-space:normal }
.alm-a{ font:700 var(--fig-inst)/1 var(--alm-fig); font-variant-numeric:tabular-nums slashed-zero;
        letter-spacing:-.022em; color:var(--alm-lit); justify-self:end }
.alm-a.unk{ color:var(--alm-unknown); font-weight:400; letter-spacing:.12em }

.alm-why{ grid-column:1/-1; font:400 var(--cap)/1.5 var(--alm-fig); letter-spacing:.02em;
          color:var(--alm-short); padding-block-start:6px }

.alm-standing[data-state="refused"] .alm-edge{
  background:repeating-linear-gradient(45deg,
    var(--alm-short) 0 4px, oklch(.42 .08 45) 4px 8px);
}

/* Rows whose settle path is not built yet say so, rather than pretending. */
.alm-standing[data-settleable="0"]{ cursor:default }
.alm-standing[data-settleable="0"] .alm-a{ color:var(--alm-unknown) }

/* ── connect ──────────────────────────────────────────────────────────────── */
.panel{ background:var(--alm-ground-2); border:1px solid var(--alm-faint);
        border-inline-start:2px solid var(--alm-mark); border-radius:2px;
        padding:var(--s4); display:flex; flex-direction:column; gap:var(--s3) }
.panel h2{ margin:0; font:600 var(--fig-inst)/1.2 var(--alm-prose); color:var(--alm-lit) }
.panel p{ margin:0; color:var(--alm-muted); font-size:.9375rem }
.panel label{ display:flex; flex-direction:column; gap:var(--s1) }
.panel input{
  background:var(--alm-ground); border:1px solid var(--alm-faint); border-radius:2px;
  color:var(--alm-lit); font:400 var(--txt)/1.3 var(--alm-fig); padding:var(--s3);
}
.panel input:focus-visible{ outline:2px solid var(--alm-soon); outline-offset:1px }
.btn{ background:var(--alm-lit); color:var(--alm-ground); border:0; border-radius:2px;
      font:600 var(--cap)/1 var(--alm-fig); letter-spacing:.14em; text-transform:uppercase;
      padding:var(--s3) var(--s4); cursor:pointer }
.btn.ghost{ background:none; color:var(--alm-muted); border:1px solid var(--alm-faint) }
.btn:focus-visible{ outline:2px solid var(--alm-soon); outline-offset:2px }
.hint{ font:400 var(--cap)/1.5 var(--alm-fig); letter-spacing:.04em; color:var(--alm-muted) }
.hint.bad{ color:var(--alm-short) }

.note{ font:400 var(--cap)/1.6 var(--alm-fig); letter-spacing:.04em; color:var(--alm-muted) }
.empty{ font-family:var(--alm-prose); color:var(--alm-muted); padding:var(--s5) 0; text-align:center }

@media (prefers-reduced-motion: reduce){
  #alm-sky,#alm-dusk{ transition-duration:200ms }
  .alm-standing[data-state="seating"] .alm-rail{ animation:none }
}
</style>

<div id="alm-sky" aria-hidden="true"></div>
<div id="alm-dusk" aria-hidden="true"></div>
<div id="alm-grain" aria-hidden="true"></div>

<div class="shell">

  <header class="head">
    <h1 class="wordmark">Almanac</h1>
    <span class="cap" id="stamp">arc · step 1</span>
  </header>

  <section class="panel" id="connect" hidden>
    <h2>Connect this to the spine</h2>
    <p>Both values live only on this device.</p>
    <label><span class="cap">Backend</span><input id="cfgApi" inputmode="url" placeholder="http://127.0.0.1:8600"></label>
    <label><span class="cap">Token</span><input id="cfgTok" type="password" placeholder="ALMANAC_TOKEN"></label>
    <button class="btn" id="cfgGo">Connect</button>
    <span class="hint" id="cfgHint">Verified against the spine before it is saved.</span>
  </section>

  <main>
    <div class="cap" style="padding-bottom:var(--s3)" id="lede">
      <span id="ledeText">reading the spine</span>
    </div>
    <div id="alm-arc"></div>
    <p class="empty" id="empty" hidden></p>
    <p class="note" id="foot" hidden></p>
  </main>

</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   STATE. `source` is load-bearing: nothing may be settled while it is not
   'live'. Settling blind is how an instrument lies.
   ═══════════════════════════════════════════════════════════════════════════ */
const State = { source: "none", data: null, at: null };

/* The token is the thing you must have. The base URL is OPTIONAL: an empty string
   is a real configuration meaning "same origin as this page", which is how the
   glance view and any same-origin hosting will reach the spine. Guarding on a
   truthy API would make same-origin indistinguishable from unconfigured. */
let API = localStorage.getItem("almanac_api") || "";
let TOK = localStorage.getItem("almanac_token") || "";
const configured = () => localStorage.getItem("almanac_token") !== null && TOK !== "";

const $ = id => document.getElementById(id);
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

const money = v => v == null ? null
  : "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});

/* ── easings, resolved and VALIDATED once ──────────────────────────────────
   The Web Animations API does NOT resolve CSS custom properties: passing
   easing:'var(--ease-settle)' throws
     TypeError: 'var(--ease-settle)' is not a valid value for easing
   inside the pointerdown listener, so `armed` is never assigned, `.finished`
   never chains, seat() never runs — and the latch silently does nothing at all.
   Verified in-browser 2026-07-25; the build spec's own sample code carries this
   bug. Read the literal value instead, and prove each one animates before
   trusting it, so a browser without linear() degrades instead of dying. */
const EASE = (() => {
  const cs = getComputedStyle(document.documentElement);
  const probe = document.createElement("div");
  const read = (name, fallback) => {
    const v = (cs.getPropertyValue(name) || "").trim();
    if (!v) return fallback;
    try { probe.animate({opacity:[0,1]}, {duration:1, easing:v}).cancel(); return v; }
    catch(e){ return fallback; }
  };
  return {
    settle: read("--ease-settle", "cubic-bezier(.22,.61,.36,1)"),
    refuse: read("--ease-refuse", "cubic-bezier(.36,0,.66,-.56)"),
  };
})();

/* ── haptics ─────────────────────────────────────────────────────────────── */
const HAPTIC = { arm:[8], detent:[14], seat:[14,26,14], refuse:[12,70,12] };
const buzz = p => { try{ navigator.vibrate?.(p); }catch(e){} };

/* ── sound: two for now. bell() belongs to sundown and is not built yet. ──── */
let AC = null;
const muted = () => localStorage.getItem("almanac.mute") === "1";
function ctx(){
  if (muted()) return null;
  if (!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if (AC.state === "suspended") AC.resume().catch(()=>{});
  return AC;
}
function tone(freq, ms, gain, type){
  const c = ctx(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + ms/1000);
  o.connect(g); g.connect(c.destination);
  o.onended = () => { try{ o.disconnect(); g.disconnect(); }catch(e){} };
  o.start(); o.stop(c.currentTime + ms/1000);
}
const tine = () => tone(880, 55, 0.07, "sine");    // a latch seating, not a notification
const thud = () => tone(150, 90, 0.10, "triangle");// deliberately un-musical

addEventListener("pagehide", () => { try{ AC && AC.close(); }catch(e){} AC = null; });
document.addEventListener("visibilitychange", () => {
  if (document.hidden && AC && AC.state === "running") AC.suspend().catch(()=>{});
});

/* ── grain: 128px noise to a data URI once. Never feTurbulence as a CSS
      background — it re-rasterises on every resize. ─────────────────────── */
(function grain(){
  if ((navigator.deviceMemory || 8) < 4) return;
  const n = 128, cv = document.createElement("canvas");
  cv.width = cv.height = n;
  const g = cv.getContext("2d"), img = g.createImageData(n, n), d = img.data;
  for (let i = 0; i < d.length; i += 4){
    const v = 128 + ((Math.random() * 255 | 0) - 128) * 0.5;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  g.putImageData(img, 0, 0);
  $("alm-grain").style.backgroundImage = `url(${cv.toDataURL()})`;
})();

/* ── the spine ───────────────────────────────────────────────────────────── */
function url(path){ return (API || "") + path; }
function headers(extra){
  return Object.assign({ "Authorization": "Bearer " + TOK }, extra || {});
}

async function fetchStandings(){
  const r = await fetch(url("/api/standings"), { headers: headers(), cache: "no-store" });
  if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 160));
  return r.json();
}

/* ── the sun ─────────────────────────────────────────────────────────────── */
function dropSun(){
  const total = State.total || 1;
  const left  = document.querySelectorAll(".alm-standing").length;
  // Never reaches 0 here. Zero belongs to the book closing, which is step 2.
  const v = total ? Math.max(0.18, 0.18 + 0.82 * (left / total)) : 1;
  document.documentElement.style.setProperty("--alm-sun", v.toFixed(3));
}

/* ═══════════════════════════════════════════════════════════════════════════
   THE LATCH
   ═══════════════════════════════════════════════════════════════════════════ */
/* The latch currently under a thumb, if any. Tracked so a backgrounded tab can
   abandon it: a hidden document FREEZES its animation timeline, so an ARM that is
   mid-travel when he switches apps would never finish, `.finished` would never
   resolve, seat() would never run, and the row would sit in `arming` forever with
   a permanent will-change layer. Verified 2026-07-25: document.timeline.currentTime
   advanced 0ms across 400ms of wall clock while hidden. Aborting is correct anyway —
   a hold he stopped watching is not a hold he confirmed. */
let ACTIVE = null;
document.addEventListener("visibilitychange", () => {
  if (document.hidden && ACTIVE && ACTIVE.row.dataset.state === "arming") ACTIVE.up();
});

class Latch{
  constructor(row){
    this.row  = row;
    this.rail = row.querySelector(".alm-rail");
    this.ac   = new AbortController();
    const o = { signal: this.ac.signal };
    row.addEventListener("pointerdown", e => this.down(e), o);
    for (const t of ["pointerup","pointercancel","pointerleave"])
      row.addEventListener(t, () => this.up(), o);
    // Keyboard is the same mechanism, not a shortcut past it.
    row.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && !e.repeat){ e.preventDefault(); this.down(e); }
    }, o);
    row.addEventListener("keyup", () => this.up(), o);
  }

  down(e){
    if (this.row.dataset.state === "seating") return;
    if (State.source !== "live"){ this.say("not connected to the spine — nothing can be settled"); return; }
    if (this.row.dataset.settleable === "0"){
      this.say("this kind cannot be settled from here yet — the write path is not built");
      return;
    }
    // A hold he cannot see is not a hold he is making.
    if (document.visibilityState !== "visible") return;
    if (e.pointerId != null && this.row.setPointerCapture){
      try{ this.row.setPointerCapture(e.pointerId); }catch(err){}
    }
    // Cancel anything still filling on this rail before arming. A release animation
    // uses fill:forwards, and a stack of those silently overrides the new ARM — the
    // rail pins at scaleX(0) and the latch looks dead. One abort is invisible; four
    // are a bug report.
    try{ this.rail.getAnimations().forEach(a => a.cancel()); }catch(e){}
    this.row.dataset.state = "arming";
    this.rail.style.willChange = "transform";
    ACTIVE = this;
    buzz(HAPTIC.arm);

    const r = reduce();
    const DUR = r ? 260 : 420;
    this.t0 = performance.now();
    this.held = true;
    this.detent = setTimeout(() => buzz(HAPTIC.detent), r ? 220 : 357);   // ~85%

    // The rail is DECORATION. It draws the hold; it does not decide it.
    this.armed = this.rail.animate(
      { transform: ["scaleX(0)","scaleX(1)"] },
      { duration: DUR, easing: EASE.settle, fill: "forwards" });
    this.armed.finished.catch(() => {});          // cancellation is normal, not an error

    /* THE WALL CLOCK IS THE AUTHORITY, never animation.finished.
       A hidden document freezes its animation timeline and RESUMES it later, so a
       hold abandoned mid-travel can be resurrected minutes afterwards by an
       unrelated event — which is exactly how an unauthorised $700 write happened
       on 2026-07-25. Wall-clock time cannot be paused by a tab switch.
       At the boundary, every condition is re-checked from scratch: still held,
       still arming, still visible, and enough REAL time actually elapsed. The
       thing that decides must not be the thing that draws. */
    this.boundary = setTimeout(() => {
      const elapsed = performance.now() - this.t0;
      if (!this.held) return;                                  // released
      if (this.row.dataset.state !== "arming") return;         // aborted or already seating
      if (document.visibilityState !== "visible") return;      // he is not looking at it
      if (elapsed < DUR - 16) return;                          // one frame of tolerance
      this.seat();
    }, DUR);
  }

  up(){
    this.held = false;                                 // always, even mid-seat
    clearTimeout(this.boundary); this.boundary = null;
    if (this.row.dataset.state !== "arming") return;   // already seating: let it finish
    clearTimeout(this.detent); this.detent = null;
    if (ACTIVE === this) ACTIVE = null;
    // Read where the rail actually got to, so the release starts from there rather
    // than snapping to a guessed value, then cancel — a forwards fill left behind
    // here is what stacks up and kills the next arm.
    let at = "scaleX(0)";
    try{ at = getComputedStyle(this.rail).transform; }catch(e){}
    try{ this.armed && this.armed.cancel(); }catch(e){}
    const back = this.rail.animate(
      { transform:[at === "none" ? "scaleX(0)" : at, "scaleX(0)"] },
      { duration:180, easing:"ease-out" });          // NO fill — it ends where it began
    back.finished.then(() => { this.rail.style.transform = "scaleX(0)"; }).catch(()=>{});
    this.rail.style.willChange = "";
    this.row.dataset.state = "";
  }

  async seat(){
    clearTimeout(this.detent); this.detent = null;
    clearTimeout(this.boundary); this.boundary = null;
    if (ACTIVE === this) ACTIVE = null;
    this.row.dataset.state = "seating";                // the rail holds and breathes
    this.row.querySelector(".alm-k").textContent = "WRITING";
    const net = new AbortController();
    const kill = setTimeout(() => net.abort("timeout"), 9000);
    try{
      const d = this.row.dataset;
      const r = await fetch(url(`/api/standings/${d.btype}/${d.bid}/settle`), {
        method:"POST", signal:net.signal,
        headers: headers({ "Content-Type":"application/json",
                           "Idempotency-Key": d.key }),
        body: JSON.stringify({ cycle_key: d.cycle, at: new Date().toISOString() })
      });
      const text = await r.text();
      if (!r.ok){
        let msg = text.slice(0,200);
        try{ msg = JSON.parse(text).error || msg; }catch(e){}
        throw new Error(msg);
      }
      clearTimeout(kill);
      await this.caught(JSON.parse(text || "{}"));     // ← ONLY NOW
    }catch(err){
      clearTimeout(kill);
      this.refuse(err);
    }finally{
      this.rail.style.willChange = "";
    }
  }

  /* CAUGHT — drawn only after the write returned. */
  async caught(out){
    buzz(HAPTIC.seat); tine();
    const go = () => { this.destroy(); dropSun(); afterSettle(out); };
    try{
      if (document.startViewTransition) await document.startViewTransition(go).finished;
      else go();
    }catch(e){ /* a cancelled transition is NEVER a failed write */ }
  }

  /* REFUSED — built with more care than the success.
     The row does not move. The sun does not drop. Nothing in the world changed,
     so nothing in the light changes — that is the tell he learns to read. */
  refuse(err){
    buzz(HAPTIC.refuse); thud();
    this.row.dataset.state = "refused";
    this.row.querySelector(".alm-k").textContent = this.row.dataset.kicker;
    this.rail.animate({ transform:["scaleX(1)","scaleX(0)"] },
      { duration:520, easing: EASE.refuse, fill:"forwards" });
    const why = (err && (err.name === "AbortError" || String(err.message) === "timeout"))
      ? "no answer from the spine in 9s — nothing was written"
      : `the spine refused: ${err && err.message ? err.message : err} — nothing was written`;
    this.say(why);
  }

  say(text){
    let el = this.row.querySelector(".alm-why");
    if (!el){ el = document.createElement("span"); el.className = "alm-why"; this.row.appendChild(el); }
    el.textContent = text;
  }

  destroy(){
    this.held = false;
    this.ac.abort();                       // every listener was signal-scoped
    clearTimeout(this.detent); clearTimeout(this.boundary);
    if (ACTIVE === this) ACTIVE = null;
    this.row.remove();
  }
}

/* ── render ──────────────────────────────────────────────────────────────── */
function rowFor(s){
  const el = document.createElement("button");
  el.className = "alm-standing";
  el.type = "button";
  el.style.setProperty("--sev", s.severity === "short" ? "var(--alm-short)"
                              : s.severity === "soon"  ? "var(--alm-soon)"
                              : "var(--alm-mark)");
  const settleable = s.kind === "pay" && s.bill_type && s.bill_id;
  el.dataset.settleable = settleable ? "1" : "0";
  el.dataset.kicker = s.kicker || "";
  if (settleable){
    el.dataset.btype = s.bill_type;
    el.dataset.bid   = s.bill_id;
    el.dataset.cycle = s.cycle_key || "";
    // Minted once per row and reused on retry, so a timeout that actually
    // committed can never double-pay.
    el.dataset.key = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
  }
  const amt = s.amount == null
    ? '<span class="alm-a unk">——</span>'
    : `<span class="alm-a">${money(s.amount)}</span>`;
  el.innerHTML =
    '<span class="alm-edge"></span>' +
    `<span class="alm-k">${s.kicker || ""}</span>` +
    `<span class="alm-t"><b></b><small></small></span>` +
    amt +
    '<span class="alm-rail"></span>';
  el.querySelector(".alm-t b").textContent = s.title || "";
  el.querySelector(".alm-t small").textContent =
    settleable ? (s.sub || "") : ((s.sub ? s.sub + " · " : "") + "not settleable from here yet");
  el.setAttribute("aria-label",
    `${s.kicker} ${s.title}${s.amount != null ? ", " + money(s.amount) : ""}. ` +
    (settleable ? "Press and hold to settle." : "Not settleable here yet."));
  return el;
}

function afterSettle(out){
  const left = document.querySelectorAll(".alm-standing").length;
  $("ledeText").textContent = lede(left);
  if (!left){
    // Step 2 owns sundown. Until then this states the truth and stops.
    $("empty").hidden = false;
    $("empty").textContent = "Nothing is standing. Sundown is step 2 — not built yet.";
  }
}

function lede(n){
  return n === 1 ? "1 standing" : `${n} standing`;
}

function render(d){
  State.data = d; State.at = d.at;
  const arc = $("alm-arc");
  arc.textContent = "";
  const list = d.standings || [];
  State.total = list.length || 1;
  document.documentElement.style.setProperty("--alm-sun", "1");
  for (const s of list){ const el = rowFor(s); arc.appendChild(el); new Latch(el); }
  $("ledeText").textContent = lede(list.length);
  $("empty").hidden = list.length > 0;
  if (!list.length) $("empty").textContent = "Nothing is standing.";

  const left = d.left_this_month;
  const bits = [ left == null ? "left this month ——" : `left this month ${money(left)}` ];
  if (d.counts && d.counts.faults) bits.push(`${d.counts.faults} fault${d.counts.faults!==1?"s":""}`);
  if (d.close) bits.push(`${d.close.sub}`);
  const foot = $("foot"); foot.hidden = false; foot.textContent = bits.join("  ·  ");
}

/* ── connect ─────────────────────────────────────────────────────────────── */
function showConnect(msg){
  $("connect").hidden = false;
  $("cfgApi").value = API || "";
  if (msg){ $("cfgHint").textContent = msg; $("cfgHint").classList.add("bad"); }
}
$("cfgGo").addEventListener("click", async () => {
  const a = $("cfgApi").value.trim().replace(/\/$/, "");
  const t = $("cfgTok").value.trim();
  const hint = $("cfgHint");
  hint.classList.remove("bad"); hint.textContent = "checking…";
  try{
    const r = await fetch(a + "/api/health", { headers:{ "Authorization":"Bearer " + t } });
    if (!r.ok) throw new Error("the spine answered " + r.status);
    localStorage.setItem("almanac_api", API = a);
    localStorage.setItem("almanac_token", TOK = t);
    $("connect").hidden = true;
    boot();
  }catch(e){
    hint.classList.add("bad");
    hint.textContent = "could not reach the spine: " + (e.message || e);
  }
});

/* ── boot ────────────────────────────────────────────────────────────────── */
async function boot(){
  if (!configured()){ State.source = "none"; $("ledeText").textContent = "not connected"; return showConnect(); }
  try{
    const d = await fetchStandings();
    State.source = "live";
    render(d);
    $("stamp").innerHTML = 'arc · step 1 · <b>live</b>';
  }catch(e){
    // Never a spinner, never a fabricated zero. It says what it could not do.
    State.source = "stale";
    $("ledeText").textContent = "the spine did not answer — nothing can be settled";
    $("empty").hidden = false;
    $("empty").textContent = String(e.message || e);
    $("stamp").innerHTML = 'arc · step 1 · <b>no data</b>';
    showConnect("could not reach the spine");
  }
}
boot();
</script>
