    : o.room === "ledger" ? ledgerRoom()
    : o.room === "learn" ? learnRoom() : soulRoom();
  if(o.room === "standing"){ paintGauge(); wireFigs(); wireActs(); }
  if(o.room === "work"){ wireCards(); }
  if(o.room === "ledger"){ wireFin(); }
  if(o.room === "radio"){ wireKeyup(); markRead(); }
  if(o.room === "soul"){ R.querySelectorAll(".creed").forEach(el =>
    el.addEventListener("click", () => { const b = el.querySelector(".cb"); b.hidden = !b.hidden; })); }
}
let openW = null;

function wireActs(){

}
function wireCards(){
  document.querySelectorAll(".kc").forEach(el => {
    el.addEventListener("click", e => {
      if(e.target.closest(".closer") || e.target.closest(".kdetail")) return;
      const open = el.querySelector(".kdetail");
      if(open){ open.remove(); return; }
      const c = (State.board.cards || []).find(x => String(x.id) === el.dataset.id);
      if(!c) return;
      const d = document.createElement("div"); d.className = "kdetail";
      d.innerHTML = (c.impact ? `<div class="kimp">${esc(c.impact)}</div><br>` : "") +
        (c.detail ? md(c.detail) : `<span class="nodata">no detail on this card</span>`);
      el.appendChild(d);
    });
  });
  /* A CLOSE IS A WRITE — held, never tapped, and only his hand (qa-gate) */
  document.querySelectorAll(".closer").forEach(btn => {
    const kc = btn.closest(".kc"); let t = 0, anim = null;
    btn.addEventListener("pointerdown", e => {
      e.preventDefault(); e.stopPropagation();
      if(btn.disabled || document.visibilityState !== "visible") return;
      const r2 = btn.querySelector(".r2"), cc = btn.querySelector(".cc");
      cc.textContent = "HOLDING";
      anim = r2.animate({transform:["scaleX(0)","scaleX(1)"]},
        {duration:640, easing:"cubic-bezier(.22,.61,.36,1)", fill:"forwards"});
      const t0 = performance.now();
      t = setTimeout(async () => {
        if(performance.now() - t0 < 620) return;
        if(document.visibilityState !== "visible") return;
        btn.disabled = true; cc.textContent = "CLOSING";
        try{
          const res = await fetch(url(`/api/cards/${btn.dataset.close}/move`), {
            method:"POST", headers: hdr({"Content-Type":"application/json"}),
            body: JSON.stringify({ to:"done" })
          });
          const out = await res.json().catch(() => ({}));
          if(!res.ok) throw new Error(out.error || ("the spine answered " + res.status));
          cc.textContent = "CLOSED"; kc.classList.add("closed");
          toast("#" + btn.dataset.close + " CLOSED BY YOUR HAND");
          setTimeout(() => { btn.remove(); load(true); }, 700);
        }catch(err){
          btn.disabled = false;
          cc.textContent = "HOLD TO CLOSE";
          r2.getAnimations().forEach(a => a.cancel()); r2.style.transform = "scaleX(0)";
          toast("NOT CLOSED — " + (err.message || err));
        }
      }, 640);
    });
    ["pointerup","pointerleave","pointercancel"].forEach(ev => btn.addEventListener(ev, () => {
      clearTimeout(t); if(anim) anim.cancel();
      const cc = btn.querySelector(".cc"), r2 = btn.querySelector(".r2");
      if(cc.textContent === "HOLDING"){
        cc.textContent = "HOLD TO CLOSE"; r2.style.transform = "scaleX(0)";
        toast("released before it closed — nothing was approved");
      }
    }));
  });
}
function wireKeyup(){

  let t = 0, anim = null;
  btn.addEventListener("pointerdown", e => {

/* opening the radio IS reading it — the mark is his eyes, not a fetch */
function markRead(){

    headers: hdr({"Content-Type":"application/json"}), body:"{}" })

/* ══ THE MONEY ROOM — wiring ═══════════════════════════════════════════
   Every gesture here is a WRITE or a fetch; nothing is optimistic. A drag
   that cannot be written leaves the card exactly where it was and says why
   in the spine's own words. */
function wireFin(){
  swingGauge();
  const R = $("room");

  R.querySelectorAll("#finView button").forEach(b => b.addEventListener("click", () => {
    FIN.view = b.dataset.v; FIN.pick = null; renderRoom();
  }));
  R.querySelectorAll("#finPeriod button").forEach(b => b.addEventListener("click", () => {
    FIN.period = b.dataset.p; loadFin(); renderRoom();
  }));
  R.querySelectorAll("#holdGrp button").forEach(b => b.addEventListener("click", () => {
    FIN.group = b.dataset.g; FIN.pick = null; renderRoom();
  }));

  if(FIN.view === "hold"){ paintHold(); wireHold(); return; }
  if(FIN.view !== "floor") return;

  /* the drag: one expense line, one load box, one write */
  R.querySelectorAll(".eline[draggable]").forEach(c => {
    c.addEventListener("dragstart", ev => {
      FIN.drag = c.dataset.txn; c.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", c.dataset.txn);
    });
    c.addEventListener("dragend", () => { c.classList.remove("dragging"); FIN.drag = null; });
  });
  R.querySelectorAll(".lane").forEach(z => {
    z.addEventListener("dragover", ev => { ev.preventDefault(); z.classList.add("over"); });
    z.addEventListener("dragleave", () => z.classList.remove("over"));
    z.addEventListener("drop", async ev => {
      ev.preventDefault(); z.classList.remove("over");
      const txn = ev.dataTransfer.getData("text/plain") || FIN.drag;
      if(!txn) return;
      if(z.dataset.row === "monthly") await payMonthly(Number(txn), null, null, z);
      else await assignTxn(Number(txn), Number(z.dataset.row), z);
    });
  });
  /* click something already in a box to take it back out */
  R.querySelectorAll(".lane .drop-in[data-txn]").forEach(p =>
    p.addEventListener("click", () => assignTxn(Number(p.dataset.txn), null, p.closest(".lane"))));

  /* the monthly box asked which bill; his tap is the answer and the write */
  R.querySelectorAll(".lane.monthly .acand").forEach(b =>
    b.addEventListener("click", () => {
      if(b.classList.contains("cancel")){ FIN.ask = null; renderRoom(); return; }
      payMonthly(Number(b.dataset.txn), b.dataset.bt, b.dataset.bid, b.closest(".lane"));
    }));

  wireIntake();
}

/* A drop on MONTHLY asserts a bill was paid. Same refusal doctrine as every
   other write here — but with a third outcome the load boxes do not have: the
   spine can come back and ASK. A 409 is not a failure, it is the machine
   refusing to guess which bill this was; the box then shows the candidates and
   his tap becomes the write. Nothing is recorded until he answers. */
async function payMonthly(txn_id, bill_type, bill_id, box){
  const card = $("room").querySelector(`.eline[data-txn="${txn_id}"]`);
  card && card.classList.add("writing");
  try{
    const r = await fetch(url("/api/fin/monthly"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id, bill_type, bill_id})});
    const out = await r.json().catch(() => ({}));
    if(r.status === 409 && out.ask){
      FIN.ask = {txn: out.txn, candidates: out.candidates};
      card && card.classList.remove("writing");
      renderRoom();
      finSay(`which bill did this pay? nothing recorded yet`, "ask");
      return false;
    }
    if(!r.ok){
      card && (card.classList.remove("writing"), card.classList.add("refused"));
      box && (box.classList.add("deny"), setTimeout(() => box.classList.remove("deny"), 1400));
      finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true);
      setTimeout(() => card && card.classList.remove("refused"), 1400);
      return false;
    }
    FIN.ask = null;
    await loadFin();
    try{ State.standings = await grab("/api/standings"); }catch(_){}
    renderRoom();
    finSay(out.already
      ? `${out.name} was already recorded paid for ${out.cycle_key}`
      : `${out.name} recorded paid for ${out.cycle_key} — ${money(out.amount)}`, false);
    return true;
  }catch(e){
    card && (card.classList.remove("writing"), card.classList.add("refused"));
    finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    setTimeout(() => card && card.classList.remove("refused"), 1400);
    return false;
  }
}

async function assignTxn(txn_id, sheet_row, box){
  const card = $("room").querySelector(`.eline[data-txn="${txn_id}"]`);
  card && card.classList.add("writing");
  try{
    const r = await fetch(url("/api/fin/assign"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id, sheet_row})});
    const out = await r.json().catch(() => ({}));
    if(!r.ok){
      /* REFUSED — nothing was written. Say so in the spine's words and leave
         the card standing exactly where it was. */
      card && (card.classList.remove("writing"), card.classList.add("refused"));
      box && (box.classList.add("deny"), setTimeout(() => box.classList.remove("deny"), 1400));
      finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true);
      setTimeout(() => card && card.classList.remove("refused"), 1400);
      return false;
    }
    /* say it AFTER the re-render, or the confirmation is wiped by the very
       repaint that proves it — a write nobody saw reads as a write that did
       not happen */
    await loadFin(); renderRoom();
    finSay(sheet_row == null
      ? `${out.category} ${money(out.amount)} taken back off the load`
      : `${out.category} ${money(out.amount)} attributed to load ${out.sheet_row}`, false);
    return true;
  }catch(e){
    card && (card.classList.remove("writing"), card.classList.add("refused"));
    finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    setTimeout(() => card && card.classList.remove("refused"), 1400);
    return false;
  }
}

/* THREE states, because two was a lie. The monthly box can come back ASKING —
   nothing written, nothing refused — and stamping that "WRITTEN" put the one
   word that means a record exists on top of the sentence "nothing recorded
   yet". On a money surface that is the worst available defect. Pass "ask" for
   the question, true for a refusal, false for a real write. */
function finSay(msg, state){
  const w = $("room").querySelector(".why");
  if(!w) return;
  const tag = state === "ask" ? "ASKING" : state ? "REFUSED" : "WRITTEN";
  w.innerHTML = `<span class="tag">${tag}</span><span>${esc(msg)}</span>`;
}

/* ── the intake: same doors bik has, new mouth ─────────────────────── */
function wireIntake(){
  const csv = $("dropCsv"), shot = $("dropShot");
  if(csv){
    const pick = () => {
      const i = document.createElement("input");
      i.type = "file"; i.accept = ".csv,text/csv";
      i.onchange = () => i.files[0] && sendCsv(i.files[0]);
      i.click();
    };
    csv.addEventListener("click", pick);
    csv.addEventListener("dragover", e => { e.preventDefault(); csv.classList.add("over"); });
    csv.addEventListener("dragleave", () => csv.classList.remove("over"));
    csv.addEventListener("drop", e => {
      e.preventDefault(); csv.classList.remove("over");
      const f = e.dataTransfer.files[0]; if(f) sendCsv(f);
    });
  }
  if(shot){
    shot.addEventListener("click", () => shot.classList.add("listening"));
    shot.addEventListener("dragover", e => { e.preventDefault(); shot.classList.add("over"); });
    shot.addEventListener("dragleave", () => shot.classList.remove("over"));
    shot.addEventListener("drop", e => {
      e.preventDefault(); shot.classList.remove("over");
      const f = e.dataTransfer.files[0];
      if(f && f.type.startsWith("image/")) fileToDataUrl(f).then(sendShot);
    });
    document.addEventListener("paste", finPaste);
  }
}
function finPaste(e){
  const shot = $("dropShot"); if(!shot || FIN.view !== "floor") return;
  for(const it of (e.clipboardData || {}).items || []){
    if(it.type.startsWith("image/")){
      const f = it.getAsFile();
      if(f){ e.preventDefault(); fileToDataUrl(f).then(sendShot); }
      return;
    }
  }
}
const fileToDataUrl = f => new Promise((res,rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej;
  r.readAsDataURL(f);
});
function dropState(el, cls, msg, sub){
  el.className = "drop " + cls;
  el.querySelector(".dl").textContent = msg;
  if(sub != null) el.querySelector(".ds").textContent = sub;
}
async function sendCsv(file){
  const el = $("dropCsv");
  /* The source decides which parser runs. Guessing it would silently mangle a
     LoadPay export through the PNC reader, so it is READ from the file's own
     header rather than assumed. */
  const text = await file.text();
  const head = (text.split("\n")[0] || "").toLowerCase();
  const source = head.includes("transaction id") || /loadpay/i.test(file.name) ? "loadpay"
               : /pnc|account\s*activity/i.test(file.name) || head.includes("balance") ? "pnc" : null;
  if(!source){
    dropState(el, "bad", "cannot tell which bank this is",
      "name it LoadPay… or PNC… — the parsers are not interchangeable");
    return;
  }
  dropState(el, "busy", `importing ${source}…`, file.name);
  try{
    const r = await fetch(url("/api/fin/intake/csv"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({source, csv:text, account:source})});
    const o = await r.json().catch(() => ({}));
    if(!r.ok){ dropState(el,"bad","not imported", o.error || `the writer said ${r.status}`); return; }
    dropState(el, "ok", `${o.imported||0} in · ${o.skipped||0} already had`,
      `${o.reconciled||0} settled from pending · ${o.uncategorized||0} uncategorized`);
    await loadFin(); renderRoom();
  }catch(e){ dropState(el,"bad","nothing was imported", String(e.message||e)); }
}
async function sendShot(dataUrl){
  const el = $("dropShot");
  dropState(el, "busy", "reading the image…", "balance first, then transactions");
  try{
    /* Try it as a BALANCE first — that is the common case and it updates the
       cash line the clock reads. If the image has none, fall through to the
       transaction reader rather than telling him it failed. */
    let r = await fetch(url("/api/fin/intake/balance"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({image:dataUrl, account:"loadpay"})});
    let o = await r.json().catch(() => ({}));
    if(r.ok && (o.balance != null || o.available != null || o.updated)){
      dropState(el, "ok", "balance read", JSON.stringify(o).slice(0,90));
      await loadFin(); renderRoom(); return;
    }
    r = await fetch(url("/api/fin/intake/screenshot"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({image:dataUrl})});
    o = await r.json().catch(() => ({}));
    const txns = o.transactions || [];
    if(!r.ok || !txns.length){
      dropState(el,"bad","nothing was read", o.error || "no transactions found in that image");
      return;
    }
    const s = await fetch(url("/api/fin/intake/save-screenshot"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({transactions:txns, account:"pnc"})});
    const so = await s.json().catch(() => ({}));
    if(!s.ok){ dropState(el,"bad","read but not saved", so.error || `the writer said ${s.status}`); return; }
    dropState(el, "ok", `${so.saved||0} saved · ${so.skipped||0} already had`,
      `${txns.length} rows read from the image`);
    await loadFin(); renderRoom();
  }catch(e){ dropState(el,"bad","nothing was saved", String(e.message||e)); }
}

/* ── THE HOLD: drag to read, hold to settle ────────────────────────── */
function wireHold(){
  const cv = $("holdC"); if(!cv) return;
  const hit = ev => {
    const r = cv.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const y = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
    return (State.fin.placed||[]).find(p =>
      Math.hypot(p.cx - x, p.cy - y) <= p.R + 3);
  };
  const read = ev => {
    const p = hit(ev);
    if(p && FIN.pick !== p.s.id){ FIN.pick = p.s.id; paintHold(); showStone(p.s); }
  };
  cv.addEventListener("pointerdown", read);
  cv.addEventListener("pointermove", e => { if(e.buttons) read(e); });
}

function showStone(s){
  const w = $("holdW"); if(!w) return;
  w.querySelector(".hcard")?.remove();
  const el = document.createElement("div");
  el.className = "hcard";
  const settleable = s.settleable !== false && s.bill_type && s.state !== "settled";
  el.innerHTML = `<div class="hn">${esc(s.title)}</div>
    <div class="ha">${s.amount == null ? "——" : money(s.amount)}</div>
    <div class="hs">${esc(s.sub || "")}${s.next_due ? " · next " + esc(s.next_due) : ""}</div>
    <div class="hb">${settleable
      ? `<button class="latch" id="stoneLatch"><i></i><span>hold to record paid</span></button>`
      : `<span class="cap">this one is not settled here</span>`}
      <button class="btn" id="stoneClose">close</button></div>`;
  w.appendChild(el);
  $("stoneClose").addEventListener("click", () => { el.remove(); FIN.pick = null; paintHold(); });
  const L = $("stoneLatch");
  if(L) wireLatch(L, () => settleStone(s, el));
}

/* The lever holds under real tension for as long as the network takes, and the
   WALL CLOCK decides — never animation.finished, which a hidden document
   freezes and resumes later. That defect once fired a $1,500 write nobody
   asked for. Releasing early answers OUT LOUD that nothing was written. */
function wireLatch(btn, commit){
  const HOLD = 900;
  let t0 = 0, raf = 0, fired = false;
  const bar = btn.querySelector("i"), lab = btn.querySelector("span");
  const tick = () => {
    const p = Math.min(1, (Date.now() - t0)/HOLD);
    bar.style.width = (p*100) + "%";
    if(p >= 1 && !fired){ fired = true; lab.textContent = "writing…"; commit(); return; }
    if(!fired) raf = requestAnimationFrame(tick);
  };
  const down = e => {
    e.preventDefault();
    if(fired) return;
    t0 = Date.now(); btn.setPointerCapture?.(e.pointerId);
    lab.textContent = "keep holding";
    raf = requestAnimationFrame(tick);
  };
  const up = () => {
    cancelAnimationFrame(raf);
    if(fired) return;
    bar.style.width = "0%";
    lab.textContent = "released early — nothing was written. hold it.";
    setTimeout(() => { if(!fired) lab.textContent = "hold to record paid"; }, 1800);
  };
  btn.addEventListener("pointerdown", down);
  btn.addEventListener("pointerup", up);
  btn.addEventListener("pointercancel", up);
  btn.addEventListener("pointerleave", up);
}

async function settleStone(s, card){
  const L = $("stoneLatch"), lab = L && L.querySelector("span");
  try{
    const r = await fetch(url(`/api/standings/${s.bill_type}/${s.bill_id}/settle`), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json",
        "Idempotency-Key": s.idem_key || `${s.bill_type}:${s.bill_id}:${s.cycle_key||""}`},
      body: JSON.stringify({cycle_key: s.cycle_key})});
    const o = await r.json().catch(() => ({}));
    /* written:false + already:true is a SUCCESS, not a refusal — the write is
       idempotent by construction (UNIQUE on bill+cycle), so a second hold on
       a bill already recorded must say "already recorded", never "refused".
       Calling that a failure would teach him to distrust a correct answer. */
    if(!r.ok || (o.written === false && !o.already)){
      L && L.classList.add("bad");
      lab && (lab.textContent = (o.error || "refused — nothing was written").slice(0,80));
      return;
    }
    L && L.classList.add("done");
    lab && (lab.textContent = o.already ? "already recorded" : "recorded");
    await load(true);
    setTimeout(() => { card.remove(); FIN.pick = null; renderRoom(); }, 700);
  }catch(e){
    L && L.classList.add("bad");
    lab && (lab.textContent = "the spine did not answer — nothing was written");
  }
}

/* ── the room's own fetches ────────────────────────────────────────── */
async function loadFin(){
  const q = `?period=${FIN.period}`;
  const [sum, ld, ex, ro] = await Promise.allSettled([
    grab("/api/fin/summary"), grab("/api/fin/loads"+q),
    grab("/api/fin/expenses"+q), grab("/api/fin/rollup"+q)]);
  State.fin.summary = sum.status === "fulfilled" ? sum.value : null;
  State.fin.summaryErr = sum.status === "rejected" ? String(sum.reason.message||sum.reason) : null;
  State.fin.loads = ld.status === "fulfilled" ? ld.value : null;
  State.fin.expenses = ex.status === "fulfilled" ? ex.value : null;
  State.fin.rollup = ro.status === "fulfilled" ? ro.value : null;
  State.fin.err = [ld,ex,ro].filter(x => x.status === "rejected")
    .map(x => String(x.reason.message||x.reason))[0] || null;
  /* A mirror nobody refreshed reads as "booked ahead $0.00" on a day three
     loads were booked (2026-07-28). Ask MI to refresh, then re-read. */
  const st = State.fin.loads && State.fin.loads.mirror_stale_hours;
  if(st != null && st > 6 && !State.fin._refreshed){
    State.fin._refreshed = true;
    try{
      await fetch(url("/api/fin/loads/refresh"), {method:"POST", headers:hdr()});
      const again = await grab("/api/fin/loads"+q); State.fin.loads = again;
      const ro2 = await grab("/api/fin/rollup"+q); State.fin.rollup = ro2;
    }catch(e){}
  }
}

/* ── load ─────────────────────────────────────────────────────────── */
async function grab(path){
  const r = await fetch(url(path), { headers: hdr(), cache:"no-store" });
  if(!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0,120));
  return r.json();
}
async function load(keep){
  try{
    const [st, sd, bd] = await Promise.all([
      grab("/api/standing"), grab("/api/standings"), grab("/api/board")]);
    State.standing = st; State.standings = sd; State.board = bd; State.err = null;
    State.at = new Date();
    /* the rest are not worth failing the desk over */
    const rest = [
      ["radio","/api/messages"], ["learn","/api/learning"], ["soul","/api/doctrine"],
      ["held","/api/push/held"], ["watch","/api/watch"]
    ];
    await Promise.all(rest.map(([k,p]) =>
      grab(p).then(v => { State[k] = v; }).catch(() => {})));
    /* the money room's own reads — never allowed to fail the desk */
    await loadFin().catch(() => {});
    deriveTemp(); paintField(); stampRead();
    if(ACTIVE !== null) renderRoom();
  }catch(e){
    State.err = String(e.message || e);
    deriveTemp();
    $("cq").textContent = "The spine did not answer.";
    $("crz").textContent = State.err;
    if(!configured()) showConnect();
    else showConnect("could not reach the spine — if you are away from home, check Tailscale first");
  }
}
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && configured()) load(true);
});

/* THE DESK SITS OPEN ALL DAY, so it must re-read on its own — 2026-07-28:
   three loads were booked, the spine had them, and the desk showed yesterday's
   money for hours because it only re-read on tab focus. A surface that can go
   stale without saying so is the same failure as a number that lies. 90s is
   slow enough to be invisible and fast enough that a booked load shows up
   before he wonders. The read stamp below is the honesty half: the page always
   says WHEN it last heard from the spine. */
let REFRESH = 0;
function startRefresh(){
  clearInterval(REFRESH);
  REFRESH = setInterval(() => {
    if(document.hidden || !configured()) return;
    load(true);
  }, 30000);
}

/* THE LOAD LOG LIVES IN A SHEET, and insights.db only mirrors it when someone
   asks. Before this, the ask happened only when the MI app was opened — so a
   load booked in the sheet could be invisible to every surface for days. The
   spine proxies the ask (MI stays the sole writer). We do it on OPEN and on
   DEMAND, never on the 30s tick: that call reaches out to Google, and polling
   it would be rude to a service we do not own. */
async function pullLoadLog(){
  try{
    const r = await fetch(url("/api/fin/loads/refresh"), { method:"POST",
      headers: hdr({"Content-Type":"application/json"}), body:"{}" });
    if(!r.ok) return false;
    return true;
  }catch(e){ return false; }
}
async function refreshNow(){
  const el = $("readstamp");
  if(el){ el.textContent = "PULLING THE LOAD LOG…"; el.classList.remove("stale"); }
  const pulled = await pullLoadLog();
  await load(true);
  if(!pulled) toast("the load log did not answer — showing the local mirror");
}
addEventListener("pagehide", () => clearInterval(REFRESH));

function stampRead(){
  const el = $("readstamp"); if(!el) return;
  if(State.err){ el.textContent = "SPINE UNREACHABLE"; el.classList.add("stale"); return; }
  if(!State.at){ el.textContent = ""; return; }
  const secs = Math.round((Date.now() - State.at.getTime())/1000);
  el.classList.toggle("stale", secs > 240);
  el.textContent = "READ " + State.at.toLocaleTimeString("en-US",
    {hour:"numeric", minute:"2-digit"});
}
setInterval(stampRead, 20000);

function showConnect(msg){
  $("connect").hidden = false;
  $("cfgApi").value = API || "";
  if(msg){ $("cfgMsg").textContent = msg; $("cfgMsg").classList.add("bad"); }
}
$("cfgGo").addEventListener("click", async () => {
  const a = $("cfgApi").value.trim().replace(/\/$/,""), t = $("cfgTok").value.trim();
  const m = $("cfgMsg"); m.classList.remove("bad"); m.textContent = "checking…";
  try{
    const r = await fetch(a + "/api/health", { headers:{ Authorization:"Bearer " + t } });
    if(!r.ok) throw new Error("the spine answered " + r.status);
    localStorage.setItem("almanac_api", API = a);
    localStorage.setItem("almanac_token", TOK = t);
    $("connect").hidden = true; load(); startRefresh();
  }catch(e){ m.classList.add("bad"); m.textContent = "could not reach the spine: " + (e.message||e); }
});

let tT = 0;
function toast(m){ const el = $("toast"); el.textContent = m; el.classList.add("on");
  clearTimeout(tT); tT = setTimeout(() => el.classList.remove("on"), 2400); }

/* a notification tap answers the radio; hash-only changes count too */
function answerHash(){
  if(location.hash !== "#radio") return false;
  history.replaceState(null, "", location.pathname + location.search);
  enter(2);
  return true;
}
addEventListener("hashchange", answerHash);

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(!configured()) showConnect();
else {
  /* Open the desk → the sheet is pulled once, then the spine is read. Opening
     it IS the ask; he should never have to think about a mirror. */
  load().then(() => { answerHash(); startRefresh(); });
  pullLoadLog().then(ok => { if(ok) load(true); });
  $("readstamp").addEventListener("click", refreshNow);
}
})();
</script>
