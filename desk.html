<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080A">
<title>Almanac — the desk</title>
<link rel="icon" href="icons/icon-192.png" type="image/png">
<style>
/* ══ THE DESK ══════════════════════════════════════════════════════════
   Bryan's ruling, 2026-07-27: the orb field is the world; the rooms live
   underneath it in the same light.

   TWO AXES, NEVER CONFUSED
     HUE         = identity. Which domain you are standing in. This is how
                   depth stays navigable — a new domain is one more orb,
                   never a seventh tab.
     TEMPERATURE = state. The room is cold while the month is covered and
                   the machines answer; it goes hot when SERVED numbers earn
                   it, and the banner names the facts that turned it. Honest,
                   not grim: it cools the moment one load covers the gap.
                   Temperature is DERIVED, never a mood switch.

   THE PAGE COMPUTES NOTHING. Every figure is fetched. Needle positions and
   bar widths are drawn FROM served figures — that is rendering, not
   arithmetic, and no number is ever derived here that the spine did not say.

   A CLOSE IS A WRITE. QA cards close under a held control, never a tap, and
   only Bryan closes them (creed: qa-gate). */
:root{
  --void:#07080A; --glass:rgba(30,36,44,.86); --glass2:rgba(20,25,31,.9);
  --line:rgba(150,170,190,.15);
  --ink:#E9EDF0; --mid:#AEB8C0; --dim:#8B96A0; --etch:#5E6870;
  --amber:#FFA419; --hot:#FF3B18; --unknown:#6E6E6E;
  --key:255,164,25;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{height:100%;overflow:hidden;background:var(--void)}
body{font-family:var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;
  user-select:none;-webkit-user-select:none}

.sky{position:fixed;inset:0;z-index:0;transition:background 1s ease;
  background:radial-gradient(1100px 700px at 50% 40%, rgba(38,48,66,.55), transparent 70%),
             radial-gradient(760px 520px at 14% 76%, rgba(52,34,24,.34), transparent 70%), var(--void)}
body.hot .sky{background:radial-gradient(1200px 760px at 50% 30%, rgba(96,20,10,.55), transparent 70%),
             radial-gradient(760px 520px at 14% 78%, rgba(70,14,8,.42), transparent 70%), #0B0403}
canvas.stars{position:fixed;inset:0;z-index:0;width:100%;height:100%}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.42;
  background-image:linear-gradient(rgba(130,150,165,.05) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(130,150,165,.05) 1px,transparent 1px);
  background-size:132px 132px}
.stage{position:relative;z-index:2;width:100%;height:100vh;display:flex;flex-direction:column}

.bar{flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:16px 26px}
.wm{font:700 14px/1 var(--mono);letter-spacing:.38em}
.bar .d{font:700 10px/1 var(--mono);letter-spacing:.19em;color:var(--dim)}
.bar .hand{font:700 10px/1 var(--mono);letter-spacing:.19em;color:var(--amber)}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:9px}
.readstamp{font:700 8px/1 var(--mono);letter-spacing:.15em;color:var(--etch);
  white-space:nowrap;transition:color .4s;background:none;border:0;cursor:pointer;
  font-family:var(--mono);padding:6px 2px}
.readstamp:hover{color:var(--mid)}
.readstamp.stale{color:var(--hot)}
.readstamp:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
.pill{font:700 9px/1 var(--mono);letter-spacing:.16em;padding:8px 12px;border-radius:20px;
  border:1px solid var(--line);color:var(--dim);transition:all .6s}
.pill.on{color:var(--hot);border-color:rgba(255,59,24,.55);box-shadow:0 0 18px -5px rgba(255,59,24,.65)}
.btn{background:var(--glass);border:1px solid var(--line);border-radius:3px;color:var(--mid);
  font:700 9px/1 var(--mono);letter-spacing:.14em;padding:9px 13px;cursor:pointer;backdrop-filter:blur(8px)}
.btn:hover{color:var(--ink);border-color:rgba(var(--key),.5)}
.btn:focus-visible{outline:2px solid var(--mid);outline-offset:2px}

.field{position:relative;flex:0 0 auto;transition:height .75s cubic-bezier(.22,.61,.36,1)}
.orb{position:absolute;cursor:pointer;transform:translate(-50%,-50%);
  transition:left .75s cubic-bezier(.22,.61,.36,1), top .75s cubic-bezier(.22,.61,.36,1);
  display:flex;flex-direction:column;align-items:center;gap:7px}
.ball{position:relative;border-radius:50%;transition:width .75s cubic-bezier(.22,.61,.36,1),
  height .75s cubic-bezier(.22,.61,.36,1), box-shadow .4s, filter .3s}
.ball::after{content:"";position:absolute;left:16%;top:9%;width:44%;height:32%;border-radius:50%;
  background:linear-gradient(160deg,rgba(255,255,255,.5),transparent 70%);filter:blur(1px)}
.orb:hover .ball{filter:brightness(1.18)}
.orb .fig{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;transition:opacity .4s}
.orb .fig .n{font:700 20px/1 var(--mono);color:#fff;text-shadow:0 0 16px rgba(0,0,0,.65)}
.orb .fig .u{display:block;margin-top:3px;font:700 7px/1 var(--mono);letter-spacing:.15em;color:rgba(255,255,255,.75)}
.orb .name{font:700 10px/1 var(--mono);letter-spacing:.2em;text-shadow:0 2px 10px rgba(0,0,0,.85);
  transition:font-size .5s,color .3s}
.orb .sig{font:600 9px/1 var(--mono);letter-spacing:.1em;color:var(--dim);transition:opacity .4s;white-space:nowrap}
.orb .sig b{color:var(--amber)}
.orb .sig b.h{color:var(--hot)}
.stage.entered .orb .sig,.stage.entered .orb .fig{opacity:0;pointer-events:none}
.stage.entered .orb .name{font-size:8.5px}
.orb.active .name{color:#fff}
.orb.active .ball{box-shadow:0 0 34px -4px rgba(var(--key),.95),inset 0 -10px 24px rgba(0,0,0,.5),
  inset 0 4px 10px rgba(255,255,255,.16),0 0 0 2px rgba(var(--key),.35)}

.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:230px;height:230px;
  border-radius:50%;display:grid;place-items:center;pointer-events:none;
  transition:opacity .5s,transform .75s cubic-bezier(.22,.61,.36,1);
  background:radial-gradient(circle at 38% 32%, rgba(215,228,255,.4), rgba(118,142,205,.24) 42%,
    rgba(28,36,58,.55) 72%, rgba(10,14,24,.7));
  box-shadow:0 0 90px -10px rgba(120,150,220,.4), inset 0 0 60px rgba(190,210,255,.14)}
.core .t{font:700 11px/1 var(--mono);letter-spacing:.3em;color:rgba(232,240,255,.92);text-align:center}
.core .s{margin-top:8px;font:600 8px/1.5 var(--mono);letter-spacing:.1em;color:rgba(200,215,245,.55);text-align:center}
.stage.entered .core{opacity:0;transform:translate(-50%,-50%) scale(.5)}

.consider{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:min(620px,86%);
  background:var(--glass);border:1px solid var(--line);border-radius:9px;padding:15px 19px 14px;
  backdrop-filter:blur(11px);box-shadow:0 26px 60px -20px rgba(0,0,0,.9);
  transition:opacity .45s,transform .45s}
.stage.entered .consider{opacity:0;transform:translateX(-50%) translateY(26px);pointer-events:none}
.consider .lbl{display:inline-block;font:700 8px/1 var(--mono);letter-spacing:.19em;color:var(--amber);
  border:1px solid rgba(255,164,25,.35);border-radius:20px;padding:6px 10px}
.consider .q{margin-top:11px;font:600 17px/1.4 var(--sans);text-wrap:balance}
.consider .rz{margin-top:7px;font:400 12px/1.5 var(--sans);color:var(--dim)}
.consider .acts{margin-top:12px;display:flex;gap:8px}
.consider .btn.go{color:var(--amber);border-color:rgba(255,164,25,.4)}

.room{flex:1 1 auto;min-height:0;padding:0 22px 16px;display:flex;flex-direction:column;gap:10px;
  opacity:0;transform:translateY(22px);pointer-events:none;transition:opacity .5s .18s, transform .5s .18s}
.stage.entered .room{opacity:1;transform:none;pointer-events:auto}
.why{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:9px 14px;border-radius:4px;
  background:rgba(var(--key),.09);border-left:3px solid rgba(var(--key),.8);
  font:400 12px/1.4 var(--sans);color:var(--mid);transition:all .6s}
body.hot .why{background:rgba(255,59,24,.11);border-left-color:var(--hot)}
.why b{color:var(--ink)}
.why .tag{font:700 8px/1 var(--mono);letter-spacing:.16em;color:rgba(var(--key),1);flex:0 0 auto}
body.hot .why .tag{color:var(--hot)}

.panel{background:var(--glass2);border:1px solid var(--line);border-radius:7px;padding:12px 15px;
  backdrop-filter:blur(10px);min-width:0;display:flex;flex-direction:column;transition:border-color .6s}
body.hot .panel{border-color:rgba(255,59,24,.22)}
.cap{font:700 8px/1 var(--mono);letter-spacing:.2em;color:var(--etch);text-transform:uppercase;flex:0 0 auto}
.big{margin-top:8px;font:700 32px/1 var(--mono);color:rgba(var(--key),1);text-shadow:0 0 28px rgba(var(--key),.45)}
body.hot .big{color:var(--hot);text-shadow:0 0 30px rgba(255,59,24,.5)}
.big.unk{color:var(--unknown);font-weight:400;letter-spacing:.1em;text-shadow:none}
.sm{margin-top:5px;font:400 11px/1.4 var(--sans);color:var(--dim)}

.rgrid{flex:1 1 auto;min-height:0;display:grid;gap:10px;
  grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
.gwrap{flex:1 1 auto;min-height:190px;position:relative;margin-top:4px}
.gwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gread{position:absolute;left:0;right:0;bottom:2px;text-align:center;pointer-events:none}
.gread .n{font:700 clamp(26px,2.5vw,38px)/1 var(--mono);color:rgba(var(--key),1);
  text-shadow:0 0 26px rgba(var(--key),.45)}
body.hot .gread .n{color:var(--hot)}
.gread .u{margin-top:3px;font:700 8px/1 var(--mono);letter-spacing:.19em;color:var(--dim)}
.figs{display:flex;gap:2px;margin-top:8px;flex:0 0 auto}
.fg{flex:1;min-width:0;background:rgba(255,255,255,.03);border-radius:3px;padding:7px 8px;cursor:pointer}
.fg:hover{background:rgba(255,255,255,.06)}
.fg.on{background:rgba(var(--key),.12);box-shadow:inset 0 -2px 0 rgba(var(--key),1)}
.fg .k{font:700 7px/1 var(--mono);letter-spacing:.14em;color:var(--etch);text-transform:uppercase}
.fg .v{margin-top:4px;font:700 12px/1 var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fg.short .v{color:var(--hot)}
.wk{margin-top:8px;padding:9px 11px;background:rgba(0,0,0,.35);border-radius:4px;flex:0 0 auto}
.wk .wr{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font:400 11.5px/1.5 var(--sans);
  color:var(--dim);border-bottom:1px dotted rgba(255,255,255,.07)}
.wk .wr:last-of-type{border-bottom:0}
.wk .wr b{font:600 11.5px var(--mono);color:var(--ink)}
.wk .tot{display:flex;justify-content:space-between;gap:12px;margin-top:4px;padding-top:5px;
  border-top:3px double rgba(255,255,255,.14);font:600 11.5px var(--sans);color:var(--ink)}
.wk .tot b{font:700 11.5px var(--mono)}
.wk .prov{margin-top:6px;font:600 7.5px/1.4 var(--mono);letter-spacing:.1em;color:var(--etch);text-transform:uppercase}
.wk .flag{display:inline-block;width:28px;height:9px;background:repeating-linear-gradient(135deg,#6E6E6E 0 5px,#8A8A8A 5px 10px)}

.centre{align-items:center;justify-content:center;text-align:center}
.centre .lab{font:700 9.5px/1 var(--mono);letter-spacing:.26em;color:var(--dim)}
.centre .n{margin:8px 0 3px;font:700 clamp(56px,7vw,104px)/.9 var(--mono);letter-spacing:-.03em;
  color:var(--ink);text-shadow:0 0 60px rgba(var(--key),.4)}
body.hot .centre .n{color:var(--hot);text-shadow:0 0 70px rgba(255,59,24,.55)}
.centre .u{font:700 10px/1 var(--mono);letter-spacing:.28em;color:var(--dim)}
.centre .weeks{margin-top:13px;display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.centre .weeks i{width:14px;height:6px;border-radius:1px;background:rgba(255,255,255,.12)}
.centre .weeks i.gone{background:rgba(255,255,255,.3)}
.centre .weeks i.now{background:rgba(var(--key),1);box-shadow:0 0 10px -2px rgba(var(--key),1)}
body.hot .centre .weeks i.now{background:var(--hot);box-shadow:0 0 10px -2px var(--hot)}
.centre .sub{margin-top:13px;font:400 12.5px/1.5 var(--sans);color:var(--mid);max-width:46ch}
.rows{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;margin-top:8px}
.rw{display:flex;align-items:center;gap:9px;font:400 11px/1.3 var(--sans);color:var(--mid)}
.rw .b{flex:1;height:4px;background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden;min-width:18px}
.rw .b i{display:block;height:100%;background:var(--mid)}
.rw .b i.k{background:rgba(var(--key),1)}
body.hot .rw .b i.k{background:var(--hot)}
.rw .v{font:600 10.5px var(--mono);color:var(--ink);flex:0 0 auto}
.chip{font:700 7px/1 var(--mono);letter-spacing:.11em;padding:4px 7px;border-radius:10px;
  border:1px solid var(--line);color:var(--dim);flex:0 0 auto}
.chip.bad{color:var(--hot);border-color:rgba(255,59,24,.5)}

/* ══ THE MONEY ROOM ════════════════════════════════════════════════════
   The strip on top is FLIGHT STATUS, unchanged in meaning from the cockpit
   that earned its trust: one dominant break-even gauge, the clock beside it,
   the month's projection under it. Below the strip the room changes with the
   period toggle; the strip never does, because the nut is monthly and a
   quarterly nut is a number that does not exist.

   A CARD IS A COST THAT HAS NOT BEEN ATTRIBUTED YET. Dragging one onto a load
   is a WRITE — the same latch doctrine as every other write on this surface:
   the card stays standing until a parsed 2xx comes back, and a refusal says
   in words what was not written. Cards that cannot be dragged still SHOW,
   greyed, carrying the reason — an invisible cost is how $300 of cash went
   missing from a break-even line for a month. */
/* ONE SCROLLER, AND IT IS .finbody — not .fin (2026-07-29, third fix on the
   same wound because I never checked the DOM).

   .fin is the room's frame: the toggle bar, the strip, and the body, stacked.
   #finBody ALSO carried class="fin", so putting overflow-y:auto on .fin gave it
   to BOTH — and the inner one, holding 1,898px of floor, was handed the 76px
   the strip left over. A 76px slit reads exactly like "can't scroll", which is
   what Bryan said three times.

   So: .fin never scrolls, it only measures. .finbody is the single scroller and
   it gets every pixel the bar and the strip do not use. */
.fin{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;
  overflow:hidden}
.finbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:9px;
  overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.finbody::-webkit-scrollbar{width:6px}
.finbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.finbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:0 0 2px}
.finbar .sp{flex:1}
.seg{display:flex;gap:2px;background:rgba(0,0,0,.3);border-radius:4px;padding:2px}
.seg button{background:none;border:0;color:var(--dim);cursor:pointer;padding:6px 12px;border-radius:3px;
  font:700 8px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;transition:all .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:rgba(var(--key),.16);color:rgba(var(--key),1);
  box-shadow:inset 0 -2px 0 rgba(var(--key),1)}
body.hot .seg button.on{background:rgba(255,59,24,.16);color:var(--hot);box-shadow:inset 0 -2px 0 var(--hot)}

.strip{flex:0 0 auto;display:grid;gap:9px;
  grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,.8fr)}
@media(max-width:1050px){.strip{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  .strip .clk{grid-column:1/-1}}
@media(max-width:760px){.strip{grid-template-columns:1fr}}
.strip .gp{padding:8px 10px 4px;justify-content:center}
.hero{width:100%;height:auto;display:block;overflow:visible;max-height:250px}
/* The strip cannot shrink, so on a short screen (or at his zoom) it will take
   whatever it needs and push the floor out of sight. Cap the instrument by
   VIEWPORT HEIGHT so the work below stays on the same screen as the reading
   above it — the gauge is the headline, not the article. */
@media(max-height:900px){.hero{max-height:196px}}

/* SHORT SCREEN — or his zoom, which is the same thing in CSS pixels. Stacking
   the three panels made the strip 386px of a 510px screen: 76% of everything he
   could see, with the actual work below the fold. The reading is the headline;
   it may never crowd out the room. So on a short screen the strip becomes ONE
   compact row that scrolls sideways and is capped at 176px, and the floor is
   the next thing his eye lands on. Measured, not guessed (2026-07-29). */
@media(max-height:760px){
  /* THE STRIP STOPS BEING PINNED. At 510px tall the room is 276px, and pinning
     a 150px strip above it left an 82px slit for 1,956px of floor — which is
     what "still can't scroll" actually felt like. So on a short screen there is
     ONE scroller for the whole room: the bar stays put, the strip becomes the
     first thing you scroll past, and the floor gets the full height the moment
     you do. A headline may be scrolled away; work may not be squeezed. */
  .fin{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .fin::-webkit-scrollbar{width:6px}
  .fin::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  .finbody{flex:0 0 auto;overflow:visible}          /* never a scroller inside a scroller */
  .finbar{position:sticky;top:0;z-index:6;padding:2px 0 6px;
    background:linear-gradient(180deg,var(--void) 66%,rgba(7,8,10,0))}
  .strip{grid-template-columns:none;display:flex;gap:8px;overflow-x:auto;
    overscroll-behavior-x:contain;padding-bottom:4px;max-height:180px}
  .strip::-webkit-scrollbar{height:4px}
  .strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
  /* overflow-y:auto, never hidden — a clipped figure is a figure that lied by
     omission. The first pass hid the top and bottom of the readout, so
     "PROJECTED MONTH-END" and the day bar were simply gone. */
  .strip>.panel{flex:0 0 min(340px,80vw);max-height:176px;overflow-y:auto;
    overflow-x:hidden;padding:9px 11px}
  .strip>.panel::-webkit-scrollbar{width:0}
  .strip>.gp{flex:0 0 min(286px,68vw)}
  .hero{max-height:132px}
  /* Tightened until the readout actually FITS the cap — scrollable-but-clipped
     still reads as broken, and a figure you have to discover by scrolling a
     150px box is a figure you will not read. */
  /* Two columns, not four stacked rows. Four rows measured 168px of content in
     a 140px box; the same four in a 2x2 grid fit with room to spare, and no
     figure has to be discovered by scrolling a 150px panel. */
  .ro{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;align-content:start}
  .rbig{font-size:21px}.rmid{font-size:13px}.rsub{font-size:9.5px;line-height:1.25}
  .rl{font-size:7px}
  .rr{gap:0}
  .strip>.ro{flex:0 0 min(360px,84vw)}
  .daybar{margin-top:3px;height:4px}
  .tmin{font-size:28px}
  .strip .clk .ln{font-size:11px;padding:1px 0}
  .strip .cap{font-size:7.5px}
  /* the only thing dropped on a short screen is a caption, never a figure —
     "three lines that never sum" is editorial; cash, runway and still-out stay */
  .strip .clk .cap:last-child{display:none}
}
@media(max-height:560px){
  .strip{max-height:150px}.strip>.panel{max-height:146px}
  .hero{max-height:108px}.rbig{font-size:19px}.tmin{font-size:25px}
}
.ro{justify-content:center;gap:13px}
.rr{display:flex;flex-direction:column;gap:2px}
.rl{font:700 8px/1.3 var(--mono);letter-spacing:.19em;color:var(--etch);text-transform:uppercase}
.rbig{font:600 clamp(26px,3vw,40px)/1 var(--mono);letter-spacing:-.01em}
.rmid{font:600 clamp(15px,1.5vw,19px)/1.15 var(--mono);letter-spacing:.02em}
.rsub{font:400 11.5px/1.4 var(--mono);color:var(--mid)}
.daybar{margin-top:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.daybar i{display:block;height:100%;background:var(--mid);
  transition:width 1s cubic-bezier(.16,1,.3,1)}
.tmin{font:700 clamp(30px,4vw,52px)/.95 var(--mono);letter-spacing:-.02em;color:var(--ink)}
body.hot .tmin{color:var(--hot)}
.strip .ln{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
  font:400 11.5px/1.5 var(--sans);color:var(--dim);border-bottom:1px dotted rgba(255,255,255,.07)}
.strip .ln:last-of-type{border-bottom:0}
.strip .ln b{font:600 11.5px var(--mono);color:var(--ink)}
.strip .ln b.up{color:rgba(var(--key),1)}
.strip .ln b.dn{color:var(--hot)}
.band{margin-top:7px;height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.band i{display:block;height:100%;background:rgba(var(--key),1)}
.band i.red{background:var(--hot)}

/* The floor scrolls as one surface: the pool and the loads hold a real height
   so both lists are usable at once (the whole point of the drag), and the
   charts sit under them rather than squeezing them to a caption. */
/* not its own scroller any more — .fin owns the scroll so the floor can never
   be sealed off below an un-shrinkable strip */
.finscroll{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}

/* THE FLOOR, as Bryan drew it: expenses stand in a column on the left, the
   loads are big open boxes across the top, and you drag a line into the box
   that caused it. Summary underneath. */
.floor{flex:0 0 auto;display:grid;gap:10px;grid-template-columns:minmax(0,300px) minmax(0,1fr)}
@media(max-width:900px){.floor{grid-template-columns:1fr}}
.floor>.panel{min-height:0}
.exp{max-height:52vh;overflow-y:auto;padding-right:3px}
.exp::-webkit-scrollbar{width:0}
.eline{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;
  padding:8px 9px;border-bottom:1px dotted rgba(255,255,255,.09);cursor:grab;
  border-radius:3px;transition:background .15s,opacity .15s}
.eline:hover{background:rgba(var(--key),.08)}
.eline.dragging{opacity:.3}
.eline.locked{cursor:not-allowed;opacity:.4}
.eline.locked:hover{background:transparent}
.eline .em{font:600 12.5px/1.3 var(--sans);color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eline .ea{font:700 12.5px var(--mono);color:var(--ink)}
.eline .ed{grid-column:1;font:400 10px/1.3 var(--mono);letter-spacing:.06em;
  color:var(--etch);text-transform:uppercase}
.eline.refused{border-color:var(--hot);background:rgba(255,59,24,.12)}

.lanes{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;min-height:290px}
.lanes::-webkit-scrollbar{height:5px}
.lanes::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:3px}
.lane{flex:0 0 254px;display:flex;flex-direction:column;border:1px solid var(--line);
  border-radius:7px;background:rgba(255,255,255,.022);transition:all .18s}
.lane.over{border-color:rgba(var(--key),1);background:rgba(var(--key),.11);
  box-shadow:0 0 0 1px rgba(var(--key),.5) inset}
.lane.deny{border-color:var(--hot);background:rgba(255,59,24,.09)}
.lane .lh{padding:10px 11px 8px;border-bottom:1px solid var(--line)}
.lane .lb{font:600 13px/1.25 var(--sans);color:var(--ink)}
.lane .lr{float:right;font:700 13px var(--mono);color:var(--ink)}
.lane .lm{margin-top:3px;font:400 10px/1.4 var(--mono);letter-spacing:.05em;
  color:var(--etch);text-transform:uppercase;clear:both}
.lane .lin{flex:1 1 auto;min-height:96px;padding:7px 9px;overflow-y:auto}
.lane .lin::-webkit-scrollbar{width:0}
.lane .empty{height:100%;display:grid;place-items:center;text-align:center;
  font:400 11px/1.5 var(--sans);color:var(--etch);font-style:italic}
.lane .drop-in{display:flex;justify-content:space-between;gap:8px;padding:5px 6px;
  margin-bottom:4px;border-radius:3px;background:rgba(var(--key),.1);
  border:1px solid rgba(var(--key),.26);cursor:pointer}
.lane .drop-in:hover{background:rgba(255,59,24,.14);border-color:rgba(255,59,24,.5)}
.lane .drop-in span{font:400 11px/1.3 var(--sans);color:var(--mid);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane .drop-in b{font:700 11px var(--mono);color:var(--ink);flex:0 0 auto}
.lane .lf{padding:8px 11px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lane .lf span{font:400 10px/1.3 var(--mono);letter-spacing:.06em;color:var(--etch);
  text-transform:uppercase}
.lane .lf b{font:700 15px var(--mono);color:rgba(var(--key),1)}
.lane .lf b.dn{color:var(--hot)}

/* MONTHLY stands apart from the loads — it is the other half of the month,
   not another load. Same box, different metal. */
.lane.monthly{flex:0 0 262px;border-color:rgba(var(--key),.4);
  background:linear-gradient(180deg,rgba(var(--key),.07),rgba(255,255,255,.02))}
.lane.monthly .lb{color:rgba(var(--key),1);letter-spacing:.16em;font-weight:700;font-size:12px}
.lane.monthly.over{border-color:rgba(var(--key),1);background:rgba(var(--key),.15)}
.ask{display:flex;flex-direction:column;gap:5px}
.ask .at{font:600 11.5px/1.4 var(--sans);color:var(--ink);margin-bottom:2px}
.acand{display:grid;grid-template-columns:1fr auto;gap:1px 8px;text-align:left;
  padding:6px 8px;border-radius:4px;cursor:pointer;font:inherit;
  border:1px solid rgba(var(--key),.3);background:rgba(var(--key),.08);color:var(--ink)}
.acand:hover{background:rgba(var(--key),.2);border-color:rgba(var(--key),.8)}
.acand span{font:600 11.5px/1.3 var(--sans);color:var(--ink)}
.acand b{font:700 11.5px var(--mono);color:var(--ink)}
.acand i{grid-column:1/-1;font:400 9.5px/1.3 var(--mono);color:var(--etch);font-style:normal}
.acand.cancel{grid-template-columns:1fr;border-color:var(--line);background:transparent;
  color:var(--dim);font:400 10.5px/1.3 var(--sans)}
.eline.writing{opacity:.5}

.drop{flex:0 0 auto;border:1px dashed rgba(150,170,190,.3);border-radius:5px;padding:10px 12px;
  text-align:center;cursor:pointer;transition:all .2s;margin-bottom:8px}
.drop:hover,.drop.over{border-color:rgba(var(--key),.7);background:rgba(var(--key),.07)}
.drop.busy{opacity:.6;border-style:solid}
.drop.ok{border-color:rgba(120,200,120,.7);background:rgba(120,200,120,.08)}
.drop.bad{border-color:var(--hot);background:rgba(255,59,24,.08)}
.drop .dl{font:700 8px/1 var(--mono);letter-spacing:.16em;color:var(--mid);text-transform:uppercase}
.drop .ds{margin-top:5px;font:400 11px/1.4 var(--sans);color:var(--dim)}

.card{border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:5px;
  background:rgba(255,255,255,.03);cursor:grab;transition:all .18s;position:relative}
.card:hover{border-color:rgba(var(--key),.5);background:rgba(var(--key),.06)}
.card.dragging{opacity:.35;cursor:grabbing}
.card.locked{cursor:not-allowed;opacity:.42;background:rgba(255,255,255,.015)}
.card.locked:hover{border-color:var(--line);background:rgba(255,255,255,.015)}
.card.writing{border-color:rgba(var(--key),1);background:rgba(var(--key),.14)}
.card.refused{border-color:var(--hot);background:rgba(255,59,24,.1);animation:refuse .4s}
@keyframes refuse{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.card .ct{display:flex;justify-content:space-between;gap:9px;align-items:baseline}
.card .cm{font:600 12px/1.3 var(--sans);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ca{font:700 12px var(--mono);color:var(--ink);flex:0 0 auto}
.card .cs{margin-top:3px;font:400 10px/1.4 var(--mono);letter-spacing:.06em;color:var(--etch);
  text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .why{display:none;position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:2px;
  padding:6px 9px;border-radius:3px;background:#12161c;border:1px solid var(--line);
  font:400 10.5px/1.4 var(--sans);color:var(--dim);box-shadow:0 10px 24px rgba(0,0,0,.7)}
.card.locked:hover .why{display:block}

.chart{width:100%;display:block;overflow:visible}
.ltab{width:100%;border-collapse:collapse;font:400 11.5px/1.4 var(--sans)}
.ltab th{font:700 7.5px var(--mono);letter-spacing:.15em;color:var(--etch);text-transform:uppercase;
  text-align:right;padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.ltab th:first-child,.ltab td:first-child{text-align:left}
.ltab td{padding:6px 7px;border-bottom:1px dotted rgba(255,255,255,.07);text-align:right;
  color:var(--mid);white-space:nowrap;font-variant-numeric:tabular-nums}
.ltab td.m{font-family:var(--mono);color:var(--ink)}
.ltab td.net{font-family:var(--mono);font-weight:700;color:rgba(var(--key),1)}
.ltab td.unk{color:var(--unknown)}
.ltab tr:hover td{background:rgba(255,255,255,.03)}

/* THE HOLD — his month as stones lying in the bottom of the phone, each body
   sized to its amount. He settles it the way you unload a trailer: one piece
   at a time, by hand, until the floor is bare. */
.hold{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.holdw{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;border-radius:5px;
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.18))}
.holdw canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.waterline{position:absolute;left:0;right:0;pointer-events:none;
  border-top:1px solid rgba(255,255,255,.22)}
.waterline .wn{position:absolute;right:9px;bottom:5px;text-align:right}
.waterline .wn b{font:700 clamp(20px,2.2vw,30px)/1 var(--mono);color:var(--ink)}
.waterline .wn span{display:block;margin-top:2px;font:700 7.5px var(--mono);letter-spacing:.17em;
  color:var(--dim);text-transform:uppercase}
.holdw .clear{position:absolute;left:9px;bottom:5px;font:600 9.5px var(--mono);
  letter-spacing:.1em;color:var(--etch);text-transform:uppercase}
.stone{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.hcard{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:12px;
  width:min(420px,92%);background:#12161c;border:1px solid var(--line);border-radius:6px;
  padding:12px 14px;box-shadow:0 20px 50px rgba(0,0,0,.8)}
.hcard .hn{font:600 14px/1.3 var(--sans);color:var(--ink)}
.hcard .ha{margin-top:4px;font:700 24px/1 var(--mono);color:rgba(var(--key),1)}
.hcard .hs{margin-top:6px;font:400 11.5px/1.5 var(--sans);color:var(--dim)}
.hcard .hb{margin-top:11px;display:flex;gap:7px;align-items:center}
.latch{position:relative;flex:1;overflow:hidden;background:rgba(var(--key),.1);
  border:1px solid rgba(var(--key),.4);border-radius:4px;color:var(--ink);cursor:pointer;
  padding:10px 12px;font:700 9px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;
  touch-action:none;-webkit-user-select:none;user-select:none}
.latch i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(var(--key),.34);
  pointer-events:none}
.latch span{position:relative}
.latch.done{background:rgba(120,200,120,.16);border-color:rgba(120,200,120,.6)}
.latch.bad{background:rgba(255,59,24,.14);border-color:var(--hot)}
.hgrp{display:flex;gap:2px;background:rgba(0,0,0,.3);border-radius:4px;padding:2px;flex-wrap:wrap}
.hgrp button{background:none;border:0;color:var(--dim);cursor:pointer;padding:5px 9px;border-radius:3px;
  font:700 7.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.hgrp button.on{background:rgba(var(--key),.16);color:rgba(var(--key),1)}
.hgrp button:hover{color:var(--ink)}

.recbar{margin-top:7px;height:6px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.recbar i{display:block;height:100%;background:rgba(var(--key),1);transition:width .8s cubic-bezier(.16,1,.3,1)}
.recline{margin-top:7px;display:flex;gap:18px;flex-wrap:wrap;font:400 12px/1.5 var(--sans);color:var(--dim)}
.recline b{font:700 13px var(--mono);color:var(--ink)}
.recline b.hot{color:var(--hot)}
.held{margin-top:9px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.hchip{font:600 10px/1 var(--mono);padding:5px 8px;border-radius:10px;cursor:help;
  border:1px solid rgba(255,59,24,.35);background:rgba(255,59,24,.08);color:var(--mid)}
.hchip b{color:var(--ink);font-weight:700}
.basis{margin-top:11px;padding-top:9px;border-top:1px dotted rgba(255,255,255,.1)}
.brow{display:grid;grid-template-columns:1fr auto minmax(0,190px);gap:12px;align-items:baseline;
  padding:3px 0;font:400 12px/1.5 var(--sans);color:var(--dim)}
.brow b{font:700 14px var(--mono);color:var(--ink);text-align:right}
.brow b.key{color:rgba(var(--key),1)}
.brow b.up{color:#00E676}.brow b.dn{color:var(--hot)}
.brow i{font:400 10.5px/1.4 var(--mono);color:var(--etch);font-style:normal}
.brow.tot{margin-top:5px;padding-top:6px;border-top:3px double rgba(255,255,255,.14);color:var(--ink)}

.acts{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act{background:var(--glass2);border:1px solid var(--line);border-radius:7px;padding:11px 13px;
  display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(10px);transition:border-color .6s}
body.hot .act{border-color:rgba(255,59,24,.26)}
.act .h{display:flex;align-items:baseline;gap:9px}
.act .h .n{font:700 8px/1 var(--mono);letter-spacing:.15em;color:rgba(var(--key),1)}
body.hot .act .h .n{color:var(--hot)}
.act .h .imp{margin-left:auto;font:700 12.5px/1 var(--mono)}
.act .t{font:600 12.5px/1.35 var(--sans)}
.act .w{font:400 10.5px/1.45 var(--sans);color:var(--dim)}
.act .go{margin-top:auto;align-self:flex-start;background:none;border:1px solid var(--line);border-radius:3px;
  color:var(--mid);font:700 8px/1 var(--mono);letter-spacing:.14em;padding:7px 11px;cursor:pointer}
.act .go:hover{color:rgba(var(--key),1);border-color:rgba(var(--key),.6)}

.board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{display:flex;flex-direction:column;min-height:0}
.colhead{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;
  border-bottom:1px solid var(--line);margin-bottom:8px}
.colhead .t{font:700 8.5px/1 var(--mono);letter-spacing:.19em;color:var(--dim)}
.colhead .n{font:700 8.5px/1 var(--mono);color:var(--etch)}
.col.qa .colhead{border-bottom-color:rgba(var(--key),.9)}
.col.qa .colhead .t{color:rgba(var(--key),1)}
.cards{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:2px}
.cards::-webkit-scrollbar{width:0}
.kc{flex:0 0 auto;background:var(--glass2);border:1px solid var(--line);border-radius:5px;padding:9px 11px;
  backdrop-filter:blur(8px);cursor:pointer}
.kc .t{font:600 12px/1.32 var(--sans)}
.kc .m{display:flex;align-items:center;gap:7px;margin-top:6px;font:700 8px/1 var(--mono);
  letter-spacing:.1em;color:var(--etch)}
/* .pb, not .bar — the top bar owns .bar and its padding would swallow this */
.kc .m .pb{flex:1;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;min-width:14px}
.kc .m .pb i{display:block;height:100%;background:var(--mid)}
.kc .m .hi{color:var(--hot)}
.kc .m .bry{color:var(--amber)}
.kc.nowc{border-left:2px solid rgba(var(--key),.9)}
.kdetail{margin-top:9px;padding-top:9px;border-top:1px dotted var(--line);font:400 12.5px/1.6 var(--sans);
  color:var(--mid);cursor:auto;max-height:260px;overflow-y:auto}
.kdetail b{color:var(--ink)}
.kdetail code{font:600 11.5px var(--mono);color:var(--ink);background:rgba(0,0,0,.4);padding:1px 4px;border-radius:2px}
.kdetail ul{margin:6px 0;padding-left:18px}
.kdetail .kimp{font-style:italic;color:var(--dim)}
.closer{position:relative;margin-top:8px;height:27px;border-radius:4px;overflow:hidden;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid var(--line);width:100%;display:grid;place-items:center;
  touch-action:none}
.closer .r2{position:absolute;inset:0;background:rgba(var(--key),.5);transform:scaleX(0);transform-origin:left center}
.closer .cc{position:relative;z-index:2;font:700 8.5px/1 var(--mono);letter-spacing:.15em;color:var(--mid)}
.closer[disabled]{opacity:.45;cursor:default}
.kc.closed{opacity:.42}
.kc.closed .t{text-decoration:line-through;text-decoration-color:var(--etch)}

.chan{flex:1 1 auto;min-height:0;display:flex;flex-direction:column-reverse;gap:6px;overflow-y:auto;padding-right:3px}
.chan::-webkit-scrollbar{width:0}
.tx{display:flex;gap:12px;padding:8px 0;border-bottom:1px dotted var(--line);align-items:baseline;
  font:400 13px/1.55 var(--sans);color:var(--mid)}
.tx .st{flex:0 0 84px;font:600 9px/1.6 var(--mono);letter-spacing:.07em;color:var(--etch)}
.tx .vo{flex:0 0 30px;font:700 9px/1.6 var(--mono);letter-spacing:.13em}
.tx.op .vo{color:rgba(var(--key),1)}
.tx.bry{color:var(--ink)} .tx.bry .vo{color:var(--dim)}
.tx .mk{color:rgba(var(--key),1);font-weight:700}
.tx.held{opacity:.55;font-style:italic}
.sqline{flex:0 0 auto;position:relative;height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin:12px 0 4px}
.sqline::after{content:"SQUELCH · " attr(data-held) " HELD BELOW";position:absolute;right:0;top:-13px;
  font:700 7.5px/1 var(--mono);letter-spacing:.16em;color:var(--etch)}
.keyup{flex:0 0 auto;display:flex;gap:9px;margin-top:10px}
.keyup input{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:4px;color:var(--ink);
  font:400 13px/1.3 var(--sans);padding:11px 13px;user-select:text;-webkit-user-select:text}
.keyup input:focus-visible{outline:2px solid rgba(var(--key),.6);outline-offset:1px}
.hold{flex:0 0 auto;padding:0 22px;border-radius:4px;border:1px solid rgba(var(--key),.5);
  background:rgba(var(--key),.14);color:rgba(var(--key),1);font:700 9.5px/1 var(--mono);letter-spacing:.16em;
  cursor:pointer;position:relative;overflow:hidden;touch-action:none}
.hold .r3{position:absolute;inset:0;background:rgba(var(--key),.35);transform:scaleX(0);transform-origin:left}
.hold[disabled]{opacity:.45;cursor:default}

.lrow{padding:11px 0;border-bottom:1px dotted var(--line);display:grid;grid-template-columns:1fr auto;gap:3px 18px}
.lrow .t{font:600 13.5px/1.35 var(--sans);color:var(--ink)}
.lrow .s{grid-column:1;font:400 12px/1.5 var(--sans);color:var(--dim)}
.lrow .a{grid-row:1/span 2;align-self:center;font:600 14px var(--mono);color:var(--ink);text-align:right}
.lrow.short .t{color:var(--hot)}
.lrow.dim{opacity:.5}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-right:4px}
.scroll::-webkit-scrollbar{width:0}
.creed{padding:10px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.creed .ct{font:600 14px/1.4 var(--sans);display:flex;gap:12px;align-items:baseline}
.creed .ct .cf{margin-left:auto;font:700 8px/1 var(--mono);letter-spacing:.13em;color:var(--dim)}
.creed .ct .cf.yes{color:rgba(var(--key),1)}
.creed .cb{margin-top:8px;font:400 13.5px/1.7 var(--sans);color:var(--mid);white-space:pre-wrap}
.gen{flex:1;display:grid;place-items:center;color:var(--dim);font:400 14px/1.6 var(--sans);text-align:center}
.nodata{color:var(--dim);font-style:italic}
.hotline{color:var(--hot);font:400 12.5px/1.6 var(--mono)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;
  background:rgba(16,20,24,.96);border:1px solid var(--line);border-radius:4px;padding:9px 15px;
  font:600 10px/1 var(--mono);letter-spacing:.12em;color:rgba(var(--key),1);opacity:0;
  transition:opacity .25s;pointer-events:none;backdrop-filter:blur(8px);max-width:80vw;text-align:center}
.toast.on{opacity:1}
.panelbox{position:fixed;inset:0;background:rgba(5,7,10,.9);z-index:30;display:flex;align-items:center;
  justify-content:center;padding:24px;backdrop-filter:blur(6px)}
.panelbox .in{background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:24px;
  width:min(440px,100%);display:flex;flex-direction:column;gap:13px}
.panelbox h2{font:600 19px/1.2 var(--sans)}
.panelbox p{color:var(--dim);font-size:13.5px}
.panelbox label{display:flex;flex-direction:column;gap:5px;font:700 9px/1 var(--mono);letter-spacing:.16em;
  color:var(--dim);text-transform:uppercase}
.panelbox input{background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:4px;color:var(--ink);
  font:400 14px/1.3 var(--mono);padding:11px;user-select:text;-webkit-user-select:text}
.panelbox .msg{font:400 11.5px/1.5 var(--mono);color:var(--dim)}
.panelbox .msg.bad{color:var(--hot)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="sky"></div>
<canvas class="stars" id="stars"></canvas>
<div class="grid"></div>

<div class="stage" id="stage">
  <div class="bar">
    <span class="wm">ALMANAC</span>
    <span class="d" id="dateline"></span>

  <div class="field" id="field">

      <div class="s">one service &middot; one database<br>everything above is served</div></div></div>

</div>

  <div class="in">
    <h2>Connect</h2>
    <p>Both values stay on this device.</p>
    <label>backend<input id="cfgApi" inputmode="url" placeholder="https://&#8230;"></label>
    <label>token<input id="cfgTok" type="password" placeholder="ALMANAC_TOKEN"></label>
    <button class="btn" id="cfgGo" style="padding:13px">CONNECT</button>
    <span class="msg" id="cfgMsg">Checked against the spine before it is saved.</span>
  </div>
</div>

<script>
"use strict";
(() => {
const $ = id => document.getElementById(id);
const stage = $("stage");

/* ── config: same keys, same origin, same credentials as the plate ── */
let API = localStorage.getItem("almanac_api") || "";
let TOK = localStorage.getItem("almanac_token") || "";
(function bootstrap(){
  const h = location.hash || "";
  if(h === "#reset" || h === "#nuke"){
    (async () => {
      try{
        const regs = await (navigator.serviceWorker?.getRegistrations?.() ?? []);
        await Promise.all(regs.map(r => r.unregister()));
        const ks = await (caches?.keys?.() ?? []);
        await Promise.all(ks.map(k => caches.delete(k)));
      }catch(e){}
      if(h === "#nuke"){ localStorage.removeItem("almanac_api"); localStorage.removeItem("almanac_token"); }
      location.replace(location.pathname + location.search);
    })();
    return;
  }
  const m = h.match(/[#&]cfg=([^&]+)/);
  if(m){
    try{
      const cfg = JSON.parse(decodeURIComponent(m[1]));
      if(cfg.api)   localStorage.setItem("almanac_api",   API = cfg.api.replace(/\/$/, ""));
      if(cfg.token) localStorage.setItem("almanac_token", TOK = cfg.token);
      history.replaceState(null, "", location.pathname + location.search);
    }catch(e){}
  }
})();
const configured = () => localStorage.getItem("almanac_token") !== null && TOK !== "";
const url = p => (API || "") + p;
const hdr = x => Object.assign({ Authorization: "Bearer " + TOK }, x || {});
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const money = v => v == null ? null :
  "$" + Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const short = v => v == null ? "——" :
  "$" + Math.round(Number(v)).toLocaleString("en-US");

const State = { standing:null, standings:null, board:null, radio:null, learn:null,
                soul:null, held:null, watch:null, at:null, err:null,
                fin:{ summary:null, loads:null, expenses:null, rollup:null,
                      summaryErr:null, err:null, stones:[], placed:[] } };
let ACTIVE = null, HOT = false;

$("toPlate").addEventListener("click", () => {
  localStorage.setItem("almanac_view", "detent");
  location.href = "detent.html";
});

/* dust */
(function(){
  const cv = $("stars"); cv.width = innerWidth; cv.height = innerHeight;
  const g = cv.getContext("2d"); let s = 7;
  const rnd = () => { s = (s*1664525 + 1013904223) >>> 0; return s/4294967296; };
  for(let i=0;i<300;i++){
    g.fillStyle = `rgba(200,218,240,${rnd()*0.45+0.05})`;
    g.beginPath(); g.arc(rnd()*cv.width, rnd()*cv.height, rnd()*1.2+0.25, 0, 7); g.fill();
  }
})();
$("dateline").textContent = new Date().toLocaleDateString("en-US",
  { weekday:"long", month:"long", day:"numeric", year:"numeric" }).toUpperCase();

/* ── the domains. hue = identity. ─────────────────────────────────── */
const D = [
  {k:"HOTSHOT", hue:"255,110,50",  fx:19, fy:36, r:118, room:"standing"},
  {k:"THE WORK",hue:"70,190,200",  fx:80, fy:30, r:102, room:"work"},
  {k:"RADIO",   hue:"255,164,25",  fx:50, fy:16, r:80,  room:"radio"},
  {k:"MONEY",   hue:"190,160,60",  fx:85, fy:60, r:90,  room:"ledger"},
  {k:"LEARN",   hue:"150,90,220",  fx:18, fy:68, r:84,  room:"learn"},
  {k:"SOUL",    hue:"120,200,120", fx:73, fy:80, r:72,  room:"soul"}
];
const field = $("field"), host = $("orbs");
D.forEach((o,i) => {
  const el = document.createElement("div");
  el.className = "orb"; el.dataset.i = i;
  el.innerHTML =
    `<div class="ball" style="background:radial-gradient(circle at 36% 30%,
       rgba(${o.hue},.96), rgba(${o.hue},.62) 46%, rgba(${o.hue},.16) 78%, rgba(6,8,12,.98));
       box-shadow:0 0 40px -8px rgba(${o.hue},.6), inset 0 -14px 26px rgba(0,0,0,.55),
       inset 0 5px 12px rgba(255,255,255,.12)">
       <div class="fig"><div><span class="n">—</span><span class="u"></span></div></div>
     </div><div class="name">${o.k}</div><div class="sig">&#8230;</div>`;
  el.addEventListener("click", () => enter(i));
  host.appendChild(el);
  o.el = el;
});
function fieldH(){ return stage.classList.contains("entered") ? 96 : Math.round(innerHeight*0.72); }
function layout(){
  const entered = stage.classList.contains("entered");
  const W = innerWidth, H = fieldH();
  field.style.height = H + "px";
  D.forEach((o,i) => {
    const r = entered ? 44 : o.r;
    const b = o.el.querySelector(".ball");
    b.style.width = r + "px"; b.style.height = r + "px";
    if(entered){
      const n = D.length, span = Math.min(W*0.62, 660), x0 = W/2 - span/2;
      o.el.style.left = (x0 + (i+0.5)*(span/n)) + "px";
      o.el.style.top  = "48px";
    } else {
      o.el.style.left = (o.fx/100*W) + "px";
      o.el.style.top  = (o.fy/100*H) + "px";
    }
  });
  if(!entered) separate();
}

/* NOTHING MAY COVER ANYTHING (2026-07-28, Bryan: "should be able to read all
   orbs"). The composition in D is hand-placed and stays hand-placed — this
   only ENFORCES what that composition assumes.

   Why it drifted: the seed positions are percentages of the viewport, the
   balls are fixed pixels, and the label under each is white-space:nowrap and
   changes LENGTH WITH THE DATA. "$199.53 TO GO" is far wider than "——", and
   "4 IN QA · 22 OPEN" grows as the board does. So a field that reads perfectly
   at one viewport with one set of numbers collides at another — the layout had
   no idea how big anything actually was.

   So: measure the real rendered box of each orb (ball + name + signal line),
   then push overlapping pairs apart along their axis of least penetration and
   clamp everyone inside the field. Deterministic, no randomness, and it settles
   in a few passes. If the field is genuinely too small to hold them all, the
   balls shrink rather than the labels colliding — unreadable is a failure,
   smaller is not. */
function separate(){
  const W = innerWidth, H = fieldH(), GAP = 14, EDGE = 6;
  const box = D.map(o => ({ w: o.el.offsetWidth, h: o.el.offsetHeight }));
  if(box.some(b => !b.w || !b.h)) return;   // not laid out yet; paintField re-runs this

  // If the footprints cannot fit the field, shrink the BALLS until they can.
  // Labels never shrink — a number you cannot read is the whole defect.
  const need = box.reduce((a,b) => a + (b.w+GAP)*(b.h+GAP), 0);
  const room = Math.max(1, W*H) * 0.62;          // packing is never perfect
  if(need > room){
    const k = Math.max(0.45, Math.sqrt(room/need));
    D.forEach(o => { const b = o.el.querySelector(".ball");
      b.style.width = b.style.height = Math.round(o.r*k) + "px"; });
    D.forEach((o,i) => { box[i] = { w: o.el.offsetWidth, h: o.el.offsetHeight }; });
  }

  /* ORBS ARE NOT THE ONLY THING ON THE FIELD. The consider card — the one
     thing the spine puts in front of him — is opaque and sits over the same
     space, and the core carries the spine's own line. Both were covering orb
     labels in the field Bryan photographed. They are obstacles here, not
     afterthoughts: an orb pushed off a label is fixed, an orb buried under a
     panel is still unreadable. */
  const fr = field.getBoundingClientRect();
  const obstacles = [];
  for(const sel of [".consider", ".core"]){
    const el = document.querySelector(sel);
    if(!el || el.hidden) continue;
    const r = el.getBoundingClientRect();
    if(!r.width || !r.height) continue;
    obstacles.push({ x: r.left - fr.left + r.width/2, y: r.top - fr.top + r.height/2,
                     w: r.width, h: r.height });
  }

  const pos = D.map(o => ({ x: parseFloat(o.el.style.left) || 0,
                            y: parseFloat(o.el.style.top)  || 0 }));
  const clamp = i => {
    pos[i].x = Math.min(W - box[i].w/2 - EDGE, Math.max(box[i].w/2 + EDGE, pos[i].x));
    pos[i].y = Math.min(H - box[i].h/2 - EDGE, Math.max(box[i].h/2 + EDGE, pos[i].y));
  };
  for(let pass = 0; pass < 200; pass++){
    let moved = false;
    for(let i = 0; i < D.length; i++){
      for(let j = i+1; j < D.length; j++){
        const dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y;
        const mw = (box[i].w + box[j].w)/2 + GAP, mh = (box[i].h + box[j].h)/2 + GAP;
        const ox = mw - Math.abs(dx), oy = mh - Math.abs(dy);
        if(ox <= 0 || oy <= 0) continue;          // already clear on one axis
        moved = true;
        if(ox < oy){ const s = (dx < 0 ? -1 : 1) * ox/2; pos[i].x -= s; pos[j].x += s; }
        else       { const s = (dy < 0 ? -1 : 1) * oy/2; pos[i].y -= s; pos[j].y += s; }
      }
      // obstacles do not move; the orb yields entirely
      for(const ob of obstacles){
        const dx = pos[i].x - ob.x, dy = pos[i].y - ob.y;
        const mw = (box[i].w + ob.w)/2 + GAP, mh = (box[i].h + ob.h)/2 + GAP;
        const ox = mw - Math.abs(dx), oy = mh - Math.abs(dy);
        if(ox <= 0 || oy <= 0) continue;
        moved = true;
        if(ox < oy) pos[i].x += (dx < 0 ? -1 : 1) * ox;
        else        pos[i].y += (dy < 0 ? -1 : 1) * oy;
      }
    }
    for(let i = 0; i < D.length; i++) clamp(i);
    if(!moved) break;
  }
  D.forEach((o,i) => { o.el.style.left = pos[i].x + "px"; o.el.style.top = pos[i].y + "px"; });
}
layout();
addEventListener("resize", () => { clearTimeout(window.__l);
  window.__l = setTimeout(() => { layout(); if(ACTIVE !== null) renderRoom(); }, 160); });

/* ── TEMPERATURE IS DERIVED, never a mood switch ──────────────────── */
function tempFacts(){
  const p = (State.standing && State.standing.judgement && State.standing.judgement.parts) || {};
  const f = [];
  if(p.uncovered != null && p.uncovered > 0)
    f.push(`uncovered <b>${money(p.uncovered)}</b>`);
  if(p.booked_ahead_total != null && p.booked_ahead_total <= 0 && p.to_go > 0)
    f.push(`booked ahead <b>$0.00</b>`);
  /* The clock only counts against him when booked work does NOT cover the gap.
     Days left is pressure only if something is still uncovered — a room that
     goes red while $1,000 is booked against $200 is crying wolf, which is the
     one thing this surface must never do. */
  const days = daysLeftInMonth();
  if(p.uncovered != null && p.uncovered > 0 && days <= 7)
    f.push(`<b>${days} day${days===1?"":"s"}</b> left`);
  const down = (State.watch && State.watch.down) || [];
  if(down.length) f.push(`<b>${down.length}</b> down on the watch (${esc(down.join(", "))})`);
  return f;
}
function daysLeftInMonth(){
  const n = new Date(), end = new Date(n.getFullYear(), n.getMonth()+1, 0);
  return Math.max(0, end.getDate() - n.getDate());
}
function deriveTemp(){
  HOT = tempFacts().length > 0;
  document.body.classList.toggle("hot", HOT);
  const pill = $("pill");
  if(State.err){ pill.textContent = "SPINE UNREACHABLE"; pill.classList.remove("on"); return; }
  pill.textContent = HOT ? "HOT · THE NUMBERS TURNED IT" : "COLD · NOTHING IS ASKING";
  pill.classList.toggle("on", HOT);
}
function whyBar(){
  const f = tempFacts();
  if(!f.length) return `<div class="why"><span class="tag">WHY THIS ROOM</span>
    <span>Nothing served is asking for your hand right now — so the room stays quiet.</span></div>`;
  return `<div class="why"><span class="tag">WHY THIS ROOM IS RED</span>
    <span>${f.length} served fact${f.length===1?"":"s"} turned it: ${f.join(", ")}.
    It goes cold when they do.</span></div>`;
}

/* ── the field's signals — every one of them served ───────────────── */
function paintField(){
  const p = (State.standing && State.standing.judgement && State.standing.judgement.parts) || {};
  const b = State.board, s = State.standings, r = State.radio, l = State.learn, d = State.soul;
  const qa = b ? b.cards.filter(c => c.column_name === "qa").length : null;
  const open = b ? b.cards.filter(c => c.column_name !== "done").length : null;
  const needs = s && s.counts ? s.counts.standing : null;
  const sig = [
    p.to_go == null ? ["——","",'<span style="color:var(--unknown)">not enough is known</span>']
      : p.to_go > 0 ? [short(p.to_go),"TO GO",`<b class="h">${money(p.to_go)}</b> TO GO`]
                    : [short(-p.to_go),"CLEAR",`<b>${money(-p.to_go)}</b> CLEAR`],
    [qa==null?"—":String(qa),"IN QA", qa==null?"spine unavailable":`<b>${qa}</b> IN QA · ${open} OPEN`],
    [r==null?"—":String(r.unread),"UNREAD", r==null?"spine unavailable":`<b>${r.unread}</b> UNREAD · CH 19`],
    [needs==null?"—":String(needs),"STANDING", needs==null?"spine unavailable":`<b>${needs}</b> NEED YOUR HAND`],
    [l==null?"—":String((l.open||[]).length),"OPEN", l==null?"spine unavailable":`<b>${(l.open||[]).length}</b> OPEN QUESTION`],
    [d==null?"—":String(d.confirmed),d==null?"":"OF "+d.total, d==null?"spine unavailable":`<b>${d.confirmed}</b>/${d.total} CONFIRMED`]
  ];
  D.forEach((o,i) => {
    o.el.querySelector(".fig .n").textContent = sig[i][0];
    o.el.querySelector(".fig .u").textContent = sig[i][1];
    o.el.querySelector(".sig").innerHTML = sig[i][2];
  });
  $("hand").textContent = needs != null && needs > 0 ? needs + " NEED YOUR HAND" : "";
  /* Consider FIRST, then settle. The signal lines just changed WIDTH
     ("$199.53 TO GO" is wider than the "…" they were seeded with, and wider
     again than "——") and the consider card just changed HEIGHT — a two-line
     question is taller than a one-line one. Settling before either is drawn
     measures the wrong field, which is exactly how the overlap Bryan caught
     got in: it read clean on first paint and collided once real numbers and a
     real question arrived. */
  paintConsider();
  if(!stage.classList.contains("entered")) separate();
}

/* the ONE thing the spine puts in front of him — chosen by a stated rule,
   never a guess, and it always says why it beat the others */
function paintConsider(){
  const p = (State.standing && State.standing.judgement && State.standing.judgement.parts) || {};
  const b = State.board, s = State.standings, l = State.learn;
  const qa = b ? b.cards.filter(c => c.column_name === "qa") : [];
  const days = daysLeftInMonth();
  let pick;
  if(p.uncovered != null && p.uncovered > 0){
    pick = { q: `${money(p.uncovered)} is not covered by anything booked — and there ${days===1?"is":"are"} ${days} day${days===1?"":"s"} left.`,
      rz: `Booked ahead is ${money(p.booked_ahead_total || 0)}. This is first because it is the only thing on the field with a deadline that cannot move.`,
      go: "OPEN THE STANDING", i: 0 };
  } else if(qa.length){
    pick = { q: `${qa.length} card${qa.length===1?"":"s"} ${qa.length===1?"is":"are"} in QA waiting for your hand.`,
      rz: `${qa.map(c => "#"+c.id).join(", ")} — shipped and verified. Nothing closes until you approve it, so they wait as long as it takes.`,
      go: "GO TO QA", i: 1 };
  } else if(s && s.counts && s.counts.standing > 0){
    pick = { q: `${s.counts.standing} obligation${s.counts.standing===1?"":"s"} need your hand.`,
      rz: `Settled one at a time on the plate — a write is held, never tapped.`, go: "OPEN THE LEDGER", i: 3 };
  } else if(l && (l.open||[]).length){
    pick = { q: l.open[0].question,
      rz: `Your open question — ${(l.open[0].options||[]).length} options waiting, none chosen.`,
      go: "OPEN THE MUSCLE", i: 4 };
  } else {
    pick = { q: "Nothing is asking for your hand.", rz: "The board is clear and the month is covered. This is what covered looks like.", go: "OPEN THE WORK", i: 1 };
  }
  $("cq").textContent = pick.q;
  $("crz").textContent = pick.rz;
  $("cgo").textContent = pick.go;
  $("cgo").onclick = () => enter(pick.i);
}

/* ── entering a domain ────────────────────────────────────────────── */
function enter(i){
  ACTIVE = i;
  document.documentElement.style.setProperty("--key", D[i].hue);
  D.forEach(x => x.el.classList.remove("active"));
  D[i].el.classList.add("active");
  stage.classList.add("entered");
  $("home").hidden = false;
  layout(); renderRoom();
}
$("home").addEventListener("click", () => {
  stage.classList.remove("entered");
  $("home").hidden = true;
  D.forEach(x => x.el.classList.remove("active"));
  document.documentElement.style.setProperty("--key","255,164,25");
  ACTIVE = null; layout(); $("room").innerHTML = "";
  history.replaceState(null, "", location.pathname + location.search);
});

/* ── THE STANDING (hotshot) ───────────────────────────────────────── */
const LAUNCH = new Date(2026, 9, 1);          /* 10/1 — the heartbeat */
function daysToLaunch(){
  const n = new Date(); n.setHours(0,0,0,0);
  return Math.max(0, Math.round((LAUNCH - n) / 86400000));
}
function standingRoom(){
  const j = State.standing && State.standing.judgement;
  const p = (j && j.parts) || {};
  const s = State.standings;
  const dl = daysToLaunch(), weeks = Math.ceil(dl/7);
  const figs = [
    ["earned","earned",p.earned], ["road","road",p.road_mtd],
    ["contribution","contribution",p.contribution], ["nut","the nut",p.nut],
    ["uncovered","uncovered",p.uncovered]
  ];
  const reading = p.to_go == null ? `<span class="big unk">——</span>`
    : p.to_go > 0 ? money(p.to_go) : money(-p.to_go);
  return whyBar() + `<div class="rgrid">
    <div class="panel" style="grid-column:1;grid-row:1">
      <div class="cap">the standing · contribution against the nut</div>
      <div class="gwrap"><canvas id="g"></canvas>
        <div class="gread"><div class="n">${p.to_go == null ? "——" : reading}</div>
          <div class="u">${p.to_go == null ? "NOT ENOUGH IS KNOWN"
            : p.to_go > 0 ? "TO GO THIS MONTH" : "CLEAR — PAST THIS IS YOURS"}</div></div></div>
      <div class="figs">` + figs.map(([k,lab,v]) =>
        `<div class="fg${k==="uncovered"&&v>0?" short":""}" data-w="${k}">
          <div class="k">${lab}</div><div class="v">${v==null?"——":money(v)}</div></div>`).join("") + `</div>
      <div class="wk" id="wk" hidden></div>
    </div>
    <div class="panel centre" style="grid-column:2;grid-row:1">
      <div class="lab">MILEAGE INSIGHTS · PUBLIC LAUNCH</div>
      <div class="n">${dl}</div><div class="u">DAYS TO 10 / 1</div>
      <div class="weeks">${Array.from({length:13},(_,i) =>
        `<i class="${i < 13-weeks ? "gone" : i === 13-weeks ? "now" : ""}"></i>`).join("")}</div>
      <div class="sub">${weeks} week${weeks===1?"":"s"} out. The date is the heartbeat — it does not move
        because the month got hard.</div>
      <div class="rows" style="width:100%;margin-top:18px">
        <div class="rw"><span style="width:78px">collected</span><span class="b"><i style="width:${
          p.earned ? Math.min(100, Math.round(100*(p.collected||0)/p.earned)) : 0}%"></i></span>
          <span class="v">${p.collected==null?"——":money(p.collected)}</span></div>
        <div class="rw"><span style="width:78px">covered</span><span class="b"><i class="k" style="width:${
          p.nut ? Math.min(100, Math.round(100*(p.contribution||0)/p.nut)) : 0}%"></i></span>
          <span class="v">${p.nut ? Math.round(100*(p.contribution||0)/p.nut)+"%" : "——"}</span></div>
        <div class="rw"><span style="width:78px">still out</span><span class="b"><i style="width:${
          p.earned ? Math.min(100, Math.round(100*(p.still_out||0)/p.earned)) : 0}%"></i></span>
          <span class="v">${p.still_out==null?"——":money(p.still_out)}</span></div>
      </div>
    </div>` + actsHTML() + `</div>`;
}
/* every action names a SERVED figure and a real destination — the machine
   proposing, never inventing */
function actsHTML(){
  const p = (State.standing && State.standing.judgement && State.standing.judgement.parts) || {};
  const b = State.board, s = State.standings;
  const qa = b ? b.cards.filter(c => c.column_name === "qa").length : 0;
  const A = [];
  if(p.uncovered > 0) A.push({n:"THE GAP",imp:money(p.uncovered),
    t:"Cover the month.", w:`Nothing is booked ahead. One load at your floor rate closes it.`, go:"THE HUNT", i:0});
  if(p.still_out > 0) A.push({n:"ALREADY EARNED",imp:money(p.still_out),
    t:"Chase what is booked and unpaid.", w:`Money you already drove for — served from the same judgement as the standing.`, go:"THE LEDGER", i:3});
  if(s && s.counts && s.counts.standing > 0) A.push({n:"YOUR HAND",imp:String(s.counts.standing),
    t:"Obligations waiting to be settled.", w:`Each one settles on the plate under a held lever — never in bulk.`, go:"THE LEDGER", i:3});
  if(qa) A.push({n:"YOUR APPROVAL",imp:String(qa),

/* the arc — drawn from served figures, synchronously (a hidden document
   never runs rAF, and a deferred first paint ships a blank instrument) */
function paintGauge(){
  const cv = $("g"); if(!cv) return;
  const p = (State.standing && State.standing.judgement && State.standing.judgement.parts) || {};
  if(p.nut == null || p.contribution == null) return;
  const r = cv.getBoundingClientRect();
  const W = Math.max(240, r.width), H = Math.max(190, r.height);
  cv.width = W*2; cv.height = H*2;
  const g = cv.getContext("2d"); g.scale(2,2);
  const NUT = p.nut, C = Math.max(0, p.contribution), MAX = NUT*1.28;
  const cx = W/2, cy = H*0.88, R = Math.min(W*0.42, H*0.78);
  const A0 = Math.PI*1.04, A1 = Math.PI*1.96;
  const ang = v => A0 + (A1-A0)*Math.min(1, Math.max(0,v)/MAX);
  const key = HOT ? "255,59,24" : (getComputedStyle(document.documentElement)
                     .getPropertyValue("--key").trim() || "255,164,25");
  const lw = Math.max(16, R*0.15);
  g.lineCap = "butt";
  g.strokeStyle = "rgba(255,255,255,.05)"; g.lineWidth = lw+8;
  g.beginPath(); g.arc(cx,cy,R,A0,A1); g.stroke();
  for(let i=0;i<=24;i++){
    const a = A0+(A1-A0)*(i/24), maj = i%4===0;
    g.strokeStyle = maj?"rgba(255,255,255,.22)":"rgba(255,255,255,.1)"; g.lineWidth = maj?1.6:1;
    g.beginPath();
    g.moveTo(cx+Math.cos(a)*(R-lw/2-2), cy+Math.sin(a)*(R-lw/2-2));
    g.lineTo(cx+Math.cos(a)*(R+lw/2+(maj?6:3)), cy+Math.sin(a)*(R+lw/2+(maj?6:3))); g.stroke();
  }
  const aC = ang(C), aN = ang(NUT);
  g.strokeStyle = `rgba(${key},.9)`; g.lineWidth = lw;
  g.shadowColor = `rgba(${key},.5)`; g.shadowBlur = 20;
  g.beginPath(); g.arc(cx,cy,R,A0,aC); g.stroke(); g.shadowBlur = 0;
  if(aC < aN){                       /* the shortfall: unlit distance, red-edged */
    g.strokeStyle = "rgba(255,59,24,.18)"; g.lineWidth = lw;
    g.beginPath(); g.arc(cx,cy,R,aC,aN); g.stroke();
    g.strokeStyle = "rgba(255,59,24,.85)"; g.lineWidth = 2;
    g.beginPath(); g.arc(cx,cy,R+lw/2-1,aC,aN); g.stroke();
    g.beginPath(); g.arc(cx,cy,R-lw/2+1,aC,aN); g.stroke();
  }
  g.strokeStyle = "#EDF0EE"; g.lineWidth = 3;
  g.beginPath();
  g.moveTo(cx+Math.cos(aN)*(R-lw/2-4), cy+Math.sin(aN)*(R-lw/2-4));
  g.lineTo(cx+Math.cos(aN)*(R+lw/2+8), cy+Math.sin(aN)*(R+lw/2+8)); g.stroke();
  /* the nut's plate, kept inside the glass — a label that runs off the edge
     reads as a broken instrument */
  const rawx = cx+Math.cos(aN)*(R+lw/2+26), ly = cy+Math.sin(aN)*(R+lw/2+26);
  const half = 42, lx = Math.max(half+2, Math.min(W-half-2, rawx));
  g.textAlign = "center";
  g.fillStyle = "#EDF0EE"; g.font = "700 10px ui-monospace,Menlo,monospace";
  g.fillText("THE NUT", lx, ly-3);
  g.fillStyle = "rgba(255,255,255,.62)"; g.font = "600 10px ui-monospace,Menlo,monospace";
  g.fillText(money(NUT), lx, ly+11);
  g.save(); g.translate(cx,cy); g.rotate(aC);
  const ng = g.createLinearGradient(0,-4,0,4);
  ng.addColorStop(0,"#F4F7F5"); ng.addColorStop(.5,"#C6CCC8"); ng.addColorStop(1,"#78807A");
  g.fillStyle = ng;
  g.beginPath(); g.moveTo(-14,-4.5); g.lineTo(R-lw/2-4,-1.4); g.lineTo(R-lw/2-4,1.4); g.lineTo(-14,4.5);
  g.closePath(); g.fill(); g.restore();
  const hub = g.createRadialGradient(cx-4,cy-5,1,cx,cy,18);
  hub.addColorStop(0,"#949B94"); hub.addColorStop(1,"#1A1E1D");
  g.fillStyle = hub; g.beginPath(); g.arc(cx,cy,15,0,7); g.fill();
  /* what the needle IS — set to the left, clear of the reading below the hub */
  g.textAlign = "left";
  g.fillStyle = "rgba(255,255,255,.3)"; g.font = "700 8px ui-monospace,Menlo,monospace";
  g.fillText("NEEDLE = CONTRIBUTION", 10, cy - 6);
  g.fillText("EARNED MINUS ROAD", 10, cy + 6);
}

const COLS = [["qa","QA · YOUR REVIEW"],["now","IN HAND"],["next","NEXT"],["later","LATER"]];
function md(t){
  const lines = esc(t).split("\n"); let out = "", ul = false;
  for(const ln of lines){
    if(/^\s*-\s+/.test(ln)){ if(!ul){ out += "<ul>"; ul = true; }
      out += "<li>" + ln.replace(/^\s*-\s+/,"") + "</li>"; }
    else { if(ul){ out += "</ul>"; ul = false; }
      out += ln.trim() === "" ? "<br>" : ln + "<br>"; }
  }
  if(ul) out += "</ul>";
  return out.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
}

const RTF = new Intl.RelativeTimeFormat("en",{numeric:"auto"});
function rel(at){
  const d = (Date.now() - new Date(at).getTime())/1000;
  if(!isFinite(d)) return "";
  if(d < 90) return "now";
  if(d < 3600) return RTF.format(-Math.round(d/60),"minute");
  if(d < 86400) return RTF.format(-Math.round(d/3600),"hour");
  return RTF.format(-Math.round(d/86400),"day");
}

/* THE ATTITUDE GAUGE, ported from the cockpit that earned its trust — not a
   reinterpretation of it. Same geometry (440×286, hub at 220/240, R=180), same
   red→yellow→green sweep, the same dashed BREAK-EVEN radial with its triangle,
   the same ghost needle for the projection behind the live one.

   THE BAND IS THE MONTH'S OWN VERDICT, never the room's temperature. The desk
   can be hot because a deadline is close while the month itself is CRUSHING;
   painting this needle red on a $2,880-over month would be the instrument
   lying to make the room consistent. */
const C = { red:"#FF4444", yellow:"#FFD600", green:"#00E676",
            chrome:"#C0C8D0", mid:"#86868b", track:"#1f1f1f" };
const bandCol = b => b === "good" ? C.green : b === "warn" ? C.yellow
                   : b === "red" ? C.red : C.chrome;
const arcPt = (cx,cy,r,t) => { const a = (180 - t*180)*Math.PI/180;
                               return [cx + r*Math.cos(a), cy - r*Math.sin(a)]; };

function heroGauge(m){
  const cx = 220, cy = 240, R = 180, nlen = 140;
  const be = m.breakeven != null ? m.breakeven : m.monthly_nut;
  const mtd = m.mtd_revenue, proj = m.projected_eom;
  if(be == null || mtd == null) return `<div class="gen" style="min-height:200px">
    <span class="nodata">not enough is known to draw the month</span></div>`;
  /* Headroom so BREAK-EVEN sits ~2/3 across rather than crammed at the edge —
     the cockpit's own scale rule, carried over unchanged. */
  const gmax = Math.max(be*1.5, (proj||0)*1.12, mtd*1.12, 1);
  const cl = (v,a,b) => Math.min(b, Math.max(a, v));
  const tBe = cl(be/gmax,0,1), tM = cl(mtd/gmax,0,1), tP = cl((proj||0)/gmax,0,1);
  const rotM = (tM-0.5)*180, rotP = (tP-0.5)*180;
  const col = bandCol(m.band);
  const n1 = arcPt(cx,cy,52,tBe), n2 = arcPt(cx,cy,R+8,tBe), nl = arcPt(cx,cy,R+34,tBe);
  const nlx = Math.max(96, Math.min(344, nl[0]));
  return `<svg class="hero" viewBox="0 0 440 286" role="img"
      aria-label="Month revenue ${money(mtd)} against break-even ${money(be)}">
    <defs><linearGradient id="dgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="${C.red}"/><stop offset="0.5" stop-color="${C.yellow}"/>
      <stop offset="1" stop-color="${C.green}"/></linearGradient></defs>
    <path d="M40 240 A180 180 0 0 1 400 240" fill="none" stroke="${C.track}"
      stroke-width="24" stroke-linecap="round"/>
    <path id="heroArc" d="M40 240 A180 180 0 0 1 400 240" fill="none" stroke="url(#dgrad)"
      stroke-width="24" stroke-linecap="round" pathLength="100" stroke-dasharray="100"
      stroke-dashoffset="100" style="transition:stroke-dashoffset 1.2s cubic-bezier(.16,1,.3,1)"/>
    <line x1="${n1[0]}" y1="${n1[1]}" x2="${n2[0]}" y2="${n2[1]}" stroke="${C.chrome}"
      stroke-width="3" stroke-dasharray="5 4"/>
    <polygon points="${n2[0]-6},${n2[1]-9} ${n2[0]+6},${n2[1]-9} ${n2[0]},${n2[1]+1}"
      fill="${C.chrome}"/>
    <text x="${nlx}" y="${nl[1]-2}" fill="${C.chrome}" font-family="var(--mono)"
      font-size="17" font-weight="700" letter-spacing="0.5" text-anchor="middle"
      >BREAK-EVEN ${money(be)}</text>
    <g id="heroGhost" transform="rotate(-90 ${cx} ${cy})"
       style="transition:transform 1.25s cubic-bezier(.16,1,.3,1)" data-rot="${rotP}">
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-nlen+14}" stroke="${C.mid}"
        stroke-width="2.5" stroke-dasharray="5 4"/></g>
    <g id="heroNeedle" transform="rotate(-90 ${cx} ${cy})"
       style="transition:transform 1.4s cubic-bezier(.16,1,.3,1)" data-rot="${rotM}">
      <polygon points="${cx-7},${cy} ${cx},${cy-nlen} ${cx+7},${cy}" fill="${col}"
        style="filter:drop-shadow(0 0 5px ${col})"/></g>
    <circle cx="${cx}" cy="${cy}" r="11" fill="${C.chrome}"/>
    <circle cx="${cx}" cy="${cy}" r="5.5" fill="${col}"/>
    <text x="${cx}" y="150" fill="${C.mid}" font-family="var(--mono)" font-size="15"
      font-weight="700" letter-spacing="2.4" text-anchor="middle"
      style="paint-order:stroke;stroke:#07080A;stroke-width:5px;stroke-linejoin:round"
      >MTD REVENUE</text>
    <text x="${cx}" y="212" fill="${col}" font-family="var(--mono)" font-size="54"
      font-weight="600" text-anchor="middle"
      style="paint-order:stroke;stroke:#07080A;stroke-width:8px;stroke-linejoin:round"
      >${money(mtd)}</text>
  </svg>`;
}

/* The needles rest pointing left and swing to their served angle the moment
   the SVG lands — the arrival IS the reading.

   NEVER BEHIND requestAnimationFrame. A hidden document freezes its animation
   frames, so an rAF-gated swing leaves the arc empty and the needle at zero
   until the tab is looked at — an instrument reading $0 on a $14,300 month
   because the phone was in a pocket. The same wall-clock-over-animation rule
   the lever lives by. A forced reflow makes the CSS transition play from the
   rest state; if the browser skips the animation entirely, the FINAL values
   are still correct, which is the part that matters. */
function swingGauge(){
  const arc = $("heroArc"), nd = $("heroNeedle"), gh = $("heroGhost");
  if(!arc) return;
  const m = (State.fin.summary || {}).the_month || {};
  const be = m.breakeven != null ? m.breakeven : m.monthly_nut;
  if(be == null || m.mtd_revenue == null) return;
  const gmax = Math.max(be*1.5, (m.projected_eom||0)*1.12, m.mtd_revenue*1.12, 1);
  const pct = Math.min(100, Math.max(0, m.mtd_revenue/gmax*100));
  void arc.getBoundingClientRect();          // seat the rest state, then move
  arc.style.strokeDashoffset = (100 - pct);
  if(nd) nd.setAttribute("transform", `rotate(${nd.dataset.rot} 220 240)`);
  if(gh) gh.setAttribute("transform", `rotate(${gh.dataset.rot} 220 240)`);
}

/* ── THE FLOOR: cards, loads, and the drag between them ────────────── */

/* THE MONTHLY BOX — Bryan, 2026-07-29: "have a box for Monthly and i will drag
   any monthly in. when i drag it in, it is paid for that month."

   It stands first among the boxes because it is the other half of the month:
   the loads say what the freight cost, this says what the BUSINESS cost — and
   until now nothing joined "what the nut says I owe" to "what actually left the
   bank." A drop is a real financial write, so it goes through the one sanctioned
   writer, and when the transaction does not name one bill beyond doubt the box
   asks instead of guessing. */
function finMonthlyBox(){
  const s = State.standings;
  const pay = s ? [...(s.standings||[]), ...(s.tape||[])].filter(x => x.kind === "pay") : [];
  const settled = pay.filter(x => x.state === "settled");
  const open = pay.filter(x => x.state !== "settled");
  const owed = open.reduce((a,x) => a + (x.amount||0), 0);
  const ask = FIN.ask;                       // a drop the spine handed back to him
  return `<div class="lane monthly" data-row="monthly">
    <div class="lh"><span class="lr">${money(settled.reduce((a,x)=>a+(x.amount||0),0))}</span>
      <div class="lb">MONTHLY</div>
      <div class="lm">the nut · ${settled.length} of ${pay.length} recorded${
        owed ? ` · ${money(owed)} still open` : ""}</div></div>
    <div class="lin">${ask ? `<div class="ask">
        <div class="at">which bill did ${esc(ask.txn.merchant || "this")} ${
          money(ask.txn.amount)} pay?</div>
        ${ask.candidates.map(c => `<button class="acand" data-txn="${ask.txn.id}"
          data-bt="${esc(c.bill_type)}" data-bid="${esc(c.bill_id)}">

          <i>${esc(c.why)}</i></button>`).join("")}

           title="${esc(x.sub || "")}"><span>${esc(x.title)}</span>
           <b>${x.amount == null ? "——" : money(x.amount)}</b></div>`).join("")

             open.length-7} more open</div>` : "")

    <div class="lf"><span>${open.length ? "still open" : "all recorded"}</span>
      <b class="${owed ? "dn" : ""}">${owed ? money(owed) : "clear"}</b></div>

/* SUMMARY — the month reconciled on real data. Every figure comes from
   finroom's reconciliation block; the page adds nothing. It also names the
   basis problem out loud: the gauge above measures ACTUAL revenue against a
   line built from a road PROJECTION. For a month you are standing in, that
   mixes bases — so the line on actually-spent road is shown BESIDE the served
   one, never in place of it. Changing the producer is Bryan's ruling. */
function finReconcile(){
  const ro = State.fin.rollup, ex = State.fin.expenses, sm = State.fin.summary;
  const R = ro && ro.reconciliation;
  if(!R) return "";
  const m = (sm && sm.the_month) || {};
  const served = m.breakeven;
  const onActual = R.break_even_actual, over = R.over_under_actual, rev = R.revenue;
  const pct = R.road_actual ? Math.round(100 * (R.attributed||0) / R.road_actual) : 0;
  const H = R.held_out || {};
  const chip = (k, v, why) => !v ? "" :
    `<span class="hchip" title="${esc(why)}">${esc(k)} <b>${money(v)}</b></span>`;
  return `<div class="panel" style="flex:0 0 auto">
    <div class="cap">summary — ${esc(FIN.period)} on real data</div>
    <div class="recbar"><i style="width:${pct}%"></i></div>
    <div class="recline">
      <span><b>${money(R.attributed||0)}</b> placed on loads</span>
      <span><b class="${R.unattributed > 0 ? "hot" : ""}">${money(R.unattributed||0)}</b> still to place</span>
      <span>of <b>${money(R.road_actual||0)}</b> road, actual</span>
    </div>
    ${(H.cash || H.personal_road || H.uncategorized) ? `<div class="held">
      <span class="cap">held out of every load — rule on these and the month closes honestly</span>
      ${chip("cash", H.cash, "what it bought on the road is unknown until you itemize it")}
      ${chip("tagged personal", H.personal_road, "road categories MI auto-tagged personal — flip its pin if that is wrong")}
      ${chip("uncategorized", H.uncategorized, "no category yet, so no lane")}
    </div>` : ""}
    ${ex && ex.blind_days ? `<div class="cap" style="margin-top:8px;color:var(--hot)">
      spend known only through ${esc(ex.txn_through)} — ${ex.blind_days} day${
      ex.blind_days===1?"":"s"} not yet imported. incomplete, not zero.</div>` : ""}
    <div class="basis">
      <div class="brow"><span>break-even as served</span><b>${served == null ? "——" : money(served)}</b>
        <i>nut + road PROJECTION</i></div>
      <div class="brow"><span>break-even on this month's actual road</span>
        <b class="key">${onActual == null ? "——" : money(onActual)}</b>
        <i>nut + ${money(R.road_actual||0)} actually spent</i></div>
      ${over != null ? `<div class="brow tot">
        <span>${esc((m.month_name||"month"))} earned ${money(rev)} — against the actual line</span>
        <b class="${over >= 0 ? "up" : "dn"}">${over >= 0 ? "+" : "−"}${
          money(Math.abs(over))}</b><i></i></div>` : ""}
    </div>
  </div>`;
}

function finCharts(){
  const ro = State.fin.rollup;

    const x = pad + i*bw, w = Math.max(3, bw*0.34);

    return `<rect x="${x.toFixed(1)}" y="${(H-22-hr).toFixed(1)}" width="${w.toFixed(1)}"

        height="${Math.max(1,hc).toFixed(1)}" rx="1.5" fill="rgba(255,59,24,${s.partial?".3":".55"})"/>

        font-family="ui-monospace,Menlo,monospace" text-anchor="middle">${esc(s.label)}</text>`;

  return `<div class="panel" style="flex:0 0 auto">

/* Stones are laid on the floor by size, largest first, packed in rows from the
   bottom — a load of stone, not a chart. Positions are DERIVED FROM SERVED
   AMOUNTS; nothing here invents a figure. */
function paintHold(){
  const cv = $("holdC"), w = $("holdW"); if(!cv || !w) return;
  const st = (State.fin.stones || []).filter(s => s.state !== "settled" && s.amount);
  const r = w.getBoundingClientRect();
  const W = Math.max(200, r.width), H = Math.max(160, r.height);
  cv.width = W*2; cv.height = H*2;
  const g = cv.getContext("2d"); g.scale(2,2);
  g.clearRect(0,0,W,H);
  const key = HOT ? "255,59,24" : (getComputedStyle(document.documentElement)
                     .getPropertyValue("--key").trim() || "255,164,25");
  const mx = Math.max(1, ...st.map(s => s.amount));
  /* SIZE IS RANK, NOT RATIO — and the code says so rather than pretending.
     Radius grows with √amount so weight reads by AREA rather than width, but
     rMin is a hard floor: a $1 subscription beside a $1,500 truck payment
     would be a 1px target, and an obligation he cannot tap is an obligation
     he cannot settle. So a small stone is BIGGER than its share. The number
     on the stone is the truth; the size is only the ordering. */
  const rMin = 13, rMax = Math.min(52, H*0.2);
  const rad = a => rMin + (rMax-rMin)*Math.sqrt(a/mx);
  const sorted = [...st].sort((a,b) => b.amount - a.amount);
  const placed = [];
  let x = 14, y = H - 16, rowH = 0;
  for(const s of sorted){
    const R = rad(s.amount);
    if(x + R*2 > W - 10){ x = 14; y -= rowH + 8; rowH = 0; }
    const cx = x + R, cy = y - R;
    placed.push({s, cx, cy, R});
    x += R*2 + 7; rowH = Math.max(rowH, R*2);
  }
  State.fin.placed = placed;
  const top = placed.length ? Math.min(...placed.map(p => p.cy - p.R)) : H - 20;
  const line = $("holdLine");
  if(line) line.style.bottom = Math.max(28, H - top + 8) + "px";
  for(const p of placed){
    const hot = p.s.severity === "short", sel = FIN.pick === p.s.id;
    const grd = g.createRadialGradient(p.cx - p.R*0.34, p.cy - p.R*0.36, p.R*0.1,
                                       p.cx, p.cy, p.R);
    if(hot){ grd.addColorStop(0,"rgba(255,120,90,.98)"); grd.addColorStop(.55,"rgba(196,39,26,.8)");
             grd.addColorStop(1,"rgba(60,12,8,.95)"); }
    else   { grd.addColorStop(0,"rgba(214,222,232,.95)"); grd.addColorStop(.55,"rgba(140,152,166,.72)");
             grd.addColorStop(1,"rgba(22,28,36,.96)"); }
    g.fillStyle = grd;
    g.beginPath(); g.arc(p.cx, p.cy, p.R, 0, 7); g.fill();
    if(sel){ g.strokeStyle = `rgba(${key},1)`; g.lineWidth = 2;
             g.beginPath(); g.arc(p.cx, p.cy, p.R+2, 0, 7); g.stroke(); }
    /* The number is the truth the size cannot carry, so it goes on every stone
       that can hold legible type — short form under 18px, and the drill-in
       card carries the rest. */
    g.fillStyle = "rgba(10,12,16,.84)";
    g.textAlign = "center"; g.textBaseline = "middle";
    if(p.R >= 22){
      g.font = "700 10px ui-monospace,Menlo,monospace";
      g.fillText(money(p.s.amount), p.cx, p.cy);
    }else if(p.R >= 16){
      g.font = "700 9px ui-monospace,Menlo,monospace";
      g.fillText(short(p.s.amount), p.cx, p.cy);
    }
  }
}

    : o.room === "work" ? workRoom()
