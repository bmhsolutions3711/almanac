/* ── THE SCALE — every price gets weighed before it gets named. ──────
   The quote lane, his kickoff word 2026-08-04: the trip goes on the deck as
   editable chips, POST /api/quote weighs it against his own books, the beam
   settles at breakeven, and his ask rides above it — the daylight between the
   two marks IS the margin, visible. The engine serves floors; the ASK is his
   hand, remembered per mode (650/400 ruled for the Albany Steel lane).
   Renders only its own body on answer — never the room (his inputs, his
   scroll). stopPropagation is law on everything that opens or edits. */
const QTRIP_KEY = "almanac_quote_trip2";
/* The shell ships GENERIC — no lane, no customer, no prices. The first real
   lane is SERVED by the authed spine (trip_default on GET /api/quote) and
   seeded once; from then on the trip is the device's own. Customer names do
   not belong in public shell source. FROM and TO are separate at his QA word
   (2026-08-04): full address when known, city and/or ZIP is enough. The
   direct book (customers) is SERVED and only grows by his hand. */
const QDEF = { customer:"", origin:"tap to set", dest:"tap to set",
  mode:"dedicated", miles_loaded:0, pos_dedicated:0, pos_partial:0,
  weight_lbs:0, tolls_trip:0, hut_dollars:0, lodging_nights:0,
  lodging_rate:0, fuel_price:0, ask_dedicated:0, ask_partial:0 };
let QT = null, QANS = null, QTMR = 0, QCUST = [];
function qTrip(){
  if(!QT){
    try{ QT = Object.assign({}, QDEF, JSON.parse(localStorage.getItem(QTRIP_KEY) || "{}")); }
    catch(e){ QT = Object.assign({}, QDEF); }
  }
  return QT;
}
async function qSeed(){
  try{
    const g = await grab("/api/quote");
    if(g && g.customers) QCUST = g.customers;
    if(!qTrip()._seeded && g && g.trip_default)
      QT = Object.assign({}, QT, g.trip_default);
  }catch(e){}
  QT._seeded = 1; qSave(); qRender(); qWeigh();
}
async function qBook(){
  try{ const g = await grab("/api/quote/customers"); if(g.customers) QCUST = g.customers; }
  catch(e){}
}
/* His ask 2026-08-04: the price researches ITSELF for the from/to regions.
   EIA weekly retail via the spine; a refusal arrives in words, once, and his
   last number stands. A later hand-edit of the chip outranks the fetch until
   the route changes again. */
async function qDiesel(){
  const t = qTrip();
  try{
    const g = await grab("/api/quote/diesel?from=" + encodeURIComponent(t.origin) +
                         "&to=" + encodeURIComponent(t.dest));
    if(g.corridor){
      QT.fuel_price = g.corridor; QT.fuel_basis = g.basis;
      qSave(); qRender(); qWeigh();
    } else {
      const why = (g.from && !g.from.ok && g.from.why) ||
                  (g.to && !g.to.ok && g.to.why) || "the price source did not answer";
      toast("diesel not fetched — " + why);
    }
  }catch(e){ toast("diesel not fetched — the spine did not answer"); }
}
function qSave(){ try{ localStorage.setItem(QTRIP_KEY, JSON.stringify(QT)); }catch(e){} }
function qAskKey(){ return qTrip().mode === "partial" ? "ask_partial" : "ask_dedicated"; }
function qPosKey(){ return qTrip().mode === "partial" ? "pos_partial" : "pos_dedicated"; }

function quoteHTML(){
  return `<div class="panel" style="grid-column:1 / -1;grid-row:3">
    <div class="cap">the scale · every price gets weighed before it gets named</div>
    <div class="qsc" id="qsc"><div class="unk">putting the load on the scale…</div></div>
  </div>`;
}

function qWeigh(){
  clearTimeout(QTMR);
  QTMR = setTimeout(async () => {
    const t = qTrip();
    const body = { mode: t.mode, miles_loaded: t.miles_loaded,
      miles_positioning: t[qPosKey()], weight_lbs: t.weight_lbs,
      tolls_trip: t.tolls_trip, hut_dollars: t.hut_dollars,
      lodging_nights: t.lodging_nights, lodging_rate: t.lodging_rate,
      fuel_price: t.fuel_price, fuel_basis: t.fuel_basis };
    try{
      const r = await fetch(url("/api/quote"), { method:"POST",
        headers: hdr({"Content-Type":"application/json"}), body: JSON.stringify(body) });
      QANS = await r.json();
    }catch(e){ QANS = { error: "the spine has not answered with the weight" }; }
    qRender();
  }, 250);
}

function qRender(){
  const box = $("qsc"); if(!box) return;
  const t = qTrip(), a = QANS;
  const ask = Number(t[qAskKey()]) || 0;
  const chips = [
    ["miles_loaded", "loaded mi", t.miles_loaded],
    [qPosKey(), t.mode === "partial" ? "extra mi" : "return mi", t[qPosKey()]],
    ["weight_lbs", "lbs", t.weight_lbs],
    ["fuel_price", "diesel $/gal", t.fuel_price],
    ["tolls_trip", "tolls $", t.tolls_trip],
    ["hut_dollars", "ny hut $", t.hut_dollars],
    ["lodging_nights", "nights", t.lodging_nights],
    ["lodging_rate", "$/night", t.lodging_rate],
  ];
  let mid;
  if(!a) mid = `<div class="unk">putting the load on the scale…</div>`;
  else if(a.error) mid = `<div class="unk">${esc(a.error)}</div>`;
  else{
    const floor = a.cash_floor.dollars, be = a.breakeven.dollars;
    const max = Math.max(ask, be, 1) * 1.12;
    const L = v => Math.min(97.5, v / max * 100);
    const E = l => l > 82 ? "r" : l < 10 ? "l" : "";
    const dayL = Math.min(L(be), L(ask)), dayW = Math.abs(L(ask) - L(be));
    const neg = ask < be, belowCash = ask < floor;
    const margin = ask - be, pct = be ? Math.round(margin / be * 100) : 0;
    const pm = t.miles_loaded ? (ask / t.miles_loaded) : null;
    const verdict = belowCash
      ? `<b>${money(margin)}</b> — BELOW CASH OUT OF POCKET`
      : neg ? `<b>${money(margin)}</b> below the month's share`
      : `<b>${money(margin)}</b> above breakeven · +${pct}%`;
    mid = `
    <div class="beamwrap"><div class="rail">
      <div class="seg cost" style="left:0;width:${L(be)}%"></div>
      <div class="seg day${neg ? " neg" : ""}" style="left:${dayL}%;width:${dayW}%"></div>
      <div class="mark" data-edge="${E(L(floor))}" style="left:${L(floor)}%"><i>cash floor</i><b>${money(floor)}</b></div>
      <div class="mark" data-edge="${E(L(be))}" style="left:${L(be)}%"><i>breakeven</i><b>${money(be)}</b></div>
      <div class="mark ask" data-edge="${E(L(ask))}" style="left:${L(ask)}%"><i>the ask</i><b>${money(ask)}</b></div>
    </div></div>
    <div class="askrow">
      <span class="lbl">THE ASK</span>
      <button class="step" data-step="-25">−</button>
      <span class="asknum" id="qAskNum">${money(ask)}</span>
      <button class="step" data-step="25">+</button>
      <span class="permile">${pm == null ? "" : money(pm) + " / loaded mi"}</span>
      <span class="verdict${neg ? " neg" : ""}">${verdict}</span>
    </div>
    ${t.mode === "partial" && a.capacity ? `<div class="capnote">rides at ${Math.round((a.share||0)*100)}% of the deck · ${esc(a.capacity)}</div>` : ""}
    <div class="fold" id="qFold">${QTICKET ? "close the ticket" : "the ticket · " + (a.cost_lines.length + 1) + " lines · open"}</div>
    ${QTICKET ? `<div class="ticket">` + a.cost_lines.map(l =>
        `<div class="tr"><span>${esc(l.line)}<div class="how">${esc(l.how)}</div></span><b>${money(l.dollars)}</b></div>`).join("") +
      `<div class="tr"><span>${esc("share of the month's nut")}<div class="how">${esc(a.nut_share.how)}</div></span><b>${money(a.nut_share.dollars)}</b></div>` +
      `<div class="basis">${esc(a.cost_basis.basis)} · window ${esc(a.cost_basis.windows[0].from)} → ${esc(a.cost_basis.windows[a.cost_basis.windows.length-1].to)}, ${a.cost_basis.miles_measured.toLocaleString()} mi measured</div></div>` : ""}`;
  }
  box.innerHTML = `
    <div class="qlane"><div class="cchips" id="qCust">` +
      QCUST.map(c => `<button class="cchip${t.customer === c.name ? " on" : ""}" data-cust="${esc(c.name)}">${esc(c.name.toUpperCase())}</button>`).join("") +
      `<button class="cchip add" id="qCustAdd" title="add a direct customer">+ NEW</button></div>
      <div class="modes">
        <button class="mchip${t.mode === "dedicated" ? " on" : ""}" data-mode="dedicated">DEDICATED</button>
        <button class="mchip${t.mode === "partial" ? " on" : ""}" data-mode="partial">PARTIAL</button>
      </div></div>
    <div class="route">
      <div class="qchip" data-k="origin" data-text="1"><span class="k">from · address or city/zip</span><span class="v">${esc(t.origin)}</span></div>
      <div class="qchip" data-k="dest" data-text="1"><span class="k">to · address or city/zip</span><span class="v">${esc(t.dest)}</span></div>
    </div>
    <div class="chips">` + chips.map(([k, lab, v]) =>
      `<div class="qchip" data-k="${k}"><span class="k">${lab}</span><span class="v">${v}</span></div>`).join("") + `</div>
    ${mid}`;
  qWire();
}
let QTICKET = false;

/* the arc — drawn from served figures, synchronously (a hidden document
   never runs rAF, and a deferred first paint ships a blank instrument) */
function paintGauge(){
  const cv = $("g"); if(!cv) return;
  const p = (State.standing && State.standing.judgement && State.standing.judgement.parts) || {};
  if(p.nut == null || p.contribution == null) return;
  const r = cv.getBoundingClientRect();
  const W = Math.max(240, r.width), H = Math.max(150, r.height);
  cv.width = W*2; cv.height = H*2;
  const g = cv.getContext("2d"); g.scale(2,2);
  const NUT = p.nut, C = Math.max(0, p.contribution), MAX = NUT*1.28;
  const cx = W/2, cy = H*0.88, R = Math.min(W*0.42, H*0.78);
  const A0 = Math.PI*1.04, A1 = Math.PI*1.96;
  const ang = v => A0 + (A1-A0)*Math.min(1, Math.max(0,v)/MAX);
  const key = HOT ? "255,59,24" : (getComputedStyle(document.documentElement)
                     .getPropertyValue("--key").trim() || "255,164,25");
  const lw = Math.max(16, R*0.15);
  g.lineCap = "butt";
  g.strokeStyle = "rgba(255,255,255,.05)"; g.lineWidth = lw+8;
  g.beginPath(); g.arc(cx,cy,R,A0,A1); g.stroke();
  for(let i=0;i<=24;i++){
    const a = A0+(A1-A0)*(i/24), maj = i%4===0;
    g.strokeStyle = maj?"rgba(255,255,255,.22)":"rgba(255,255,255,.1)"; g.lineWidth = maj?1.6:1;
    g.beginPath();
    g.moveTo(cx+Math.cos(a)*(R-lw/2-2), cy+Math.sin(a)*(R-lw/2-2));
    g.lineTo(cx+Math.cos(a)*(R+lw/2+(maj?6:3)), cy+Math.sin(a)*(R+lw/2+(maj?6:3))); g.stroke();
  }
  const aC = ang(C), aN = ang(NUT);
  g.strokeStyle = `rgba(${key},.9)`; g.lineWidth = lw;
  g.shadowColor = `rgba(${key},.5)`; g.shadowBlur = 20;
  g.beginPath(); g.arc(cx,cy,R,A0,aC); g.stroke(); g.shadowBlur = 0;
  if(aC < aN){                       /* the shortfall: unlit distance, red-edged */
    g.strokeStyle = "rgba(255,59,24,.18)"; g.lineWidth = lw;
    g.beginPath(); g.arc(cx,cy,R,aC,aN); g.stroke();
    g.strokeStyle = "rgba(255,59,24,.85)"; g.lineWidth = 2;
    g.beginPath(); g.arc(cx,cy,R+lw/2-1,aC,aN); g.stroke();
    g.beginPath(); g.arc(cx,cy,R-lw/2+1,aC,aN); g.stroke();
  }
  g.strokeStyle = "#EDF0EE"; g.lineWidth = 3;
  g.beginPath();
  g.moveTo(cx+Math.cos(aN)*(R-lw/2-4), cy+Math.sin(aN)*(R-lw/2-4));
  g.lineTo(cx+Math.cos(aN)*(R+lw/2+8), cy+Math.sin(aN)*(R+lw/2+8)); g.stroke();
  /* the nut's plate, kept inside the glass — a label that runs off the edge
     reads as a broken instrument */
  const rawx = cx+Math.cos(aN)*(R+lw/2+26), ly = cy+Math.sin(aN)*(R+lw/2+26);
  const half = 42, lx = Math.max(half+2, Math.min(W-half-2, rawx));
  g.textAlign = "center";
  g.fillStyle = "#EDF0EE"; g.font = "700 10px ui-monospace,Menlo,monospace";
  g.fillText("THE NUT", lx, ly-3);
  g.fillStyle = "rgba(255,255,255,.62)"; g.font = "600 10px ui-monospace,Menlo,monospace";
  g.fillText(money(NUT), lx, ly+11);
  g.save(); g.translate(cx,cy); g.rotate(aC);
  const ng = g.createLinearGradient(0,-4,0,4);
  ng.addColorStop(0,"#F4F7F5"); ng.addColorStop(.5,"#C6CCC8"); ng.addColorStop(1,"#78807A");
  g.fillStyle = ng;
  g.beginPath(); g.moveTo(-14,-4.5); g.lineTo(R-lw/2-4,-1.4); g.lineTo(R-lw/2-4,1.4); g.lineTo(-14,4.5);
  g.closePath(); g.fill(); g.restore();
  const hub = g.createRadialGradient(cx-4,cy-5,1,cx,cy,18);
  hub.addColorStop(0,"#949B94"); hub.addColorStop(1,"#1A1E1D");
  g.fillStyle = hub; g.beginPath(); g.arc(cx,cy,15,0,7); g.fill();
  /* what the needle IS — set to the left, clear of the reading below the hub */
  g.textAlign = "left";
  g.fillStyle = "rgba(255,255,255,.3)"; g.font = "700 8px ui-monospace,Menlo,monospace";
  g.fillText("NEEDLE = CONTRIBUTION", 10, cy - 6);
  g.fillText("EARNED MINUS ROAD", 10, cy + 6);
}

function md(t){
  const lines = esc(t).split("\n"); let out = "", ul = false;
  for(const ln of lines){
    if(/^\s*-\s+/.test(ln)){ if(!ul){ out += "<ul>"; ul = true; }
      out += "<li>" + ln.replace(/^\s*-\s+/,"") + "</li>"; }
    else { if(ul){ out += "</ul>"; ul = false; }
      out += ln.trim() === "" ? "<br>" : ln + "<br>"; }

const RTF = new Intl.RelativeTimeFormat("en",{numeric:"auto"});
function rel(at){
  const d = (Date.now() - new Date(at).getTime())/1000;
  if(!isFinite(d)) return "";
  if(d < 90) return "now";
  if(d < 3600) return RTF.format(-Math.round(d/60),"minute");
  if(d < 86400) return RTF.format(-Math.round(d/3600),"hour");
  return RTF.format(-Math.round(d/86400),"day");
}

         <button class="sno" data-no="${s.id}">NO</button>`;
  return `<div class="stoprow" data-sid="${s.id}">

/* ── the strip: FLIGHT STATUS, monthly, always ─────────────────────── */
function finStrip(){
  const s = State.fin.summary;
  if(!s) return `<div class="panel" style="flex:0 0 auto;min-height:96px">
    <div class="cap">flight status</div><div class="gen" style="min-height:60px">
    <span class="nodata">${esc(State.fin.summaryErr ||
      "the spine has not answered with the cockpit")}</span></div></div>`;
  const m = s.the_month || {}, cl = s.survival || {};
  /* runway names its own fields; the clock's cash is the SAME cash the runway
     divides by burn. Reading it from two places is how a payload once said
     'good' and 'CRITICAL' in the same breath. */
  const rw = s.runway || {};
  const r = { cash: rw.total_cash != null ? rw.total_cash : cl.cash,
              weeks: cl.weeks_fuel,          /* SERVED, not derived from months */
              verdict: rw.verdict };
  const days = cl.days_left != null ? cl.days_left : cl.days;
  /* THE ROAD ESTIMATE IS DEAD (2026-08-01). The line is nut + road ACTUALLY
     spent — $0 road on the 1st, growing as CSVs land. Served, never derived,
     and never the projection: if the actuals are unreadable this says "——". */
  const delta = m.over_under_actual;
  const proj = m.projected_eom, be = m.break_even_actual;
  const dayPct = m.days_in_month ? (m.day_of_month / m.days_in_month * 100) : 0;
  const gcol = bandCol(m.band);
  return `<div class="strip">
    <div class="panel gp">${heroGauge(m)}</div>
    <div class="panel ro">
      <div class="rr"><div class="rl">projected month-end</div>
        <div class="rbig" style="color:${gcol}">${proj == null ? "——" : money(proj)}</div></div>
      <div class="rr"><div class="rl">delivered vs the line</div>
        <div class="rmid" style="color:${delta == null ? "var(--unknown)"
          : delta >= 0 ? C.green : C.red}">${delta == null ? "——"
          : (delta >= 0 ? "▲ " : "▼ ") + money(Math.abs(delta))
            + (delta >= 0 ? " OVER" : " SHORT")}</div></div>
      <div class="rr"><div class="rl">break-even — bills + road so far</div>
        <div class="rmid" style="color:${C.chrome}">${be == null ? "——" : money(be)}</div>
        <div class="rsub">${m.nut_actual == null ? "——" : money(m.nut_actual)} bills +
          ${m.road_actual == null ? "——" : money(m.road_actual)} road
          <span style="color:var(--etch)">actual · grows as spend lands</span></div></div>
      <div class="rr"><div class="rl">${esc((m.month_name||"month").toUpperCase())} · day ${
        m.day_of_month} / ${m.days_in_month} · ${m.days_left} left</div>
        <div class="daybar"><i style="width:${dayPct}%"></i></div></div>
    </div>
    <div class="panel clk">
      <div class="cap">the clock</div>
      <div class="tmin" style="margin-top:7px">${days == null ? "——" : "T−" + days}</div>
      <div class="cap" style="margin-top:2px">days to 10/1</div>
      <div class="ln" style="margin-top:9px"><span>cash</span><b>${
        r.cash == null ? "——" : money(r.cash)}</b></div>
      <div class="ln"><span>runway</span><b class="${
        r.verdict === "CRITICAL" ? "dn" : ""}">${r.weeks == null ? "——" :
        r.weeks + " wk"}${r.verdict ? " · " + esc(r.verdict) : ""}</b></div>
      <div class="ln"><span>still out</span><b>${
        (s.collections && s.collections.outstanding) == null ? "——"
          : money(s.collections.outstanding)}</b></div>
      <div class="cap" style="margin-top:7px">three lines that never sum</div>
    </div>
  </div>`;
}

/* THE ATTITUDE GAUGE, ported from the cockpit that earned its trust — not a
   reinterpretation of it. Same geometry (440×286, hub at 220/240, R=180), same
   red→yellow→green sweep, the same dashed BREAK-EVEN radial with its triangle,
   the same ghost needle for the projection behind the live one.

   THE BAND IS THE MONTH'S OWN VERDICT, never the room's temperature. The desk
   can be hot because a deadline is close while the month itself is CRUSHING;
   painting this needle red on a $2,880-over month would be the instrument
   lying to make the room consistent. */
const C = { red:"#FF4444", yellow:"#FFD600", green:"#00E676",
            chrome:"#C0C8D0", mid:"#86868b", track:"#1f1f1f" };
let GAUGE_AT = null;
const bandCol = b => b === "good" ? C.green : b === "warn" ? C.yellow
                   : b === "red" ? C.red : C.chrome;
const arcPt = (cx,cy,r,t) => { const a = (180 - t*180)*Math.PI/180;
                               return [cx + r*Math.cos(a), cy - r*Math.sin(a)]; };

function heroGauge(m){
  const cx = 220, cy = 240, R = 180, nlen = 140;
  /* the line is ACTUAL: nut + road spent so far, growing intramonth. The bare
     nut stands in only when the actuals could not be computed at all. */
  const be = m.break_even_actual != null ? m.break_even_actual : m.monthly_nut;
  const mtd = m.mtd_revenue, proj = m.projected_eom;
  if(be == null || mtd == null) return `<div class="gen" style="min-height:200px">
    <span class="nodata">not enough is known to draw the month</span></div>`;
  /* Headroom so BREAK-EVEN sits ~2/3 across rather than crammed at the edge —
     the cockpit's own scale rule, carried over unchanged. */
  const gmax = Math.max(be*1.5, (proj||0)*1.12, mtd*1.12, 1);
  const cl = (v,a,b) => Math.min(b, Math.max(a, v));
  const tBe = cl(be/gmax,0,1), tM = cl(mtd/gmax,0,1), tP = cl((proj||0)/gmax,0,1);
  const rotM = (tM-0.5)*180, rotP = (tP-0.5)*180;
  const col = bandCol(m.band);
  const n1 = arcPt(cx,cy,52,tBe), n2 = arcPt(cx,cy,R+8,tBe), nl = arcPt(cx,cy,R+34,tBe);
  const nlx = Math.max(96, Math.min(344, nl[0]));
  /* THE SWING IS AN ARRIVAL, NOT A TIC. It plays when the reading actually
     changes; on a re-render carrying the same figure the needle is drawn where
     it already stands. Replaying it on every write made the dial look like it
     was resetting — which is exactly what Bryan saw. */
  const pct = Math.min(100, Math.max(0, mtd/gmax*100));
  const same = GAUGE_AT && GAUGE_AT.m === rotM && GAUGE_AT.p === rotP;
  const restM = same ? rotM : -90, restP = same ? rotP : -90;
  const restArc = same ? (100 - pct) : 100;
  return `<svg class="hero" viewBox="0 0 440 286" role="img"
      aria-label="Month revenue ${money(mtd)} against break-even ${money(be)}">
    <defs><linearGradient id="dgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="${C.red}"/><stop offset="0.5" stop-color="${C.yellow}"/>
      <stop offset="1" stop-color="${C.green}"/></linearGradient></defs>
    <path d="M40 240 A180 180 0 0 1 400 240" fill="none" stroke="${C.track}"
      stroke-width="24" stroke-linecap="round"/>
    <path id="heroArc" d="M40 240 A180 180 0 0 1 400 240" fill="none" stroke="url(#dgrad)"
      stroke-width="24" stroke-linecap="round" pathLength="100" stroke-dasharray="100"
      stroke-dashoffset="${restArc}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.16,1,.3,1)"/>
    <line x1="${n1[0]}" y1="${n1[1]}" x2="${n2[0]}" y2="${n2[1]}" stroke="${C.chrome}"
      stroke-width="3" stroke-dasharray="5 4"/>
    <polygon points="${n2[0]-6},${n2[1]-9} ${n2[0]+6},${n2[1]-9} ${n2[0]},${n2[1]+1}"
      fill="${C.chrome}"/>
    <text x="${nlx}" y="${nl[1]-2}" fill="${C.chrome}" font-family="var(--mono)"
      font-size="17" font-weight="700" letter-spacing="0.5" text-anchor="middle"
      >BREAK-EVEN ${money(be)}</text>
    <g id="heroGhost" transform="rotate(${restP} ${cx} ${cy})"
       style="transition:transform 1.25s cubic-bezier(.16,1,.3,1)" data-rot="${rotP}">
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-nlen+14}" stroke="${C.mid}"
        stroke-width="2.5" stroke-dasharray="5 4"/></g>
    <g id="heroNeedle" transform="rotate(${restM} ${cx} ${cy})"
       style="transition:transform 1.4s cubic-bezier(.16,1,.3,1)" data-rot="${rotM}">
      <polygon points="${cx-7},${cy} ${cx},${cy-nlen} ${cx+7},${cy}" fill="${col}"
        style="filter:drop-shadow(0 0 5px ${col})"/></g>
    <circle cx="${cx}" cy="${cy}" r="11" fill="${C.chrome}"/>
    <circle cx="${cx}" cy="${cy}" r="5.5" fill="${col}"/>
    <text x="${cx}" y="150" fill="${C.mid}" font-family="var(--mono)" font-size="15"
      font-weight="700" letter-spacing="2.4" text-anchor="middle"
      style="paint-order:stroke;stroke:#07080A;stroke-width:5px;stroke-linejoin:round"
      >MTD REVENUE</text>
    <text x="${cx}" y="212" fill="${col}" font-family="var(--mono)" font-size="54"
      font-weight="600" text-anchor="middle"
      style="paint-order:stroke;stroke:#07080A;stroke-width:8px;stroke-linejoin:round"
      >${money(mtd)}</text>
  </svg>`;
}

/* The needles rest pointing left and swing to their served angle the moment
   the SVG lands — the arrival IS the reading.

   NEVER BEHIND requestAnimationFrame. A hidden document freezes its animation
   frames, so an rAF-gated swing leaves the arc empty and the needle at zero
   until the tab is looked at — an instrument reading $0 on a $14,300 month
   because the phone was in a pocket. The same wall-clock-over-animation rule
   the lever lives by. A forced reflow makes the CSS transition play from the
   rest state; if the browser skips the animation entirely, the FINAL values
   are still correct, which is the part that matters. */
function swingGauge(){
  const arc = $("heroArc"), nd = $("heroNeedle"), gh = $("heroGhost");
  if(!arc) return;
  const m = (State.fin.summary || {}).the_month || {};
  const be = m.break_even_actual != null ? m.break_even_actual : m.monthly_nut;
  if(be == null || m.mtd_revenue == null) return;
  const gmax = Math.max(be*1.5, (m.projected_eom||0)*1.12, m.mtd_revenue*1.12, 1);
  const pct = Math.min(100, Math.max(0, m.mtd_revenue/gmax*100));
  void arc.getBoundingClientRect();          // seat the rest state, then move
  arc.style.strokeDashoffset = (100 - pct);
  if(nd) nd.setAttribute("transform", `rotate(${nd.dataset.rot} 220 240)`);
  if(gh) gh.setAttribute("transform", `rotate(${gh.dataset.rot} 220 240)`);
  /* remember where it now stands, so a re-render carrying the same reading
     draws it here instead of swinging up from zero again */
  GAUGE_AT = { m: nd && +nd.dataset.rot, p: gh && +gh.dataset.rot };
}

/* ── THE FLOOR: cards, loads, and the drag between them ────────────── */
function finFloor(){
  const e = State.fin.expenses, l = State.fin.loads, ro = State.fin.rollup;
  if(!e || !l) return `<div class="panel" style="flex:1"><div class="gen">
    <span class="nodata">${esc(State.fin.err || "the spine has not answered with the floor")}</span></div></div>`;
  /* EVERY transaction in the window, not a filtered pool. Bryan, 2026-07-29:
     "all of the transactions for July in a column." A row he cannot see is a
     row he cannot reconcile, and the whole point of this floor is that the
     month ends with nothing left unaccounted for. Placed rows stay visible,
     marked, so the column is a checklist rather than a shrinking mystery. */
  /* THE COLUMN'S ORDER IS THE WORK'S ORDER (Bryan, 2026-08-02): intake at the
     very top — dropping is the first act of the day; then the nut; then the
     rows, PLACEABLE FIRST and monthly charges filtered to the bottom, because
     the top of the pile is the work (bank rows waiting for a load) and the
     bottom is the already-spoken-for. Stable sort: the producer's date order
     survives within each tier. */
  /* ONE ROW, ONE WORKBENCH (Bryan, 2026-08-04). A bill's bank row works in
     the bucket's ARRIVED tray; a paid bill rests in the bucket's PAID — and
     when five sat in both places at once the honest dual-render read as the
     twin bug. The pile is load work and the marked/held, nothing else; the
     cap says where the bill rows went, because a row that leaves a list
     silently reads as lost. The books' record still carries every row. */
  const billBound = t => t.monthly_candidate || (t.monthly_pay || []).length;
  /* transfers are money MOVED, not work — no workbench at all; the books'
     record is their one home (Bryan, 2026-08-04) */
  const pile = (e.transactions || []).filter(t => !billBound(t) && !t.transfer);
  const trayN = (e.transactions || []).filter(billBound).length;
  const tier = t => t.accounted ? 2
    : (t.trip_direct && !t.personal) ? 0
    : (t.undraggable_because || "").startsWith("month-level") ? 2 : 1;
  /* THE FOLD (Bryan, 2026-08-04: "collapse transactions for the month that
     have already been placed"). The 08-02 ruling stands — worked rows never
     vanish, the pile is a checklist — but the checked-off lines now tuck
     behind one line wearing their count and their dollars, one tap from
     visible. The work stays on top, bare. */
  const doneRow = t => (t.placements || []).length || t.accounted;
  const work = pile.filter(t => !doneRow(t)).sort((a,b) => tier(a) - tier(b));
  const folded = pile.filter(doneRow).sort((a,b) => tier(a) - tier(b));
  const foldSum = folded.reduce((s,t) => s + Math.abs(t.amount || 0), 0);
  const all = work;
  const stale = l.mirror_stale_hours;
  const m0 = (State.fin.summary && State.fin.summary.the_month) || {};
  return `<div class="finscroll">
    <div class="floor">
      <div class="panel">
        <div class="cap">${esc((m0.month_name||"the window").toLowerCase())} — ${
          all.length} in the pile · ${e.pool_count} still to place · ${money(e.pool_total || 0)}${
          trayN ? ` · ${trayN} with the bills &rarr;` : ""}</div>
        <div class="stab">
          <button id="placeAll">place them for me</button>
          <button id="clearAuto" class="ghost">clear the machine's</button>
        </div>
        <div class="exp" style="margin-top:7px">${
          all.length ? all.map(finLine).join("")
            : folded.length ? "" : `<p class="nodata">nothing in the window</p>`}${
          folded.length ? `<div class="fold" id="pileFold" title="${
              FIN.pileOpen ? "tap to tuck them back away" : "tap to see every one"}">
            <span>placed &amp; marked — ${folded.length} row${folded.length===1?"":"s"} · ${
              money(foldSum)}</span><i>${FIN.pileOpen ? "tuck away" : "open"}</i></div>${
            FIN.pileOpen ? folded.map(finLine).join("") : ""}` : ""}</div>
        ${e.blind_days ? `<div class="cap" style="margin-top:8px;color:var(--hot)">
          known through ${esc(e.txn_through||"?")} · ${e.blind_days} day${
          e.blind_days===1?"":"s"} not imported</div>` : ""}
        <div style="margin-top:9px">${finNutList(m0)}</div>
      </div>
      <div class="panel">
        <div class="cap">the loads — ${(l.loads||[]).length} in ${esc(FIN.period)} · ${
          money(l.revenue || 0)} earned${stale != null && stale > 6
            ? ` · <span style="color:var(--hot)">mirror ${stale}h old</span>` : ""}</div>
        <div class="lanes" id="loadZone" style="margin-top:7px">${finMonthlyBox()}${
          (l.loads||[]).length ? (l.loads||[]).map(ld => finLane(ld, ro)).join("")
            : `<p class="nodata">no loads delivered in this window</p>`}</div>
      </div>
    </div>
    ${finReconcile()}${finCharts()}</div>`;
}

/* THE NUT, ON THE LEFT — Bryan, 2026-08-01: "they should be on the left and
   when i pay them they will land in the monthly bucket." And an hour later,
   the correction that made it real: "cards that i can drag as i pay."

   What the month demands stands at the top of the same column as what the
   bank says, because they are one checklist: the month is closed when every
   bank row is accounted for AND every bill has crossed to the bucket. Each
   bill is a CARD — the moment he pays it in the real world he drags it into
   MONTHLY, because the bank row is often days from import. The row attaches
   as evidence when it lands; until then the bucket says so honestly. */
function finNutList(m0){
  const s = State.standings;
  if(!s) return "";
  const open = [...(s.standings||[]), ...(s.tape||[])]
    .filter(x => x.kind === "pay" && x.state !== "settled")
    .sort((a,b) => ((a.days ?? 99) - (b.days ?? 99)));
  const mon = esc((m0 && m0.month_name || "this month").toLowerCase());
  if(!open.length) return `<div class="nut">
    <div class="cap">the nut — every bill recorded for ${mon}</div></div>`;
  const owed = open.reduce((a,x) => a + (x.amount||0), 0);
  return `<div class="nut">
    <div class="cap">the nut — ${open.length} due in ${mon} · ${money(owed)} open · drag a bill over as you pay it</div>
    ${open.map(x => {
      const can = !!(x.bill_type && x.bill_id);
      return `<div class="bill${x.state === "unmarked" ? " late" : ""}${can ? "" : " inert"}"
       ${can ? `draggable="true" data-bt="${esc(x.bill_type)}" data-bid="${esc(x.bill_id)}"` : ""}
       title="${esc(x.sub || "")}">
      <span>${esc(x.title)}</span>
      <em>${x.state === "unmarked" ? "date passed — unmarked"
           : x.state === "today" ? "today" : esc(x.sub || "due")}</em>
      <b>${x.amount == null ? "——" : money(x.amount)}</b></div>`;}).join("")}
  </div>`;
}

/* one expense, as a line you drag */
function finLine(t){
  /* a bill's bank row is grabbable — it drags to MONTHLY and nowhere else */
  const lock = !!t.undraggable_because && !t.monthly_candidate;
  const pl = t.placements || [];
  /* A PLACED ROW STAYS IN THE COLUMN, marked. The month is closed when nothing
     is unaccounted for, so the list has to work as a checklist — a row that
     vanishes the moment it is placed turns the remainder into a mystery
     instead of a countdown. Split rows say so, and say by whose hand. */
  const mp = t.monthly_pay || [];
  const state = pl.length ?
    `<div class="ep${t.auto?" auto":""}">${
      pl.length > 1 ? `split ${pl.length} ways` : "placed"}${
      t.auto ? " by the machine" : ""} · ${money(t.placed_total)}</div>`
    : mp.length ?
    `<div class="ep">paid ${esc(mp[0].name)} · monthly</div>`
    : t.accounted ?
    `<div class="ep">already accounted for · your hand</div>`
    : t.deposit ?
    `<div class="ep" style="color:rgba(255,200,60,.9)">${t.deposit_refund
        ? "deposit · refunded " + esc(t.deposit_refund.refund_date || "")
        : "deposit · awaiting the refund"}</div>`
    : t.expired ?
    `<div class="ep" style="color:var(--etch)">expired pre-auth — never settled · held out</div>`
    : t.credit ?
    `<div class="ep" style="color:#7ec87e">credit — drag it onto the load it belongs to</div>`
    : "";
  return `<div class="eline${lock?" locked":""}${pl.length || mp.length || t.accounted?" done":""}" data-txn="${t.id}" ${
    lock?`title="${esc(t.undraggable_because)}"`
        :t.monthly_candidate?`draggable="true" title="a bill's bank row — tap it, drag it into MONTHLY, or right-click"`
        :'draggable="true" title="tap for the row&#39;s moves, or drag it onto a load"'}>
    <div class="em">${esc(t.merchant || t.description || "—")}</div>
    <div class="ea${t.credit ? " cr" : ""}">${
      t.credit ? "+" + money(Math.abs(t.amount)) : money(t.amount)}</div>
    <div class="ed">${esc(t.date)} · ${esc(t.category || "uncategorized")}${
      t.pending ? ` · <span style="color:rgba(255,200,60,.9)">pending</span>` : ""}</div>
    ${state}</div>`;
}

/* THE MONTHLY BOX — Bryan, 2026-07-29: "have a box for Monthly and i will drag
   any monthly in. when i drag it in, it is paid for that month."
   FLIPPED 2026-08-01, his ruling for the August fresh start: "they should be
   on the left and when i pay them they will land in the monthly bucket."

   So the box holds ONLY what has actually been paid — each bill wearing the
   bank row that proved it (the evidence join, monthly_pay). What is still DUE
   stands on the left with the transactions, part of the same checklist the
   month has to clear. A drop is a real financial write, so it goes through the
   one sanctioned writer, and when the transaction does not name one bill
   beyond doubt the box asks instead of guessing. */
function finMonthlyBox(){
  const s = State.standings;
  const pay = s ? [...(s.standings||[]), ...(s.tape||[])].filter(x => x.kind === "pay") : [];
  const settled = pay.filter(x => x.state === "settled");
  const open = pay.filter(x => x.state !== "settled");
  const owed = open.reduce((a,x) => a + (x.amount||0), 0);
  const ev = (State.fin.expenses && State.fin.expenses.monthly_pays) || [];
  /* ALL of a bill's bank rows, not the first one — the SBA loan pays in two
     ACH debits every month (2026-08-03), and the bucket reads their sum */
  const evAll = x => ev.filter(e =>
    e.bill_type === x.bill_type && String(e.bill_id) === String(x.bill_id));
  const arrived = ((State.fin.expenses && State.fin.expenses.transactions) || [])
    .filter(t => t.monthly_candidate);
  const ask = FIN.ask;                       // a drop the spine handed back to him
  return `<div class="lane monthly" data-row="monthly">
    <div class="lh"><span class="lr">${money(settled.reduce((a,x)=>a+(x.amount||0),0))}</span>
      <div class="lb">MONTHLY</div>
      <div class="lm">paid this month · ${settled.length} of ${pay.length}${
        owed ? ` · ${money(owed)} still due on the left` : ""}</div></div>
    <div class="lin">${ask ? `<div class="ask">
        <div class="at">${ask.no_match
          ? `no bill matches ${esc(ask.txn.merchant || "this row")} ${
              money(ask.txn.amount)} — name it yourself`
          : `which bill did ${esc(ask.txn.merchant || "this")} ${
              money(ask.txn.amount)} pay?`}</div>
        ${ask.candidates.map(c => `<button class="acand" data-txn="${ask.txn.id}"
          data-bt="${esc(c.bill_type)}" data-bid="${esc(c.bill_id)}">
          <span>${esc(c.name)}</span><b>${money(c.due)}</b>
          <i>${esc(c.why)}</i></button>`).join("")}
        <button class="acand cancel">none of these — put it back</button>
      </div>` : (arrived.length || settled.length ?
        /* ARRIVED BANK ROWS FIRST (Bryan, 2026-08-02: "these... should be at
           the top of monthly cards") — the imports that look like bills, each
           one tap away from attaching to the card it paid. */
        (arrived.length ? `<div class="cap" style="margin-bottom:5px">arrived — tap to match to a bill</div>`
          + arrived.map(t => `<div class="drop-in arr" data-arr="${t.id}"
              title="tap to say which bill this paid">
              <span>${esc(t.merchant || t.description || "—")}</span>
              <b>${money(t.amount)}</b></div>`).join("")
          + (settled.length ? `<div class="cap" style="margin:7px 0 5px">paid</div>` : "") : "")
        + settled.map(x => {
        const es = evAll(x);
        const covered = es.reduce((a,e) => a + (e.amount || 0), 0);
        return `<div class="drop-in paid"><span>${esc(x.title)}<i class="pev${
            es.length ? "" : " hand"}">${es.length > 1
            ? `${es.length} bank rows · ${money(covered)}${
                x.amount != null && Math.abs(covered - x.amount) > 0.01
                  ? " of " + money(x.amount) : ""}`
            : es.length
            ? esc(((es[0].merchant || "bank row") + " · " + (es[0].date || "")).toLowerCase())
            : "your hand · awaiting the bank row"}</i></span>
          <b>${x.amount == null ? "——" : money(x.amount)}</b></div>`;
      }).join("")
        : `<div class="empty">nothing paid yet for ${
             esc((State.fin.summary&&State.fin.summary.the_month&&
                  State.fin.summary.the_month.month_name)||"the month")} —<br>
             drag a bill across as you pay it</div>`)}</div>
    <div class="lf"><span>${open.length ? `${open.length} still due` : "all recorded"}</span>
      <b class="${owed ? "dn" : ""}">${owed ? money(owed) : "clear"}</b></div>
  </div>`;
}

/* one load, as an open box you drop into */
function finLane(ld, ro){
  const row = ro && (ro.loads||[]).find(x => x.sheet_row === ld.sheet_row);
  const net = row ? row.net : null;
  /* CONTRIBUTION TO THE NUT, signed. The freight pays its own road first and
     whatever survives is what fights the month's fixed cost — so a load that
     ate more than it earned is a MINUS, and it should read as one. Served, not
     derived here. */
  const nut = row ? row.nut_contribution : null;
  const ids = row ? (row.assigned_txn_ids || []) : [];
  const txns = State.fin.expenses ? (State.fin.expenses.transactions||[]) : [];
  const inside = ids.map(id => txns.find(t => t.id === id)).filter(Boolean);
  return `<div class="lane" data-row="${ld.sheet_row}">
    <div class="lh"><span class="lr">${money(ld.rate || 0)}</span>
      <div class="lb">${esc(ld.broker || "—")}</div>
      <div class="lm">${esc(ld.pickup_city||"?")} &rarr; ${esc(ld.delivery_city||"?")}${
        ld.delivery_state ? ", " + esc(ld.delivery_state) : ""}<br>${esc(ld.delivery_date||"")}</div></div>
    <div class="lin">${inside.length ? inside.map(t => {
      /* what THIS load carries of that transaction — a Pilot week sits on
         several loads, so the portion is the truth here, never the whole */
      const p = (t.placements||[]).find(x => x.sheet_row === ld.sheet_row);
      const part = p ? p.amount : t.amount;
      return `<div class="drop-in${p&&p.source==="auto"?" auto":""}" data-txn="${t.id}"
        title="${esc(p && p.basis ? p.basis : "click to take it back off")}">
        <span>${esc(t.merchant || t.category || "—")}${
          (t.placements||[]).length>1 ? ` <i class="pt">part</i>` : ""}</span>
        <b>${money(part)}</b></div>`; }).join("")
      : `<div class="empty">drag an expense here</div>`}
      ${row && row.fee != null ? `<div class="drop-in" style="opacity:.6;cursor:default">
        <span>factoring fee</span><b>${money(row.fee)}</b></div>` : ""}
      ${row && row.trip_accrual ? `<div class="drop-in" style="opacity:.6;cursor:default">
        <span>trip accrual</span><b>${money(row.trip_accrual)}</b></div>` : ""}</div>
    <div class="lf"><span>to the nut</span>
      <b class="${nut == null ? "" : nut < 0 ? "dn" : "up"}">${
        nut == null ? "——" : (nut < 0 ? "−" : "+") + money(Math.abs(nut))}</b>
      ${row && row.nut_pct != null ? `<i>${row.nut_pct.toFixed(1)}% of it</i>` : ""}</div>
  </div>`;
}

/* SUMMARY — the month reconciled on real data. Every figure comes from
   finroom's reconciliation block; the page adds nothing. It also names the
   basis problem out loud: the gauge above measures ACTUAL revenue against a
   line built from a road PROJECTION. For a month you are standing in, that
   mixes bases — so the line on actually-spent road is shown BESIDE the served
   one, never in place of it. Changing the producer is Bryan's ruling. */
function finReconcile(){
  const ro = State.fin.rollup, ex = State.fin.expenses, sm = State.fin.summary;
  const R = ro && ro.reconciliation;
  if(!R) return "";
  const m = (sm && sm.the_month) || {};
  const onActual = R.break_even_actual, over = R.over_under_actual, rev = R.revenue;
  /* placement progress is measured on the WINDOW's rows (what landed this
     period), never the load-shifted figure — against the shifted one the bar
     reads past 100% the moment a row rides an earlier month's load */
  const roadWin = R.road_window != null ? R.road_window : R.road_actual;
  const pct = roadWin ? Math.min(100, Math.round(100 * (R.attributed||0) / roadWin)) : 0;
  const H = R.held_out || {};
  const chip = (k, v, why) => !v ? "" :
    `<span class="hchip" title="${esc(why)}">${esc(k)} <b>${money(v)}</b></span>`;
  return `<div class="panel" style="flex:0 0 auto">
    <div class="cap">summary — ${esc(FIN.period)} on real data</div>
    <div class="recbar"><i style="width:${pct}%"></i></div>
    <div class="recline">
      <span><b>${money(R.attributed||0)}</b> placed on loads</span>
      <span><b class="${R.unattributed > 0 ? "hot" : ""}">${money(R.unattributed||0)}</b> still to place</span>
      <span>of <b>${money(roadWin||0)}</b> spent this ${esc(FIN.period)}</span>
    </div>
    ${R.road_shift && (R.road_shift.off || R.road_shift.on) ? `<div class="recline">
      <span>road follows the load:</span>
      ${R.road_shift.off ? `<span><b>−${money(R.road_shift.off)}</b> riding loads outside this ${esc(FIN.period)}</span>` : ""}
      ${R.road_shift.on ? `<span><b>+${money(R.road_shift.on)}</b> earlier spend riding this ${esc(FIN.period)}'s loads</span>` : ""}
      <span>= <b>${money(R.road_actual||0)}</b> this ${esc(FIN.period)}'s work</span>
    </div>` : ""}
    ${(H.cash || H.personal_road || H.uncategorized) ? `<div class="held">
      <span class="cap">held out of every load — rule on these and the month closes honestly</span>
      ${chip("cash", H.cash, "what it bought on the road is unknown until you itemize it")}
      ${chip("tagged personal", H.personal_road, "road categories MI auto-tagged personal — flip its pin if that is wrong")}
      ${chip("uncategorized", H.uncategorized, "no category yet, so no lane")}
      ${chip("already accounted", H.accounted, "rows your hand declared covered elsewhere — held out of road and the line")}
      ${chip("on deposit", H.on_deposit, "parked with hotels, coming back — never cost; refunded pairs cancel silently")}
    </div>` : ""}
    ${ex && ex.blind_days ? `<div class="cap" style="margin-top:8px;color:var(--hot)">
      spend known only through ${esc(ex.txn_through)} — ${ex.blind_days} day${
      ex.blind_days===1?"":"s"} not yet imported. incomplete, not zero.</div>` : ""}
    <div class="basis">
      <div class="brow"><span>break-even — the line</span>
        <b class="key">${onActual == null ? "——" : money(onActual)}</b>
        <i>nut + ${money(R.road_actual||0)} road so far · grows as spend lands</i></div>
      ${over != null ? `<div class="brow tot">
        <span>delivered ${money(rev)} — against the actual line</span>
        <b class="${over >= 0 ? "up" : "dn"}">${over >= 0 ? "+" : "−"}${
          money(Math.abs(over))}</b><i>work already run</i></div>` : ""}
      ${R.over_under_booked != null && R.booked_ahead ? `<div class="brow">
        <span>booked ${money(R.booked_total)} — same line</span>
        <b class="${R.over_under_booked >= 0 ? "up" : "dn"}">${
          R.over_under_booked >= 0 ? "+" : "−"}${money(Math.abs(R.over_under_booked))}</b>
        <i>incl. ${money(R.booked_ahead)} still to run</i></div>` : ""}
    </div>
  </div>`;
}

function finCharts(){
  const ro = State.fin.rollup;
  if(!ro) return "";
  const S = ro.series || [], cats = ro.road_by_category || {};
  const mx = Math.max(1, ...S.map(s => Math.max(s.revenue||0, s.road||0)));
  const W = 640, H = 132, pad = 22, bw = S.length ? (W-2*pad)/S.length : 0;
  const bars = S.map((s,i) => {
    const x = pad + i*bw, w = Math.max(3, bw*0.34);
    const hr = ((s.revenue||0)/mx)*(H-40), hc = ((s.road||0)/mx)*(H-40);
    return `<rect x="${x.toFixed(1)}" y="${(H-22-hr).toFixed(1)}" width="${w.toFixed(1)}"
        height="${Math.max(1,hr).toFixed(1)}" rx="1.5" fill="rgba(var(--key),${s.partial?".45":".85"})"/>
      <rect x="${(x+w+2).toFixed(1)}" y="${(H-22-hc).toFixed(1)}" width="${w.toFixed(1)}"
        height="${Math.max(1,hc).toFixed(1)}" rx="1.5" fill="rgba(255,59,24,${s.partial?".3":".55"})"/>
      <text x="${(x+w+1).toFixed(1)}" y="${H-8}" fill="var(--etch)" font-size="8"
        font-family="ui-monospace,Menlo,monospace" text-anchor="middle">${esc(s.label)}</text>`;
  }).join("");
  const ct = Object.values(cats).reduce((a,b)=>a+b,0) || 1;
  return `<div class="panel" style="flex:0 0 auto">
    <div class="cap">earned vs the road it took · last ${S.length} ${esc(FIN.period)}${
      S.length===1?"":"s"} · faded = still running</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" style="max-height:132px;margin-top:6px">${bars}</svg>
    <div class="cap" style="margin-top:6px">the road, this ${esc(FIN.period)} — ${
      money(ro.road_total || 0)}</div>
    <div class="rows" style="margin-top:5px">${Object.entries(cats).sort((a,b)=>b[1]-a[1])
      .map(([c,v]) => `<div class="rw"><span style="width:74px">${esc(c)}</span>
        <span class="b"><i class="k" style="width:${Math.round(100*v/ct)}%"></i></span>
        <span class="v">${money(v)}</span></div>`).join("")
      || `<p class="nodata">no road cost in the window</p>`}</div>
    ${finTable(ro)}
  </div>`;
}

function finTable(ro){
  const rows = (ro.loads || []).filter(l => l.rate);
  if(!rows.length) return "";
  return `<div class="cap" style="margin:12px 0 4px">every load in the window · net = rate minus
    what the run cost. fixed cost is fought above, never here</div>
  <div style="overflow-x:auto"><table class="ltab"><thead><tr>
    <th>load</th><th>delivered</th><th>rate</th><th>road</th><th>fee</th><th>accrual</th><th>net</th>
  </tr></thead><tbody>${rows.map(l => `<tr>
    <td>${esc(l.broker||"—")}<span style="color:var(--etch)"> · ${esc(l.delivery_city||"")}</span></td>
    <td>${esc(l.delivery_date||"")}</td>
    <td class="m">${money(l.rate)}</td>
    <td class="${l.assigned_cost?"m":"unk"}">${l.assigned_cost ? money(l.assigned_cost) : "——"}</td>
    <td class="${l.fee!=null?"m":"unk"}" title="${esc(l.fee_basis||"")}">${
      l.fee!=null ? money(l.fee) : "——"}</td>
    <td class="${l.trip_accrual?"m":"unk"}">${l.trip_accrual ? money(l.trip_accrual) : "——"}</td>
    <td class="net">${l.net==null?"——":money(l.net)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

/* ── THE HOLD: the month as stones on a floor ──────────────────────── */
const HOLD_GROUPS = [["all","all"],["monthly","monthly"],["annual","annual"],
                     ["loans","loans"],["etc","etc"]];

function holdBucket(s){
  const t = (s.bill_type || "").toLowerCase();
  if(t === "loan") return "loans";
  if(t === "credit_card") return "etc";
  if(t === "fixed_monthly") return "monthly";
  return "etc";
}

function finHold(){
  const d = State.standings;
  if(!d) return `<div class="panel" style="flex:1"><div class="gen">
    <span class="nodata">the spine has not answered with the standings</span></div></div>`;
  const all = [...(d.standings||[]), ...(d.tape||[])].filter(s => s.kind === "pay");
  const shown = FIN.group === "all" ? all : all.filter(s => holdBucket(s) === FIN.group);
  const standing = shown.filter(s => s.state !== "settled");
  const settled  = shown.filter(s => s.state === "settled");
  const left  = standing.reduce((a,s) => a + (s.amount||0), 0);
  const clear = settled.reduce((a,s) => a + (s.amount||0), 0);
  State.fin.stones = shown;
  return `<div class="hold">
    <div class="finbar" style="margin-bottom:7px">
      <div class="hgrp" id="holdGrp">${HOLD_GROUPS.map(([k,l]) =>
        `<button data-g="${k}" class="${FIN.group===k?"on":""}">${l}</button>`).join("")}</div>
      <div class="sp"></div>
      <span class="cap">${standing.length} standing${
        standing.length ? " · drag to read · paid on the floor" : ""}</span>
    </div>
    <div class="panel" style="flex:1;min-height:0;padding:0;overflow:hidden">
      <div class="holdw" id="holdW">
        <canvas id="holdC"></canvas>
        ${standing.length ? "" : `<div class="gen" style="position:absolute;inset:0;padding:0 24px">
          <div><div style="font:600 15px/1.5 var(--sans);color:var(--ink)">The floor is bare.</div>
          <div class="nodata" style="margin-top:6px">${settled.length} settled this month —
            ${money(clear)} of it. Nothing in this hold is waiting on your hand.</div></div></div>`}
        <div class="waterline" id="holdLine">
          <div class="wn"><b>${money(left)}</b><span>left this ${
            FIN.group==="all"?"month":esc(FIN.group)}</span></div></div>
        <div class="clear">${money(clear)} clear${
          settled.length ? ` · ${settled.length} settled` : ""}</div>
      </div>
    </div>
  </div>`;
}

/* Stones are laid on the floor by size, largest first, packed in rows from the
   bottom — a load of stone, not a chart. Positions are DERIVED FROM SERVED
   AMOUNTS; nothing here invents a figure. */
function paintHold(){
  const cv = $("holdC"), w = $("holdW"); if(!cv || !w) return;
  const st = (State.fin.stones || []).filter(s => s.state !== "settled" && s.amount);
  const r = w.getBoundingClientRect();
  const W = Math.max(200, r.width), H = Math.max(160, r.height);
  cv.width = W*2; cv.height = H*2;
  const g = cv.getContext("2d"); g.scale(2,2);
  g.clearRect(0,0,W,H);
  const key = HOT ? "255,59,24" : (getComputedStyle(document.documentElement)
                     .getPropertyValue("--key").trim() || "255,164,25");
  const mx = Math.max(1, ...st.map(s => s.amount));
  /* SIZE IS RANK, NOT RATIO — and the code says so rather than pretending.
     Radius grows with √amount so weight reads by AREA rather than width, but
     rMin is a hard floor: a $1 subscription beside a $1,500 truck payment
     would be a 1px target, and an obligation he cannot tap is an obligation
     he cannot settle. So a small stone is BIGGER than its share. The number
     on the stone is the truth; the size is only the ordering. */
  const rMin = 13, rMax = Math.min(52, H*0.2);
  const rad = a => rMin + (rMax-rMin)*Math.sqrt(a/mx);
  const sorted = [...st].sort((a,b) => b.amount - a.amount);
  const placed = [];
  let x = 14, y = H - 16, rowH = 0;
  for(const s of sorted){
    const R = rad(s.amount);
    if(x + R*2 > W - 10){ x = 14; y -= rowH + 8; rowH = 0; }
    const cx = x + R, cy = y - R;
    placed.push({s, cx, cy, R});
    x += R*2 + 7; rowH = Math.max(rowH, R*2);
  }
  State.fin.placed = placed;
  const top = placed.length ? Math.min(...placed.map(p => p.cy - p.R)) : H - 20;
  const line = $("holdLine");
  if(line) line.style.bottom = Math.max(28, H - top + 8) + "px";
  for(const p of placed){
    const hot = p.s.severity === "short", sel = FIN.pick === p.s.id;
    const grd = g.createRadialGradient(p.cx - p.R*0.34, p.cy - p.R*0.36, p.R*0.1,
                                       p.cx, p.cy, p.R);
    if(hot){ grd.addColorStop(0,"rgba(255,120,90,.98)"); grd.addColorStop(.55,"rgba(196,39,26,.8)");
             grd.addColorStop(1,"rgba(60,12,8,.95)"); }
    else   { grd.addColorStop(0,"rgba(214,222,232,.95)"); grd.addColorStop(.55,"rgba(140,152,166,.72)");
             grd.addColorStop(1,"rgba(22,28,36,.96)"); }
    g.fillStyle = grd;
    g.beginPath(); g.arc(p.cx, p.cy, p.R, 0, 7); g.fill();
    if(sel){ g.strokeStyle = `rgba(${key},1)`; g.lineWidth = 2;
             g.beginPath(); g.arc(p.cx, p.cy, p.R+2, 0, 7); g.stroke(); }
    /* The number is the truth the size cannot carry, so it goes on every stone
       that can hold legible type — short form under 18px, and the drill-in
       card carries the rest. */
    g.fillStyle = "rgba(10,12,16,.84)";
    g.textAlign = "center"; g.textBaseline = "middle";
    if(p.R >= 22){
      g.font = "700 10px ui-monospace,Menlo,monospace";
      g.fillText(money(p.s.amount), p.cx, p.cy);
    }else if(p.R >= 16){
      g.font = "700 9px ui-monospace,Menlo,monospace";
      g.fillText(short(p.s.amount), p.cx, p.cy);
    }
  }
}

/* THE BOOKS — Bryan, 2026-08-02: "repurpose the standing tab for an overview
   of my accounts cash status, visuals on contributions from loads to the nut.
   this is where i will go to deep dive on my finances."

   Two facts side by side: what is IN THE TANKS right now (accounts + their
   envelopes, served whole from the one finance store), and WHO FED THE NUT —
   each load's surviving contribution laid as a filling bar against the
   month's fixed cost. The standings list this replaced lives on where it
   belongs now: open bills in the nut checklist, settled ones in the bucket. */
function finBooks(){
  const A = State.fin.accounts, ro = State.fin.rollup, l = State.fin.loads;
  const R = (ro && ro.reconciliation) || {};
  /* ── cash ── */
  /* AVAILABLE IS THE CALLOUT (Bryan, 2026-08-02): available is what he can
     actually spend today; the ledger figure is context and rides tiny. */
  let cash;
  if(!A) cash = `<div class="gen" style="min-height:80px"><span class="nodata">${
    esc(State.fin.acctErr || "the spine has not answered with the accounts")}</span></div>`;
  else cash = `<div class="cashrow tot"><span>all accounts — available</span>
      <b>${A.available_total == null ? "——" : money(A.available_total)}</b>
      <i>${A.total == null ? "" : "ledger " + money(A.total)}</i></div>`
    + (A.accounts||[]).map(a => {
      const avail = a.available_balance != null ? a.available_balance : a.balance;
      return `<div class="cashrow">
      <span>${esc(a.name || a.id || "?")}${a.last4 ? ` <u>·${esc(a.last4)}</u>` : ""}</span>
      <b>${avail == null ? "——" : money(avail)}</b>
      <i>${a.balance == null ? "" : "ledger " + money(a.balance) + " · "}${
        a.updated_at ? "as of " + esc(String(a.updated_at).slice(0,10)) : "as-of unknown"}</i>
      ${(a.envelopes||[]).map(en => `<div class="env"><span>${esc(en.name)}</span>
        <b>${en.balance == null ? "——" : money(en.balance)}</b>${
        en.target ? `<i>of ${money(en.target)}</i>` : ""}</div>`).join("")}
    </div>`;}).join("");
  /* ── the nut, being fed ── */
  /* the rollup rows already CARRY broker/city/date served — the loads join
     only freshens them; when the loads fetch failed the served values stand
     (panel finding: the join was clobbering served fields with undefined) */
  const rows = (ro && ro.loads || [])
    .map(r => {
      const id = (l && (l.loads||[]).find(x => x.sheet_row === r.sheet_row)) || {};
      return {...r, broker: id.broker || r.broker,
              city: id.delivery_city || r.delivery_city,
              date: id.delivery_date || r.delivery_date};
    })
    .filter(r => r.nut_contribution != null)
    .sort((a,b) => (a.date||"") < (b.date||"") ? -1 : 1);
  const nut = R.nut;
  let feed;
  if(!ro) feed = `<div class="gen" style="min-height:80px"><span class="nodata">${
    esc(State.fin.err || "the spine has not answered with the rollup")}</span></div>`;
  else if(nut == null) feed = `<div class="nodata">the nut is unreadable — nothing to measure against</div>`;
  else {
    /* presentation sums of SERVED per-load figures — same practice as the
       bucket header; no financial judgement is derived here */
    const fed = rows.reduce((s,r) => s + Math.max(0, r.nut_contribution), 0);
    const gave = rows.reduce((s,r) => s + Math.min(0, r.nut_contribution), 0);
    const scale = Math.max(nut, fed, 1);
    let x = 0;
    const segs = rows.filter(r => r.nut_contribution > 0).map(r => {
      const w = r.nut_contribution / scale * 100, x0 = x; x += w;
      return `<div class="nutseg" style="left:${x0}%;width:${Math.max(w,.4)}%"
        title="${esc(r.broker || "?")} · ${esc(r.date || "")} · ${money(r.nut_contribution)}${
        r.nut_pct != null ? " · " + r.nut_pct + "% of the nut" : ""}"></div>`;
    }).join("");
    feed = `<div class="nutbar">
        ${segs}
        <div class="nutline" style="left:${Math.min(nut/scale*100, 99.7)}%"></div>
      </div>
      <div class="recline" style="margin-top:6px">
        <span><b>${money(fed)}</b> fed to the nut</span>
        ${gave < 0 ? `<span><b class="hot">${money(gave)}</b> given back</span>` : ""}
        <span>the nut: <b>${money(nut)}</b></span>
      </div>
      <div class="scroll" style="margin-top:9px;max-height:38vh">${
        rows.slice().sort((a,b) => b.nut_contribution - a.nut_contribution).map(r =>
        `<div class="lrow${r.nut_contribution < 0 ? " short" : ""}">
          <div class="t">${esc(r.broker || "—")}${r.city ? " · " + esc(r.city) : ""}</div>
          <div class="a">${(r.nut_contribution >= 0 ? "+" : "−") + money(Math.abs(r.nut_contribution))}</div>
          <div class="s">${esc(r.date || "")}${
            r.nut_pct != null ? ` · ${r.nut_pct}% of the nut` : ""}</div></div>`).join("")
        || `<p class="nodata">no loads with a contribution in this window</p>`}</div>`;
  }
  /* faults — the spine still names them; since the standings list left this
     tab, the books are their one home (panel finding: they rendered nowhere) */
  const faults = (State.standings && State.standings.faults) || [];
  const faultStrip = !faults.length ? "" :
    `<div class="panel" style="margin-bottom:10px"><div class="cap">faults — the spine cannot place these</div>${
      faults.map(f => `<div class="hotline">${esc(f.name||f.bill_id||"?")}${
        f.amount != null ? " · " + money(f.amount) : ""} — ${esc(f.why||f.kind||"")}</div>`).join("")}</div>`;
  /* THE RECORD — Bryan, 2026-08-02: "where are the individual transactions
     with categories... we will use the running list as all transactions with
     categories." 2026-08-03: reordered to read like a ledger line — Date |
     Category | Payee | Amount | Notes | Status, the order a bookkeeper
     writes: when, what kind, who, how much, what became of it, where the
     bank stands — and given two thirds of the row, WHERE THE MONEY GOES
     standing beside it. Read-only here — the floor is where rows get worked. */
  const txAll = (State.fin.expenses && State.fin.expenses.transactions) || [];
  const sift = FIN.catFilter;
  const tx = sift ? txAll.filter(t => (t.category || "uncategorized") === sift) : txAll;
  const note = t =>
    (t.placements||[]).length ? (t.placements.length > 1
      ? `split ${t.placements.length} ways on loads` : "placed on a load")
    : (t.monthly_pay||[]).length ? `paid ${esc(t.monthly_pay[0].name)} — monthly`
    : t.accounted ? "already accounted for — your hand"
    : t.deposit ? (t.deposit_refund
        ? "deposit — refunded " + esc(t.deposit_refund.refund_date || "")
        : "deposit — awaiting the refund")
    : t.expired ? "the bank never settled it — held out"
    : t.credit ? "credit — place it on the load it belongs to"
    : t.personal ? "tagged personal"
    : t.transfer ? "money moved between your accounts — not spend"
    : "unplaced";
  const bank = t => t.expired ? "expired" : t.pending ? "pending" : "posted";
  /* the ask lives here too now — a MONTHLY answer begun from the record must
     come back to the record, not to a bucket on another tab */
  const ask = FIN.ask ? `<div class="ask" style="margin-bottom:9px">
      <div class="at">${FIN.ask.no_match
        ? `no bill matches ${esc(FIN.ask.txn.merchant || "this row")} ${
            money(FIN.ask.txn.amount)} — name it yourself`
        : `which bill did ${esc(FIN.ask.txn.merchant || "this")} ${
            money(FIN.ask.txn.amount)} pay?`}</div>
      ${FIN.ask.candidates.map(c => `<button class="acand" data-txn="${FIN.ask.txn.id}"
        data-bt="${esc(c.bill_type)}" data-bid="${esc(c.bill_id)}">
        <span>${esc(c.name)}</span><b>${money(c.due)}</b>
        <i>${esc(c.why)}</i></button>`).join("")}
      <button class="acand cancel">none of these — put it back</button>
    </div>` : "";
  const record = `<div class="panel" style="min-width:0">
    <div class="cap">the record — ${tx.length}${sift ? ` of ${txAll.length}` : ""} transaction${
      tx.length===1?"":"s"} in ${esc(FIN.period)}${
      sift ? ` · sifted to ${esc(sift)} — tap it again to clear` : ", every one with its category"}</div>
    ${ask}
    <div class="lghead"><span>date</span><span>category</span><span>payee</span>
      <span class="ra">amount</span><span>notes</span><span style="text-align:right">status</span></div>
    <div class="scroll" style="max-height:52vh">${
      tx.length ? tx.map(t => `<div class="lgr${t.accounted ? " dim" : ""}" data-txn="${t.id}"
        title="tap the row for its moves — MONTHLY, a load, accounted, deposit">
        <span class="ld" title="${esc(t.date)}">${esc(String(t.date||"").slice(5))}</span>
        <span class="lc"><span class="catchip edit" data-cat-txn="${t.id}"
          title="tap to change the category — the rules learn it">${
          esc(t.category || "uncategorized")}</span></span>
        <span class="lp" title="${esc(t.description || "")}">${esc(t.merchant || t.description || "—")}</span>
        <span class="la${t.credit ? " cr" : ""}">${
          t.credit ? "+" + money(Math.abs(t.amount)) : money(t.amount)}</span>
        <span class="ln">${note(t)}</span>
        <span class="lst ${bank(t)}">${bank(t)}</span>
        <span class="lsub">${esc(String(t.date||"").slice(5))} · ${note(t)} · ${bank(t)}</span></div>`).join("")
      : `<p class="nodata">${sift ? `nothing in ${esc(sift)} this window` :
          "nothing in the window — drop a csv up on the floor"}</p>`}</div></div>`;
  /* WHERE THE MONEY GOES — the window's five biggest categories, trailing
     six windows etched like level marks on glass; the viewed window burns
     amber, the dashed line is the trailing average. The producer computed
     all of it; this only draws. Each trend wears its OWN scale — the
     numbers carry size across categories, the bars carry shape within one. */
  const sp = State.fin.spend;
  let goes;
  if(!sp) goes = `<span class="nodata">the spine has not answered with the breakdown</span>`;
  else if(!(sp.categories||[]).length) goes = `<span class="nodata">no spend in the window yet</span>`;
  else goes = sp.categories.map((c,ix) => {
      const mx = Math.max(...c.series.map(v => Math.max(v,0)), 1);
      const bars = c.series.map((v,i) => {
        const on = i === sp.windows.length - 1;
        const h = v > 0 ? Math.max(v/mx*100, 3) : 0;
        return `<div class="sb${on ? " on" : ""}" title="${esc(sp.windows[i].label)} · ${
          money(Math.max(v,0))}${v < 0 ? " net credit" : ""}"><i style="height:${h}%"></i></div>`;
      }).join("");
      const wl = c.avg > 0 ? Math.min(c.avg/mx*100, 100) : null;
      const un = c.name === "uncategorized";
      return `<div class="scat${FIN.catFilter===c.name ? " picked" : ""}" data-spend-cat="${esc(c.name)}"
        title="tap to sift the record to ${esc(c.name)}">
        <div class="sr1"><span class="rank">${String(ix+1).padStart(2,"0")}</span>
          <span class="scn${un ? " uncat" : ""}">${esc(c.name)}${un ? " — needs your hand" : ""}</span>
          <span class="sca">${money(c.now)}<i>${c.share != null ? Math.round(c.share)+"%" : ""}</i></span></div>
        <div class="strough">${wl != null ? `<div class="wline" style="bottom:${wl}%"
          title="trailing average · ${money(c.avg)}"></div>` : ""}${bars}</div>
        <div class="sxl">${sp.windows.map(w => `<span>${esc(w.label)}</span>`).join("")}</div>
      </div>`;}).join("");
  const spend = `<div class="panel" style="min-width:0">
    <div class="cap">where the money goes — top ${(sp && (sp.categories||[]).length) || 0} · ${
      esc((sp && sp.ranked_by) || "ranked by the trailing average")}</div>
    <div class="scroll" style="max-height:58vh">${goes}</div>
    ${sp && (sp.categories||[]).length ? `<div class="sfoot">${money(sp.window_total)} spent in the
       window · dashed line = the trailing average · held out: ${esc(sp.held_out)} ·
       each trend on its own scale · tap a category to sift the record</div>` : ""}</div>`;
  /* the intake lives HERE now (Bryan, 2026-08-02: "move the drop cards from
     the floor to the books") — dropping feeds the record and the tanks, and
     both of those live on this tab. Moved, not copied. */
  const intake = `<div class="panel" style="margin-bottom:10px;display:grid;
      grid-template-columns:1fr 1fr;gap:8px">
    <div class="drop" id="dropCsv" style="margin:0">
      <div class="dl">drop a transactions csv</div>
      <div class="ds">LoadPay or PNC · deduped by the importer</div></div>
    <div class="drop" id="dropShot" tabindex="0" style="margin:0">
      <div class="dl">balances &amp; statements</div>
      <div class="ds">click then &#8984;V, or drop an image</div>
      <div class="acctpick" title="whose transactions are in this image — pendings ride in under the right account">${
        ["pnc","loadpay"].map(a => `<button data-acct="${a}" class="${
          (FIN.shotAcct||"pnc")===a ? "on" : ""}">${a}</button>`).join("")}</div></div>
  </div>`;
  return `<div class="finscroll">${intake}${faultStrip}<div class="floor" style="grid-template-columns:minmax(280px,380px) 1fr">
    <div class="panel"><div class="cap">cash — the tanks${
      A && A.as_of ? " · newest reading " + esc(String(A.as_of).slice(0,10)) : ""}</div>${cash}</div>
    <div class="panel"><div class="cap">feeding the nut — ${esc(FIN.period)}, each load's surviving contribution</div>${feed}</div>
  </div><div class="bookslow">${record}${spend}</div></div>`;
}
/* THE BUDGET — Bryan, 2026-08-03: "a budget tab that details out my loans and
   monthly budget for recurring monthly payments." A reference wall, not a
   workbench: paying still happens on the floor, by his hand. Cards ride HIS
   kill order (kill_priority), loans wear their paydown, and every figure is
   served — the shell draws, it never derives. */
function finBudget(){
  const bd = State.fin.budget;
  if(!bd) return `<div class="panel" style="flex:1"><div class="gen">
    <span class="nodata">${esc(State.fin.err || "the spine has not answered with the budget")}</span></div></div>`;
  const T = bd.totals || {};
  const pays = State.standings
    ? [...(State.standings.standings||[]), ...(State.standings.tape||[])].filter(x => x.kind === "pay")
    : [];
  const st = (bt, bid) => {
    const ev = (bd.evidence||{})[bt + ":" + bid];
    if(ev) return ` · <span class="bpay">${ev.rows > 1 ? ev.rows + " bank rows · " : ""}${
      money(ev.covered)} carried this cycle</span>`;
    const p = pays.find(x => x.bill_type === bt && String(x.bill_id) === String(bid));
    return p && p.state === "settled" ? ` · <span class="bpay">paid — your hand</span>` : "";
  };
  const due = d => d == null || String(d).trim() === "" ? "" : ` · due ${esc(String(d))}`;
  const loans = (bd.loans||[]).map(l => {
    const done = !l.paid_off && l.original_balance > 0
      ? Math.max(0, Math.min(1, 1 - (l.balance||0)/l.original_balance)) : null;
    return `<div class="brow${l.paid_off ? " retired" : ""}" data-bt="loans" data-bid="${esc(l.id)}"
      data-bname="${esc(l.name)}" data-bfig="${l.payment || 0}" title="tap to edit this line">
      <div class="bn">${esc(l.name)}</div>
      <div class="bm">${l.paid_off ? "retired" : money(l.payment) + "<em>/mo</em>"}</div>
      <div class="bs">${l.paid_off ? "paid off — carried to zero"
        : `${money(l.balance)} still owed${l.apr ? ` · ${l.apr}% apr` : ""}${due(l.due_date)}${
            done != null ? ` · ${(done*100).toFixed(0)}% paid down` : ""}${st("loan", l.id)}${
            done != null ? `<div class="butil"><i style="width:${(done*100).toFixed(1)}%"></i></div>` : ""}`}</div>
    </div>`;}).join("") || `<p class="nodata">no loans on record</p>`;
  const cards = (bd.credit_cards||[]).map((c,ix) => {
    const util = c.credit_limit > 0 ? Math.min(1, (c.balance||0)/c.credit_limit) : null;
    return `<div class="brow" data-bt="credit_cards" data-bid="${esc(c.id)}"
      data-bname="${esc(c.name)}" data-bfig="${c.min_payment || 0}" title="tap to edit this line">
      <div class="bn"><span class="rank">${String(c.kill_priority ?? ix+1).padStart(2,"0")}</span>${esc(c.name)}</div>
      <div class="bm">${money(c.min_payment)}<em>/mo min</em></div>
      <div class="bs">${money(c.balance)}${c.credit_limit ? ` of ${money(c.credit_limit)}` : ""}${
        util != null ? ` · ${(util*100).toFixed(0)}% used` : ""}${c.apr ? ` · ${c.apr}% apr` : ""}${
        due(c.due_date)}${st("credit_card", c.id)}${
        util != null ? `<div class="butil"><i style="width:${(util*100).toFixed(1)}%"></i></div>` : ""}</div>
    </div>`;}).join("") || `<p class="nodata">no cards on record</p>`;
  const fixed = (bd.fixed_monthly||[]).map(f => `<div class="brow" data-bt="fixed_monthly"
      data-bid="${esc(f.id)}" data-bname="${esc(f.name)}" data-bfig="${f.amount || 0}"
      title="tap to edit this line">
      <div class="bn">${esc(f.name)}</div>
      <div class="bm">${money(f.amount)}<em>/mo</em></div>
      <div class="bs">${esc(f.category || "")}${due(f.due_date)}${st("fixed_monthly", f.id)}</div>
    </div>`).join("") || `<p class="nodata">nothing recurring on record</p>`;
  return `<div class="finscroll">
    <div class="panel" style="margin-bottom:10px">
      <div class="bhero">
        <div class="owe"><span>standing obligations</span><b>${money(T.monthly_total)}<em style="font:600 10px var(--mono);color:var(--etch)">/mo</em></b></div>
        <div><span>loans</span><b>${money(T.loans_monthly)}</b></div>
        <div><span>card minimums</span><b>${money(T.cards_monthly)}</b></div>
        <div><span>fixed monthly</span><b>${money(T.fixed_monthly)}</b></div>
        <div><span>debt carried</span><b>${money(T.debt_total)}</b></div></div>
      <div class="sfoot" style="margin-top:4px">reference — paying happens on the floor, by your
        hand · card minimums are floors, not prices · the gauge's nut stays the month's one
        line; this is the face sum of the standing obligations · cycle ${esc(bd.cycle_key || "")}</div></div>

function renderRoom(){
  if(ACTIVE === null) return;
  const o = D[ACTIVE], R = $("room");
  if(State.err && !State.standing){
    R.innerHTML = `<div class="panel" style="flex:1"><div class="gen">
      <div><div class="hotline">${esc(State.err)}</div>
      <div class="nodata" style="margin-top:10px">the spine did not answer</div></div></div></div>`;
    return;
  }
  /* KEEP HIS PLACE. Every write re-renders the room, and a re-render that
     scrolls back to the top throws away where he was working — drop an expense
     on the eleventh load and the answer arrives at the top of the page. The
     scroll position is his, not the render's. */
  const keep = [];
  R.querySelectorAll(".fin,.finbody,.exp,.lanes,.scroll,.rgrid").forEach(el => {
    if(el.scrollTop || el.scrollLeft)
      keep.push([el.className, el.scrollTop, el.scrollLeft]);
  });
  /* KEEP HIS HANDS TOO. An async render landing mid-type steals the focus
     and drops the Fold's keyboard — the caret is his, not the render's.
     Only inputs with ids can be handed back (2026-08-08, stops review). */
  const fo = document.activeElement;
  const foId = fo && R.contains(fo) && fo.id ? fo.id : null;
  const foSel = foId && fo.selectionStart != null
    ? [fo.selectionStart, fo.selectionEnd] : null;

  R.innerHTML = o.room === "standing" ? standingRoom()
    : o.room === "work" ? workRoom()
    : o.room === "radio" ? radioRoom()
    : o.room === "ledger" ? ledgerRoom()
    : o.room === "learn" ? learnRoom() : soulRoom();

  keep.forEach(([cls, top, left]) => {
    const el = R.querySelector("." + cls.split(" ")[0]);
    if(el){ el.scrollTop = top; el.scrollLeft = left; }
  });
  if(foId){
    const el = $(foId);
    if(el){
      el.focus({preventScroll: true});
      if(foSel && el.setSelectionRange)
        try{ el.setSelectionRange(foSel[0], foSel[1]); }catch(e){}
    }
  }
  if(o.room === "standing"){
    wireHsTabs();
    if(HS.view === "stops"){ wireStops(); }
    else { paintGauge(); wireFigs(); wireActs(); wireSnap(); wireScale(); }
  }
  if(o.room === "work"){ wireCards(); }
  if(o.room === "ledger"){ wireFin(); }
  if(o.room === "radio"){ wireKeyup(); markRead(); wireCapMedia(); wireLane(); }
  if(o.room === "soul"){
    /* stopPropagation is law on anything that opens/closes (ruled 08-03 after
       three bites of the menu-closer class) */
    R.querySelectorAll(".creed").forEach(el =>
      el.addEventListener("click", e => { e.stopPropagation();
        const b = el.querySelector(".cb"); b.hidden = !b.hidden; }));
    R.querySelectorAll(".soulFold").forEach(el =>
      el.addEventListener("click", e => { e.stopPropagation();
        soulToggle(el.dataset.tier); renderRoom(); }));
  }
}
