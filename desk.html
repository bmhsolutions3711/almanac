      }));
    const add = R.querySelector("#bgtAdd");
    add && add.addEventListener("click", ev => { ev.stopPropagation(); budgetAdd(ev); });
    return;
  }
  if(FIN.view !== "floor") return;

  /* the fold answers his tap — placed & marked rows tuck behind their count */
  const fold = R.querySelector("#pileFold");
  fold && fold.addEventListener("click", () => {
    FIN.pileOpen = !FIN.pileOpen;
    renderRoom();
  });
  /* the drag: one expense line, one load box, one write */
  R.querySelectorAll(".eline[draggable]").forEach(c => {
    c.addEventListener("dragstart", ev => {
      FIN.drag = c.dataset.txn; c.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", c.dataset.txn);
    });
    c.addEventListener("dragend", () => { c.classList.remove("dragging"); FIN.drag = null; });
  });
  /* RIGHT-CLICK ON ANY COLUMN ROW — "already accounted for" (2026-08-02).
     Some pasted rows are covered by a bill card he already dragged at pay
     time. The mark sinks the row and shrinks the pool; it never deletes —
     the column doubles as the running record of all transactions with their
     categories. Reversible from the same menu. */
  R.querySelectorAll(".exp .eline[data-txn]").forEach(c => {
    const route = ev => {
      ev.preventDefault();
      /* opening from a TAP: the window's click-closes-the-menu listener fires
         on this SAME click (the picker died as it was born, 2026-08-02) — the
         row's tap must not reach it */
      ev.stopPropagation();
      const t = ((State.fin.expenses||{}).transactions||[]).find(x => x.id === Number(c.dataset.txn));
      if(!t) return;
      /* a SPLIT row serves sheet_row null — hand the menu its first portion's
         load or every action 500s (panel finding, 2026-08-02) */
      if((t.placements||[]).length){
        openMove(ev, t.id, t.sheet_row != null ? t.sheet_row : t.placements[0].sheet_row);
        return;
      }
      openAcct(ev, t);
    };
    /* TAP IS THE GESTURE (Bryan, 2026-08-03: "not letting me drag or use the
       right click") — on the Fold there IS no HTML5 drag, and long-press on a
       draggable row feeds Chrome's drag ghost instead of the menu. The same
       menu right-click opens now opens on a plain tap; drag stays for the
       desk. A real drag suppresses the click, so the two never collide. */
    c.addEventListener("contextmenu", route);
    c.addEventListener("click", route);
  });
  /* the bills — his hand at pay time. A bill drags into MONTHLY and nowhere
     else; a load lane refuses it in words. */
  R.querySelectorAll(".nut .bill[draggable]").forEach(c => {
    c.addEventListener("dragstart", ev => {
      FIN.drag = `bill:${c.dataset.bt}:${c.dataset.bid}`; c.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", FIN.drag);
    });
    c.addEventListener("dragend", () => { c.classList.remove("dragging"); FIN.drag = null; });
  });
  R.querySelectorAll(".lane").forEach(z => {
    z.addEventListener("dragover", ev => { ev.preventDefault(); z.classList.add("over"); });
    z.addEventListener("dragleave", () => z.classList.remove("over"));
    z.addEventListener("drop", async ev => {
      ev.preventDefault(); z.classList.remove("over");
      const data = ev.dataTransfer.getData("text/plain") || FIN.drag;
      if(!data) return;
      if(String(data).startsWith("bill:")){
        const [, bt, bid] = String(data).split(":");
        if(z.dataset.row !== "monthly"){
          finSay("a bill lands in MONTHLY, not on a load — nothing was written", true);
          return;
        }
        await payMonthlyByHand(bt, bid, z);
        return;
      }
      if(z.dataset.row === "monthly") await payMonthly(Number(data), null, null, z);
      else await assignTxn(Number(data), Number(z.dataset.row), z);
    });
  });
  /* click something already in a box to take it back out; RIGHT-click to send
     it somewhere else without first putting it down */
  R.querySelectorAll(".lane .drop-in[data-txn]").forEach(p => {
    const lane = p.closest(".lane");
    const txn = Number(p.dataset.txn);
    const from = lane.dataset.row === "monthly" ? null : Number(lane.dataset.row);
    p.addEventListener("click", () => {
      if(from == null) return;                 // monthly rows are settled, not placed
      movePlacement(txn, from, null, lane);
    });
    p.addEventListener("contextmenu", ev => { ev.preventDefault(); openMove(ev, txn, from); });
  });

  /* THE STAB. The machine fills the sheet in; he checks it. Both are one call
     and both are reversible — 'clear the machine's' never touches a placement
     he made by hand. */
  const stab = async (path, verb) => {
    const b = R.querySelector("#placeAll"), c = R.querySelector("#clearAuto");
    [b,c].forEach(x => x && (x.disabled = true));
    try{
      const r = await fetch(url(path), {method:"POST",
        headers:{...hdr(), "Content-Type":"application/json"},
        body: JSON.stringify({period: FIN.period})});
      const out = await r.json().catch(() => ({}));
      if(!r.ok){ finSay(out.error || `the spine refused (${r.status})`, true); return; }
      await loadFin(); renderRoom();
      finSay(out.cleared != null
        ? `${out.cleared} machine placements cleared — yours untouched`
        : `${verb} ${out.written} rows across ${out.txns_placed} transactions · ${
            out.split_txns} split across loads${
            out.kept_manual ? ` · ${out.kept_manual} of yours kept` : ""}${
            out.skipped && out.skipped.length ? ` · ${out.skipped.length} left alone` : ""}`,
        false);
    }catch(err){ finSay("the spine did not answer — nothing was written: " + (err.message||err), true); }
    finally{ [b,c].forEach(x => x && (x.disabled = false)); }
  };
  const pa = R.querySelector("#placeAll"), ca = R.querySelector("#clearAuto");
  pa && pa.addEventListener("click", () => stab("/api/fin/place", "placed"));
  ca && ca.addEventListener("click", () => stab("/api/fin/place/clear", "cleared"));

  /* an arrived bank row at the top of the bucket — his tap asks which bill */
  R.querySelectorAll(".lane.monthly .drop-in.arr").forEach(p =>
    p.addEventListener("click", () =>
      payMonthly(Number(p.dataset.arr), null, null, p.closest(".lane"))));
  /* the monthly box asked which bill; his tap is the answer and the write */
  R.querySelectorAll(".lane.monthly .acand").forEach(b =>
    b.addEventListener("click", () => {
      if(b.classList.contains("cancel")){ FIN.ask = null; renderRoom(); return; }
      payMonthly(Number(b.dataset.txn), b.dataset.bt, b.dataset.bid, b.closest(".lane"));
    }));
}

/* A drop on MONTHLY asserts a bill was paid. Same refusal doctrine as every
   other write here — but with a third outcome the load boxes do not have: the
   spine can come back and ASK. A 409 is not a failure, it is the machine
   refusing to guess which bill this was; the box then shows the candidates and
   his tap becomes the write. Nothing is recorded until he answers. */
/* THE MOVE MENU — Bryan, 2026-07-29: "a right click option to move an expense
   to another load...monthly at top and then most adjacent loads."

   MONTHLY sits at the top because it is the other KIND of answer: this was not
   a road cost for a load at all, it was a bill. Under it the loads are ordered
   by how many days separate the expense from the delivery, because the load he
   means is nearly always the one he was running that day — the ordering does
   the remembering so he does not have to. The list is served, not sorted here. */
let MOVEMENU = null;
/* THE CATEGORY PICKER — the books' tap-to-edit chip (2026-08-02: "categories
   need to be editable from books...same categories as bik"). The vocabulary
   is SERVED (/api/fin/categories = bik's canon ∪ the ledger); the write goes
   through the one writer, which learns a rule so this merchant's next
   arrival categorizes itself. */
async function openCat(ev, t){
  closeMove();
  if(!State.fin.cats){
    try{ State.fin.cats = (await grab("/api/fin/categories")).categories || []; }
    catch(e){ finSay("the spine has no category list: " + (e.message||e), true); return; }
  }
  const m = document.createElement("div");
  m.className = "movemenu cats";
  m.innerHTML =
    `<div class="mh">${esc(t.merchant || t.description || "this")} · ${money(t.amount)}
       <span>${esc(t.category || "uncategorized")}</span></div>` +
    State.fin.cats.map(c => `<button class="mi${c === t.category ? " on" : ""}"
        data-cat="${esc(c)}"><span>${esc(c)}</span>${
        c === t.category ? "<i>it is this now</i>" : ""}</button>`).join("") +
    `<button class="mi off" data-cat="">never mind</button>`;
  document.body.appendChild(m);
  MOVEMENU = m;
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(6, Math.min(ev.clientX, innerWidth - w - 6)) + "px";
  m.style.top = Math.max(6, Math.min(ev.clientY, innerHeight - h - 6)) + "px";
  m.querySelectorAll(".mi").forEach(b => b.addEventListener("click", async () => {
    const cat = b.dataset.cat;
    closeMove();
    if(!cat || cat === t.category) return;
    try{
      const r = await fetch(url("/api/fin/categorize"), {method:"POST",
        headers:{...hdr(), "Content-Type":"application/json"},
        body: JSON.stringify({txn_id: t.id, category: cat})});
      const out = await r.json().catch(() => ({}));
      if(!r.ok){ finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true); return; }
      await loadFin(); renderRoom();
      finSay(`${t.merchant || "row"} → ${cat}${out.learned ? " · the rules learned it" : ""}`, false);
    }catch(e){ finSay("the spine did not answer — nothing was written: " + (e.message||e), true); }
  }));
}

/* the row menu — right-click on an unplaced row (2026-08-02: "give the last 4
   loads on right click to send to a specific load"). MONTHLY first when the
   row looks like a bill's bank row, then the four loads nearest the expense's
   own date (cross-month — an Aug-2 fuel stop usually belongs to a July load),
   then the accounted mark and its undo. Every action is a producer write and
   refuses in the spine's words when the ruling excludes it. */
async function openAcct(ev, t){
  closeMove();
  const m = document.createElement("div");
  m.className = "movemenu";
  m.innerHTML = `<div class="mh">loading…</div>`;
  document.body.appendChild(m);
  MOVEMENU = m;
  const place = () => {
    const w = m.offsetWidth, h = m.offsetHeight;
    m.style.left = Math.max(6, Math.min(ev.clientX, innerWidth - w - 6)) + "px";
    m.style.top = Math.max(6, Math.min(ev.clientY, innerHeight - h - 6)) + "px";
  };
  place();
  let loads = [];
  try{
    const r = await fetch(url("/api/fin/move/targets"), {method:"POST",
      headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id: t.id})});
    const d = await r.json().catch(() => ({}));
    if(r.ok) loads = (d.loads || []).slice(0, 5);
  }catch(e){ /* the menu still offers the mark — loads just stay absent */ }
  m.innerHTML =
    `<div class="mh">${esc(t.merchant || t.description || "this")} · ${money(t.amount)}
       <span>${esc(t.date)}</span></div>` +
    (t.monthly_candidate
      ? `<button class="mi monthly" data-act="monthly">MONTHLY<i>say which bill this paid</i></button>` : "") +
    (loads.length ? `<div class="msep">the last loads, nearest this date</div>` +
      loads.map(l => `<button class="mi" data-act="load" data-row="${l.sheet_row}">
        <span>${esc(l.pickup_city || "?")} &rarr; ${esc(l.delivery_city || "?")}${
          l.delivery_state ? ", " + esc(l.delivery_state) : ""}</span>
        <i>${l.days_away === 0 ? "same day" :
            l.days_away === 1 ? "1 day away" : l.days_away + " days away"} · ${
            esc(l.delivery_date || "")}${l.broker ? " · " + esc(l.broker) : ""}</i></button>`).join("") : "") +
    (t.trip_direct && loads.length >= 2
      ? `<button class="mi" data-act="split">split across these loads
          <i>one draft, several fill-ups — checkboxes decide, equal shares to the penny</i></button>` : "") +
    (t.accounted
      ? `<button class="mi" data-act="off">take it back into the pile<i>it will count as work again</i></button>`
      : `<button class="mi" data-act="on">already accounted for<i>a card covers it — it stays in the record, marked</i></button>`) +
    (t.deposit
      ? `<button class="mi" data-act="dep-off">not a deposit<i>count it as spend again</i></button>`
      : `<button class="mi" data-act="dep-on">deposit — wait for the refund<i>parked with the hotel; it comes back and the pair cancels</i></button>`) +
    `<button class="mi off" data-act="x">never mind</button>`;
  place();
  m.querySelectorAll(".mi").forEach(b => b.addEventListener("click", async ev => {
    const act = b.dataset.act, row = b.dataset.row;
    if(act === "split"){
      /* the menu LIVES ON as the checkbox panel — this click must not reach
         the window's menu-closer (the picker died as it was born, third time) */
      ev.stopPropagation();
      splitPanel(m, t, loads, place);
      return;
    }
    closeMove();
    if(act === "x") return;
    if(act === "monthly") return payMonthly(t.id, null, null, null);
    if(act === "load") return assignTxn(t.id, Number(row), null);
    if(act === "dep-on" || act === "dep-off"){
      try{
        const r = await fetch(url("/api/fin/deposit"), {method:"POST",
          headers:{...hdr(), "Content-Type":"application/json"},
          body: JSON.stringify({txn_id: t.id, on: act === "dep-on"})});
        const out = await r.json().catch(() => ({}));
        if(!r.ok){ finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true); return; }
        await loadFin(); renderRoom();
        finSay(act === "dep-on"
          ? `${out.merchant || "row"} flagged as a deposit — watching for the refund`
          : `${out.merchant || "row"} counts as spend again`, false);
      }catch(e){ finSay("the spine did not answer — nothing was written: " + (e.message||e), true); }
      return;
    }
    try{
      const r = await fetch(url("/api/fin/accounted"), {method:"POST",
        headers:{...hdr(), "Content-Type":"application/json"},
        body: JSON.stringify({txn_id: t.id, on: act === "on"})});
      const out = await r.json().catch(() => ({}));
      if(!r.ok){ finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true); return; }
      await loadFin(); renderRoom();
      finSay(act === "on"
        ? `${out.merchant || "row"} marked already accounted for — it stays in the record`
        : `${out.merchant || "row"} is back in the pile`, false);
    }catch(e){ finSay("the spine did not answer — nothing was written: " + (e.message||e), true); }
  }));
}

/* THE SPLIT PANEL — Bryan, 2026-08-04: "i have a deal with pilot to pay for my
   fill ups twice a week... be presented with the last 5 loads and have check
   boxes to split between." One draft, several loads' fuel: check the loads it
   fueled and the whole divides in equal shares to the penny — the last share
   absorbs the rounding, so the parts always sum to exactly what left the
   account. The writer (split_manual) refuses invented money regardless. */
function splitPanel(m, t, loads, place){
  const whole = Math.abs(t.amount);
  m.innerHTML = `<div class="mh">${esc(t.merchant || t.description || "this")} · ${money(whole)}
      <span>check the loads this draft fueled — equal shares, to the penny</span></div>
    ${loads.map(l => `<label class="srow">
      <input type="checkbox" data-row="${l.sheet_row}">
      <span>${esc(l.pickup_city || "?")} &rarr; ${esc(l.delivery_city || "?")}${
        l.delivery_state ? ", " + esc(l.delivery_state) : ""}
        <i>${esc(l.delivery_date || "")}${l.broker ? " · " + esc(l.broker) : ""}</i></span>
      <b class="samt">—</b></label>`).join("")}
    <button class="mi msplit" disabled>check at least two loads</button>
    <button class="mi off" data-act="x">never mind</button>`;
  place();
  m.querySelector('[data-act="x"]').addEventListener("click", closeMove);
  const boxes = [...m.querySelectorAll('input[type="checkbox"]')];
  const btn = m.querySelector(".msplit");
  const shares = () => {
    const on = boxes.filter(b => b.checked), n = on.length;
    const base = n ? Math.floor(whole / n * 100) / 100 : 0;
    return {on, n, base, last: n ? Math.round((whole - base * (n - 1)) * 100) / 100 : 0};
  };
  const recalc = () => {
    const {on, n, base, last} = shares();
    boxes.forEach(b => {
      const el = b.closest(".srow").querySelector(".samt");
      el.textContent = b.checked
        ? money(on.indexOf(b) === n - 1 ? last : base) : "—";
    });
    btn.disabled = n < 2;
    btn.textContent = n < 2 ? "check at least two loads"
      : `split ${money(whole)} across ${n} loads`;
  };
  boxes.forEach(b => b.addEventListener("change", recalc));
  recalc();
  btn.addEventListener("click", async () => {
    const {on, n, base, last} = shares();
    if(n < 2) return;
    const parts = on.map((b, i) => ({sheet_row: Number(b.dataset.row),
                                     amount: i === n - 1 ? last : base}));
    closeMove();
    try{
      const r = await fetch(url("/api/fin/split"), {method:"POST",
        headers:{...hdr(), "Content-Type":"application/json"},
        body: JSON.stringify({txn_id: t.id, parts})});
      const out = await r.json().catch(() => ({}));
      if(!r.ok){ finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true); return; }
      await loadFin(); renderRoom();
      finSay(`${t.merchant || "the draft"} split ${n} ways — ${money(whole)} across the loads`, false);
    }catch(e){
      finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    }
  });
}

async function openMove(ev, txn_id, from_row){
  closeMove();
  const m = document.createElement("div");
  m.className = "movemenu";
  m.innerHTML = `<div class="mh">loading…</div>`;
  document.body.appendChild(m);
  MOVEMENU = m;
  const place = () => {
    const w = m.offsetWidth, h = m.offsetHeight;
    m.style.left = Math.max(6, Math.min(ev.clientX, innerWidth - w - 6)) + "px";
    m.style.top = Math.max(6, Math.min(ev.clientY, innerHeight - h - 6)) + "px";
  };
  place();
  let d;
  try{
    const r = await fetch(url("/api/fin/move/targets"), {method:"POST",
      headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id, period: FIN.period})});
    d = await r.json();
    if(!r.ok) throw new Error(d.error || `the spine refused (${r.status})`);
  }catch(err){
    m.innerHTML = `<div class="mh bad">${esc(err.message || String(err))}</div>`;
    place(); return;
  }
  const t = d.txn;
  m.innerHTML =
    `<div class="mh">${esc(t.merchant || "this")} · ${money(t.amount)}
       <span>${esc(t.date)}</span></div>` +
    `<button class="mi monthly" data-to="monthly">MONTHLY<i>a bill, not a load's road cost</i></button>` +
    `<div class="msep">the loads, nearest first</div>` +
    (d.loads || []).map(l =>
      `<button class="mi" data-to="${l.sheet_row}"${
        l.sheet_row === from_row ? ' disabled' : ''}>
        <span>${esc(l.pickup_city || "?")} &rarr; ${esc(l.delivery_city || "?")}${
          l.delivery_state ? ", " + esc(l.delivery_state) : ""}</span>
        <i>${l.days_away === 0 ? "same day" :
            l.days_away === 1 ? "1 day away" : l.days_away + " days away"} · ${
            esc(l.delivery_date || "")}${l.broker ? " · " + esc(l.broker) : ""}${
            l.sheet_row === from_row ? " · it is here now" : ""}</i></button>`).join("") +
    `<button class="mi off" data-to="off">take it off — back to the column</button>`;
  place();
  m.querySelectorAll(".mi").forEach(b => b.addEventListener("click", () => {
    const to = b.dataset.to;
    closeMove();
    if(to === "monthly") return payMonthly(txn_id, null, null, null);
    movePlacement(txn_id, from_row, to === "off" ? null : Number(to), null);
  }));
}
function closeMove(){ if(MOVEMENU){ MOVEMENU.remove(); MOVEMENU = null; } }
addEventListener("click", e => { if(MOVEMENU && !MOVEMENU.contains(e.target)) closeMove(); });
addEventListener("keydown", e => { if(e.key === "Escape") closeMove(); });

/* Moving carries the PORTION, not the transaction — the $22.09 that landed on
   Axle moves as $22.09 and the other five portions of that Pilot week stay put.
   Same refusal doctrine as every write here. */
async function movePlacement(txn_id, from_row, to_row, box){
  const card = $("room").querySelector(`.eline[data-txn="${txn_id}"]`);
  card && card.classList.add("writing");
  try{
    const r = await fetch(url("/api/fin/move"), {method:"POST",
      headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id, from_row, to_row})});
    const out = await r.json().catch(() => ({}));
    if(!r.ok){
      card && (card.classList.remove("writing"), card.classList.add("refused"));
      box && (box.classList.add("deny"), setTimeout(() => box.classList.remove("deny"), 1400));
      finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true);
      setTimeout(() => card && card.classList.remove("refused"), 1400);
      return false;
    }
    await loadFin(); renderRoom();
    finSay(out.to == null
      ? `${money(out.amount)} taken off load ${out.from} — back in the column`
      : `${money(out.amount)} moved from load ${out.from} to load ${out.to}`, false);
    return true;
  }catch(e){
    card && (card.classList.remove("writing"), card.classList.add("refused"));
    finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    setTimeout(() => card && card.classList.remove("refused"), 1400);
    return false;
  }
}

/* HIS HAND, AT PAY TIME — he pays the bill in the real world and drags the
   BILL across the moment it happens; the bank row is often days from import.
   Same endpoint, no transaction: a named bill and his gesture. The bucket
   reads "awaiting the bank row" until the row lands — then dropping it on
   MONTHLY attaches it as the evidence. */
async function payMonthlyByHand(bill_type, bill_id, box){
  try{
    const r = await fetch(url("/api/fin/monthly"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({bill_type, bill_id})});
    const out = await r.json().catch(() => ({}));
    if(!r.ok){
      box && (box.classList.add("deny"), setTimeout(() => box.classList.remove("deny"), 1400));
      finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true);
      return false;
    }
    await loadFin();
    try{ State.standings = await grab("/api/standings"); }catch(_){}
    renderRoom();
    finSay(out.already
      ? `${out.name} was already recorded paid for ${out.cycle_key}`
      : `${out.name} recorded paid for ${out.cycle_key}${
          out.amount != null ? ` — ${money(out.amount)}` : ""} · drag its bank row in when it lands`, false);
    return true;
  }catch(e){
    finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    return false;
  }
}

async function payMonthly(txn_id, bill_type, bill_id, box){
  const card = $("room").querySelector(`.eline[data-txn="${txn_id}"]`);
  card && card.classList.add("writing");
  try{
    const r = await fetch(url("/api/fin/monthly"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id, bill_type, bill_id})});
    const out = await r.json().catch(() => ({}));
    if(r.status === 409 && out.ask){
      FIN.ask = {txn: out.txn, candidates: out.candidates, no_match: out.no_match};
      card && card.classList.remove("writing");
      renderRoom();
      finSay(out.no_match
        ? `no bill matches that row — the full list is up, name it yourself`
        : `which bill did this pay? nothing recorded yet`, "ask");
      return false;
    }
    if(!r.ok){
      card && (card.classList.remove("writing"), card.classList.add("refused"));
      box && (box.classList.add("deny"), setTimeout(() => box.classList.remove("deny"), 1400));
      finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true);
      setTimeout(() => card && card.classList.remove("refused"), 1400);
      return false;
    }
    FIN.ask = null;
    await loadFin();
    try{ State.standings = await grab("/api/standings"); }catch(_){}
    renderRoom();
    /* evidenced:false is the spine saying the PAYMENT was recorded but the
       evidence join was not — the one thing this drag exists to persist. A
       clean "recorded paid" here would swallow a failed write, and the bucket
       would then read "recorded without a bank row" about a row he just
       dragged. Loud, in red, with the true split: payment yes, evidence no. */
    if(out.evidenced === false && !out.already){
      finSay(`${out.name} recorded paid for ${out.cycle_key} — but saving WHICH `
        + `bank row paid it FAILED. the bucket will not show the evidence; `
        + `drop the row on it again to retry`, true);
      return true;
    }
    /* additive evidence: the second ACH debit lands as "2 bank rows now carry
       669.65 of 700.00" — coverage said out loud, drift left visible */
    const cover = out.evidence_n > 1 && out.covered != null
      ? ` · ${out.evidence_n} bank rows now carry ${money(out.covered)}${
          out.due != null ? " of " + money(out.due) : ""}`
      : "";
    finSay(out.already
      ? (out.evidenced
          ? `bank row attached — ${out.name} already recorded paid for ${out.cycle_key}${cover}`
          : `${out.name} was already recorded paid for ${out.cycle_key}`)
      : `${out.name} recorded paid for ${out.cycle_key} — ${money(out.amount)}${cover}`, false);
    return true;
  }catch(e){
    card && (card.classList.remove("writing"), card.classList.add("refused"));
    finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    setTimeout(() => card && card.classList.remove("refused"), 1400);
    return false;
  }
}

async function assignTxn(txn_id, sheet_row, box){
  const card = $("room").querySelector(`.eline[data-txn="${txn_id}"]`);
  card && card.classList.add("writing");
  try{
    const r = await fetch(url("/api/fin/assign"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({txn_id, sheet_row})});
    const out = await r.json().catch(() => ({}));
    if(!r.ok){
      /* REFUSED — nothing was written. Say so in the spine's words and leave
         the card standing exactly where it was. */
      card && (card.classList.remove("writing"), card.classList.add("refused"));
      box && (box.classList.add("deny"), setTimeout(() => box.classList.remove("deny"), 1400));
      finSay(out.error || `the spine refused (${r.status}) — nothing was written`, true);
      setTimeout(() => card && card.classList.remove("refused"), 1400);
      return false;
    }
    /* say it AFTER the re-render, or the confirmation is wiped by the very
       repaint that proves it — a write nobody saw reads as a write that did
       not happen */
    await loadFin(); renderRoom();
    finSay(sheet_row == null
      ? `${out.category} ${money(out.amount)} taken back off the load`
      : `${out.category} ${money(out.amount)} attributed to load ${out.sheet_row}`, false);
    return true;
  }catch(e){
    card && (card.classList.remove("writing"), card.classList.add("refused"));
    finSay("the spine did not answer — nothing was written: " + (e.message||e), true);
    setTimeout(() => card && card.classList.remove("refused"), 1400);
    return false;
  }
}

/* THREE states, because two was a lie. The monthly box can come back ASKING —
   nothing written, nothing refused — and stamping that "WRITTEN" put the one
   word that means a record exists on top of the sentence "nothing recorded
   yet". On a money surface that is the worst available defect. Pass "ask" for
   the question, true for a refusal, false for a real write. */
function finSay(msg, state){
  const w = $("room").querySelector(".why");
  if(!w) return;
  const tag = state === "ask" ? "ASKING" : state ? "REFUSED" : "WRITTEN";
  w.innerHTML = `<span class="tag">${tag}</span><span>${esc(msg)}</span>`;
}

/* ── the intake: same doors bik has, new mouth ─────────────────────── */
function wireIntake(){
  const csv = $("dropCsv"), shot = $("dropShot");
  if(csv){
    const pick = () => {
      const i = document.createElement("input");
      i.type = "file"; i.accept = ".csv,text/csv";
      i.onchange = () => i.files[0] && sendCsv(i.files[0]);
      i.click();
    };
    csv.addEventListener("click", pick);
    csv.addEventListener("dragover", e => { e.preventDefault(); csv.classList.add("over"); });
    csv.addEventListener("dragleave", () => csv.classList.remove("over"));
    csv.addEventListener("drop", e => {
      e.preventDefault(); csv.classList.remove("over");
      const f = e.dataTransfer.files[0]; if(f) sendCsv(f);
    });
  }
  if(shot){
    /* WHOSE IMAGE IS THIS — his hand names the account before the paste
       (2026-08-04: "we will need to pull all pending in the future" — LoadPay
       pendings ride the same paste lane, and a pending mislabeled pnc would
       settle under the wrong account forever). The picker's tap must not
       reach the well's click-to-listen. */
    shot.querySelectorAll(".acctpick button").forEach(b =>
      b.addEventListener("click", ev => {
        ev.stopPropagation();
        FIN.shotAcct = b.dataset.acct;
        shot.querySelectorAll(".acctpick button").forEach(x =>
          x.classList.toggle("on", x === b));
      }));
    shot.addEventListener("click", () => shot.classList.add("listening"));
    shot.addEventListener("dragover", e => { e.preventDefault(); shot.classList.add("over"); });
    shot.addEventListener("dragleave", () => shot.classList.remove("over"));
    shot.addEventListener("drop", e => {
      e.preventDefault(); shot.classList.remove("over");
      const f = e.dataTransfer.files[0];
      if(f && f.type.startsWith("image/")) fileToDataUrl(f).then(sendShot);
    });
    document.addEventListener("paste", finPaste);
  }
}
function finPaste(e){
  const shot = $("dropShot"); if(!shot || FIN.view !== "ledger") return;
  for(const it of (e.clipboardData || {}).items || []){
    if(it.type.startsWith("image/")){
      const f = it.getAsFile();
      if(f){ e.preventDefault(); fileToDataUrl(f).then(sendShot); }
      return;
    }
  }
}
const fileToDataUrl = f => new Promise((res,rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej;
  r.readAsDataURL(f);
});
function dropState(el, cls, msg, sub){
  el.className = "drop " + cls;
  el.querySelector(".dl").textContent = msg;
  if(sub != null) el.querySelector(".ds").textContent = sub;
}
async function sendCsv(file){
  const el = $("dropCsv");
  /* The source decides which parser runs. Guessing it would silently mangle a
     LoadPay export through the PNC reader, so it is READ from the file's own
     header rather than assumed. */
  const text = await file.text();
  const head = (text.split("\n")[0] || "").toLowerCase();
  const source = head.includes("transaction id") || /loadpay/i.test(file.name) ? "loadpay"
               : /pnc|account\s*activity/i.test(file.name) || head.includes("balance") ? "pnc" : null;
  if(!source){
    dropState(el, "bad", "cannot tell which bank this is",
      "name it LoadPay… or PNC… — the parsers are not interchangeable");
    return;
  }
  dropState(el, "busy", `importing ${source}…`, file.name);
  try{
    const r = await fetch(url("/api/fin/intake/csv"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({source, csv:text, account:source})});
    const o = await r.json().catch(() => ({}));
    if(!r.ok){ dropState(el,"bad","not imported", o.error || `the writer said ${r.status}`); return; }
    dropState(el, "ok", `${o.imported||0} in · ${o.skipped||0} already had`,
      `${o.reconciled||0} settled from pending · ${o.uncategorized||0} uncategorized`);
    await loadFin(); renderRoom();
  }catch(e){ dropState(el,"bad","nothing was imported", String(e.message||e)); }
}
async function sendShot(dataUrl){
  const el = $("dropShot");
  dropState(el, "busy", "reading the image…", "balance first, then transactions");
  try{
    /* Try it as a BALANCE first — that is the common case and it updates the
       cash line the clock reads. If the image has none, fall through to the
       transaction reader rather than telling him it failed. */
    let r = await fetch(url("/api/fin/intake/balance"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({image:dataUrl, account:"loadpay"})});
    let o = await r.json().catch(() => ({}));
    /* The reader answers {ok, extracted:{accounts:[...]}} (or the old
       single-account {balance,...}). Checking the WRONG keys here made a
       SUCCESSFUL balance write fall through to the transaction reader and
       report "nothing found" about balances already saved (2026-08-02 —
       Bryan's PNC paste landed while the surface said it hadn't). */
    const got = (o.extracted && (o.extracted.accounts
                 || (o.extracted.total_balance != null || o.extracted.balance != null
                     ? [o.extracted] : []))) || [];
    if(r.ok && (o.ok || o.updated) && got.length){
      dropState(el, "ok", `balances read — ${got.length} account${got.length===1?"":"s"}`,
        got.map(a => (a.account_name || a.name || "account")
          + (a.total_balance != null ? " " + money(a.total_balance)
             : a.balance != null ? " " + money(a.balance) : "")).join(" · ").slice(0,90));
      await loadFin(); renderRoom(); return;
    }
    r = await fetch(url("/api/fin/intake/screenshot"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({image:dataUrl, account: FIN.shotAcct || "pnc"})});
    o = await r.json().catch(() => ({}));
    const txns = o.transactions || [];
    if(!r.ok || !txns.length){
      dropState(el,"bad","nothing was read", o.error || "no transactions found in that image");
      return;
    }
    /* the chip's account rides the SAVE too — the runner stamps every row with
       this value, and a hardcoded pnc here filed a LoadPay paste under the
       wrong book (caught 2026-08-04 before it bit) */
    const s = await fetch(url("/api/fin/intake/save-screenshot"), {
      method:"POST", headers:{...hdr(), "Content-Type":"application/json"},
      body: JSON.stringify({transactions:txns, account: FIN.shotAcct || "pnc"})});
    const so = await s.json().catch(() => ({}));
    if(!s.ok){ dropState(el,"bad","read but not saved", so.error || `the writer said ${s.status}`); return; }
    dropState(el, "ok", `${so.saved||0} saved · ${so.skipped||0} already had`,
      `${txns.length} rows read from the image`);
    await loadFin(); renderRoom();
  }catch(e){ dropState(el,"bad","nothing was saved", String(e.message||e)); }
}

/* ── THE HOLD: drag to read — paying happens on the floor ──────────── */
function wireHold(){
  const cv = $("holdC"); if(!cv) return;
  const hit = ev => {
    const r = cv.getBoundingClientRect();
    const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const y = (ev.touches ? ev.touches[0].clientY : ev.clientY) - r.top;
    return (State.fin.placed||[]).find(p =>
      Math.hypot(p.cx - x, p.cy - y) <= p.R + 3);
  };
  const read = ev => {
    const p = hit(ev);
    if(p && FIN.pick !== p.s.id){ FIN.pick = p.s.id; paintHold(); showStone(p.s); }
  };
  cv.addEventListener("pointerdown", read);
  cv.addEventListener("pointermove", e => { if(e.buttons) read(e); });
}

function showStone(s){
  const w = $("holdW"); if(!w) return;
  w.querySelector(".hcard")?.remove();
  const el = document.createElement("div");
  el.className = "hcard";
  el.innerHTML = `<div class="hn">${esc(s.title)}</div>
    <div class="ha">${s.amount == null ? "——" : money(s.amount)}</div>
    <div class="hs">${esc(s.sub || "")}${s.next_due ? " · next " + esc(s.next_due) : ""}</div>
    <div class="hb"><span class="cap">${s.state === "settled"
        ? "paid — it sits in the monthly bucket on the floor"
        : "paid on the floor — drag the bill into MONTHLY as you pay it"}</span>
      <button class="btn" id="stoneClose">close</button></div>`;
  w.appendChild(el);
  $("stoneClose").addEventListener("click", () => { el.remove(); FIN.pick = null; paintHold(); });
}

/* The hold-to-settle latch lived here until 2026-08-01. It recorded a bill paid
   on Bryan's word alone — no bank row — and he retired that: "we replace the
   old way of tracking payment of monthly expenses." The ONE way a bill is now
   recorded paid on this desk is the floor's evidence join: drag the bank row
   that paid it into MONTHLY. The hold remains what it is good at — reading the
   month's weight. */

/* ── the room's own fetches ────────────────────────────────────────── */
async function loadFin(){
  /* the last fetch wins, not the last to ARRIVE — the books' month-snap can
     fire while a week fetch is in flight, and the stale answer must not
     overwrite the fresh one (panel finding, 2026-08-02) */
  const seq = FIN._seq = (FIN._seq || 0) + 1;
  const q = `?period=${FIN.period}`;
  const [sum, ld, ex, ro, ac, sp, bd] = await Promise.allSettled([
    grab("/api/fin/summary"), grab("/api/fin/loads"+q),
    grab("/api/fin/expenses"+q), grab("/api/fin/rollup"+q),
    grab("/api/fin/accounts"), grab("/api/fin/spend"+q),
    grab("/api/fin/budget")]);
  if(seq !== FIN._seq) return;               // a newer fetch superseded this one
  State.fin.spend = sp.status === "fulfilled" ? sp.value : null;
  State.fin.budget = bd.status === "fulfilled" ? bd.value : null;
  State.fin.summary = sum.status === "fulfilled" ? sum.value : null;
  State.fin.summaryErr = sum.status === "rejected" ? String(sum.reason.message||sum.reason) : null;
  State.fin.loads = ld.status === "fulfilled" ? ld.value : null;
  State.fin.expenses = ex.status === "fulfilled" ? ex.value : null;
  State.fin.rollup = ro.status === "fulfilled" ? ro.value : null;
  State.fin.accounts = ac.status === "fulfilled" ? ac.value : null;
  State.fin.acctErr = ac.status === "rejected" ? String(ac.reason.message||ac.reason) : null;
  State.fin.err = [ld,ex,ro].filter(x => x.status === "rejected")
    .map(x => String(x.reason.message||x.reason))[0] || null;
  /* A mirror nobody refreshed reads as "booked ahead $0.00" on a day three
     loads were booked (2026-07-28). Ask MI to refresh, then re-read. */
  const st = State.fin.loads && State.fin.loads.mirror_stale_hours;
  if(st != null && st > 6 && !State.fin._refreshed){
    State.fin._refreshed = true;
    try{
      await fetch(url("/api/fin/loads/refresh"), {method:"POST", headers:hdr()});
      const again = await grab("/api/fin/loads"+q); State.fin.loads = again;
      const ro2 = await grab("/api/fin/rollup"+q); State.fin.rollup = ro2;
    }catch(e){}
  }
}

/* ── load ─────────────────────────────────────────────────────────── */
async function grab(path){
  const r = await fetch(url(path), { headers: hdr(), cache:"no-store" });
  if(!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0,120));
  return r.json();
}
async function load(keep){
  try{
    const [st, sd, bd] = await Promise.all([
      grab("/api/standing"), grab("/api/standings"), grab("/api/board")]);
    State.standing = st; State.standings = sd; State.board = bd; State.err = null;
    State.at = new Date();
    /* the rest are not worth failing the desk over */
    const rest = [
      ["radio","/api/messages"], ["learn","/api/learning"], ["soul","/api/doctrine"],
      ["held","/api/push/held"], ["watch","/api/watch"], ["hotshot","/api/hotshot"]
    ];
    await Promise.all(rest.map(([k,p]) =>
      grab(p).then(v => { State[k] = v; }).catch(() => {})));
    /* the money room's own reads — never allowed to fail the desk */
    await loadFin().catch(() => {});
    deriveTemp(); paintField(); stampRead();
    if(ACTIVE !== null) renderRoom();
  }catch(e){
    State.err = String(e.message || e);
    deriveTemp();
    $("cq").textContent = "The spine did not answer.";
    $("crz").textContent = State.err;
    if(!configured()) showConnect();
    else showConnect("could not reach the spine — if you are away from home, check Tailscale first");
  }
}
/* NOTHING RE-READS BEHIND HIS BACK. Bryan, 2026-07-29: "the dial keeps
   resetting and bringing me to the top... should load on bringing up the page
   and only update if i refresh."

   The 30s poll and the focus re-read both called load() -> renderRoom(), which
   rebuilds the room: scroll jumps to the top and the needle re-swings from
   zero. Mid-way through placing an expense that is not freshness, it is the
   floor moving under his hands.

   The staleness this replaced is still handled, and more honestly: the READ
   stamp always says when the page last heard from the spine and turns hot past
   four minutes, and it is a BUTTON — his tap pulls the Load Log and re-reads.
   A surface that says how old it is beats one that silently reloads itself. */
let REFRESH = 0;
function startRefresh(){ clearInterval(REFRESH); }   /* deliberately does nothing */

/* THE LOAD LOG LIVES IN A SHEET, and insights.db only mirrors it when someone
   asks. Before this, the ask happened only when the MI app was opened — so a
   load booked in the sheet could be invisible to every surface for days. The
   spine proxies the ask (MI stays the sole writer). We do it on OPEN and on
   DEMAND, never on the 30s tick: that call reaches out to Google, and polling
   it would be rude to a service we do not own. */
async function pullLoadLog(){
  try{
    const r = await fetch(url("/api/fin/loads/refresh"), { method:"POST",
      headers: hdr({"Content-Type":"application/json"}), body:"{}" });
    if(!r.ok) return false;
    return true;
  }catch(e){ return false; }
}
async function refreshNow(){
  const el = $("readstamp");
  if(el){ el.textContent = "PULLING THE LOAD LOG…"; el.classList.remove("stale"); }
  const pulled = await pullLoadLog();
  await load(true);
  if(!pulled) toast("the load log did not answer — showing the local mirror");
}
addEventListener("pagehide", () => clearInterval(REFRESH));

function stampRead(){
  const el = $("readstamp"); if(!el) return;
  if(State.err){ el.textContent = "SPINE UNREACHABLE"; el.classList.add("stale"); return; }
  if(!State.at){ el.textContent = ""; return; }
  const secs = Math.round((Date.now() - State.at.getTime())/1000);
  el.classList.toggle("stale", secs > 240);
  el.textContent = "READ " + State.at.toLocaleTimeString("en-US",
    {hour:"numeric", minute:"2-digit"});
}
setInterval(stampRead, 20000);

function showConnect(msg){
  $("connect").hidden = false;
  $("cfgApi").value = API || "";
  if(msg){ $("cfgMsg").textContent = msg; $("cfgMsg").classList.add("bad"); }
}
$("cfgGo").addEventListener("click", async () => {
  const a = $("cfgApi").value.trim().replace(/\/$/,""), t = $("cfgTok").value.trim();
  const m = $("cfgMsg"); m.classList.remove("bad"); m.textContent = "checking…";
  try{
    const r = await fetch(a + "/api/health", { headers:{ Authorization:"Bearer " + t } });
    if(!r.ok) throw new Error("the spine answered " + r.status);
    localStorage.setItem("almanac_api", API = a);
    localStorage.setItem("almanac_token", TOK = t);
    $("connect").hidden = true; load(); startRefresh();
  }catch(e){ m.classList.add("bad"); m.textContent = "could not reach the spine: " + (e.message||e); }
});

let tT = 0;
function toast(m){ const el = $("toast"); el.textContent = m; el.classList.add("on");
  clearTimeout(tT); tT = setTimeout(() => el.classList.remove("on"), 2400); }

/* a notification tap answers the radio; hash-only changes count too */
function answerHash(){
  if(location.hash !== "#radio") return false;
  history.replaceState(null, "", location.pathname + location.search);
  enter(2);
  return true;
}
addEventListener("hashchange", answerHash);

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
/* THE VERSION STAMP (Bryan, 2026-08-04: "where is the version number pill on
   the site" — there wasn't one, and every cache dance was blind because of
   it). One home for the number: the service worker's VERSION. The stamp shows
   what THIS DEVICE is actually serving — not what Pages holds — because that
   gap is exactly the thing worth seeing. No SW answering means the page came
   straight from the network: "fresh". Tap = fetch the newest and reload. */
if("serviceWorker" in navigator){
  const el = document.getElementById("shellv");
  navigator.serviceWorker.addEventListener("message", e => {
    if(e.data && e.data.type === "VERSION" && el)
      el.textContent = String(e.data.version || "").replace("almanac-shell-", "") || "v?";
  });
  const askV = () => navigator.serviceWorker.ready
    .then(r => r.active && r.active.postMessage({type:"VERSION"})).catch(()=>{});
  askV(); setTimeout(askV, 2500);
  setTimeout(() => { if(el && !el.textContent.trim()) el.textContent = "fresh"; }, 4000);
  /* a newer worker takes over seconds after load (install skip-waits) — the
     stamp must re-ask THEN, or it reads the old number all session and "i am
     still on v43" is what Bryan gets told by a device already running v45 */
  navigator.serviceWorker.addEventListener("controllerchange", () => setTimeout(askV, 300));
  el && el.addEventListener("click", async () => {
    el.textContent = "pulling…";
    try{
      const r = await navigator.serviceWorker.getRegistration();
      if(r){
        /* the worker skip-waits at install, so the moment the newer one takes
           the controller is the moment to reload — racing it reloads into the
           OLD shell and the stamp reads like the pull did nothing */
        navigator.serviceWorker.addEventListener("controllerchange",
          () => location.reload(), {once: true});
        await r.update();
        const w = r.waiting;
        if(w) w.postMessage({type: "SKIP_WAITING"});
        setTimeout(() => location.reload(), 3000);   // already-newest, or a browser
        return;                                      // that never fires the event
      }
    }catch(_){/* the reload below still serves the point */}
    location.reload();
  });
}else{
  const el = document.getElementById("shellv");
  if(el) el.textContent = "fresh";
}
if(!configured()) showConnect();
else {
  /* Open the desk → the sheet is pulled once, then the spine is read. Opening
     it IS the ask; he should never have to think about a mirror. */
  load().then(() => { answerHash(); startRefresh(); });
  pullLoadLog().then(ok => { if(ok) load(true); });
  $("readstamp").addEventListener("click", refreshNow);
}
})();
