<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Almanac has moved</title>
<meta http-equiv="refresh" content="0; url=https://bmh-almanac.github.io/">
<link rel="canonical" href="https://bmh-almanac.github.io/">
<meta name="theme-color" content="#13110E">
<style>
  :root{--paper:#F7F3EA;--ink:#191612;--muted:#6B6255;--red:#A83A28}
  @media (prefers-color-scheme:dark){:root{--paper:#13110E;--ink:#EDE6D8;--muted:#948A7C}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
       font:17px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;padding:24px}
  main{max-width:34rem}
  h1{font-weight:400;font-size:1.6rem;margin:0 0 .5rem;border-top:2px solid var(--red);padding-top:.75rem}
  a{color:var(--red)}
  small{color:var(--muted)}
</style>
<script>
  // The shell moved to its own origin (Almanac card #235). Forward the page,
  // the query and the hash: /almanac/desk.html#x -> https://bmh-almanac.github.io/desk.html#x,
  // so a stale #cfg= link or a #reset still lands where the app lives now.
  (function () {
    var tail = location.pathname.replace(/^\/almanac\/?/, "");
    location.replace("https://bmh-almanac.github.io/" + tail + location.search + location.hash);
  })();
</script>
</head>
<body>
<main>
  <h1>Almanac moved.</h1>
  <p>It lives at <a href="https://bmh-almanac.github.io/">bmh-almanac.github.io</a> now &mdash; its own origin, so no other app can wipe it off your phone.</p>
  <p><small>If this page stays, tap the link, then install Almanac from there. The old install can be removed.</small></p>
</main>
</body>
</html>
